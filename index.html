"线程各自有独立的堆。\",\n0,\n\"“堆是共享的。”\"\n],\n[\n\"线程共享同一个栈。\",\n0,\n\"“每个线程有自己的栈。”\"\n]\n],\n\"n\": \"考点：线程共享地址空间资源，私有栈、寄存器、程序计数器。\"\n},\n{\n\"s\": \"考官：“goroutine 比线程轻在哪里？”\",\n\"o\": [\n[\n\"初始栈约 2KB 且可增长，切换在用户态完成，由运行时调度，创建销毁成本低。\",\n1,\n\"“线程切换开销主要是什么？”“保存恢复寄存器、进入内核态，以及缓存变冷。”\"\n],\n[\n\"goroutine 由 CPU 硬件直接调度。\",\n0,\n\"“CPU 不认识 goroutine。”\"\n],\n[\n\"goroutine 不需要栈。\",\n0,\n\"“它有自己的栈，只是很小。”\"\n]\n],\n\"n\": \"考点：goroutine 栈小可增长、用户态调度、成本低；线程切换需进入内核。\"\n}\n]\n},\n{\n\"t\": \"补2　线程安全的办法\",\n\"d\": \"操作系统：除了 lock 还有什么方式保证线程安全\",\n\"tags\": [\n\"线程安全的方式\",\n\"CAS 与无锁\"\n],\n\"card\": {\n\"p\": \"几个人同时改一块白板会写乱。办法不止一种：轮流拿笔（锁）、一笔写完不让别人打断（原子操作）、每人用自己的白板（线程封闭）、白板写好后只许看不许改（不可变）。\",\n\"f\": \"保证线程安全的常见方式：互斥锁与读写锁；原子操作与 CAS（无锁，基于 CPU 原子指令）；不可变对象（创建后不再修改）；线程封闭（局部变量、ThreadLocal，Go 里把数据所有权通过 channel 传递，同一时刻只有一个 goroutine 持有）；并发容器（sync.Map、ConcurrentHashMap）；消息传递（CSP、actor）；写时复制（读多写少）。根本思路是减少共享的可变状态。\",\n\"c\": \"CAS 的问题：只能保证单个变量的原子性；高竞争时自旋浪费 CPU；有 ABA 问题（值从 A 变 B 又变回 A，可用版本号解决）。无锁不等于更快，竞争小时锁也很便宜。volatile 只保证可见性与有序性，不保证 i++ 这类复合操作的原子性。Go 的信条：用通信来共享内存，而不是用共享内存来通信。\",\n\"a\": \"ABA 问题怎么解决？（带版本号的 CAS）ThreadLocal 为什么可能内存泄漏？（线程池里线程长期存活，值不清理）\"\n},\n\"story\": [\n[\nnull,\n\"白板前挤满了人。师傅说：“办法不止一种。”\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“除了加锁，保证线程安全还有哪些方式？”\",\n\"o\": [\n[\n\"原子操作与 CAS、不可变对象、线程封闭（局部变量、ThreadLocal）、消息传递（channel）、并发容器。\",\n1,\n\"“CAS 有什么缺点？”“ABA、自旋开销、只能保证单变量原子。”\"\n],\n[\n\"只能靠加锁，没有其他办法。\",\n0,\n\"“还有很多无锁与封闭的方式。”\"\n],\n[\n\"给变量加 volatile 就能保证复合操作的原子性。\",\n0,\n\"“volatile 不保证 i++ 的原子性。”\"\n]\n],\n\"n\": \"考点：线程安全除了锁，还有原子操作、不可变、线程封闭、消息传递、并发容器。\"\n},\n{\n\"s\": \"考官：“CAS 存在哪些问题？”\",\n\"o\": [\n[\n\"ABA 问题、高竞争下自旋开销大、只能保证单个变量的原子性。\",\n1,\n\"“ABA 怎么解决？”“加版本号。”\"\n],\n[\n\"会导致死锁。\",\n0,\n\"“CAS 是无锁的，不会死锁。”\"\n],\n[\n\"无法在多核上使用。\",\n0,\n\"“恰好依赖多核的原子指令。”\"\n]\n],\n\"n\": \"考点：CAS 的 ABA、自旋开销、单变量限制。\"\n}\n]\n},\n{\n\"t\": \"补3　进程的地盘分布\",\n\"d\": \"操作系统：虚拟地址空间布局（文本段、数据段、BSS、堆、栈）\",\n\"tags\": [\n\"虚拟地址空间布局\"\n],\n\"card\": {\n\"p\": \"每个进程以为自己独占一整条长街，从低到高依次是：代码区、已有货的区、空白待用的区、可以扩建的仓库区、以及从高处往下压的栈区。\",\n\"f\": \"Linux 进程的虚拟地址空间，从低地址到高地址大致是：文本段（代码，只读可执行）、数据段（已初始化的全局与静态变量）、BSS 段（未初始化或初始化为 0 的全局与静态变量，不占可执行文件空间，加载时清零）、堆（malloc 或 new 分配，向高地址增长，由 brk 或 mmap 扩展）、内存映射区（共享库、mmap 文件）、栈（局部变量与函数调用帧，向低地址增长）、最高处是内核空间。\",\n\"c\": \"栈与堆：栈由编译器自动分配释放，速度快，大小有限（栈溢出常见于深递归）；堆由程序员或 GC 管理，可分配大块内存，容易碎片化与泄漏。常量字符串通常在只读数据区。Go 的栈与堆由运行时管理，局部变量是否在栈上由逃逸分析决定。\",\n\"a\": \"BSS 为什么不占文件空间？（只记录大小，加载时由系统清零）栈和堆会撞在一起吗？（中间隔着巨大的虚拟空间，通常先耗尽其中一个的限额）\"\n},\n\"story\": [\n[\nnull,\n\"一条长街，从低到高分好了几个区，每个区的规矩不同。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“BSS 段存放什么？”\",\n\"o\": [\n[\n\"未初始化（或初始化为 0）的全局与静态变量，不占可执行文件空间，加载时清零。\",\n1,\n\"“数据段呢？”“已初始化的全局与静态变量。”\"\n],\n[\n\"已初始化的全局变量。\",\n0,\n\"“那是数据段。”\"\n],\n[\n\"函数的局部变量。\",\n0,\n\"“局部变量在栈上。”\"\n]\n],\n\"n\": \"考点：BSS 存未初始化的全局静态变量，加载时清零，不占文件空间。\"\n},\n{\n\"s\": \"考官：“堆和栈在增长方向与管理方式上有什么区别？”\",\n\"o\": [\n[\n\"堆向高地址增长、由程序员或 GC 管理；栈向低地址增长、自动分配释放、大小有限。\",\n1,\n\"“栈溢出怎么发生？”“深递归或过大的局部变量。”\"\n],\n[\n\"堆向低地址增长，栈向高地址增长。\",\n0,\n\"“说反了。”\"\n],\n[\n\"两者没有区别。\",\n0,\n\"“分配方式和生命周期都不同。”\"\n]\n],\n\"n\": \"考点：堆向高地址、手动或 GC 管理；栈向低地址、自动管理、大小有限。\"\n}\n]\n},\n{\n\"t\": \"补4　分页与分段\",\n\"d\": \"操作系统：两种内存管理机制的区别\",\n\"tags\": [\n\"分页与分段\"\n],\n\"card\": {\n\"p\": \"分页是把仓库和货物都切成大小一样的格子，按格子编号；分段是按货物的类别（代码、数据、栈）整块划分，各块大小不一。\",\n\"f\": \"分页：把物理内存划分为固定大小的页框，把逻辑地址空间划分为同样大小的页（通常 4KB），用页表映射；对程序员透明，没有外部碎片，但最后一页有内部碎片；便于实现虚拟内存与按页换入换出。分段：按程序的逻辑单位（代码段、数据段、栈段）划分，长度不固定，用段表（基址加界限）映射；便于共享与保护，但会产生外部碎片。段页式：先分段，再在段内分页。\",\n\"c\": \"区别要点：划分依据（固定大小 vs 逻辑意义）、碎片（分页有内部碎片，分段有外部碎片）、是否对程序员可见（分页透明，分段可见）。现代 Linux 在 x86-64 上基本只用分页（段基址设为 0，分段退化），内存保护和共享通过页表项的权限位实现。大页（2MB、1GB）可以减少页表项和 TLB 未命中。\",\n\"a\": \"为什么现代系统更偏向分页？（实现简单、无外部碎片、便于虚拟内存）页表项里有哪些标志位？（有效位、读写权限、脏位、访问位）\"\n},\n\"story\": [\n[\nnull,\n\"仓库管理员有两种划分仓库的办法：切成一样大的格子，或按货物类别整块划分。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“分页和分段的主要区别是什么？”\",\n\"o\": [\n[\n\"分页按固定大小划分、对程序透明、无外部碎片；分段按逻辑意义划分、大小可变、便于共享保护，但有外部碎片。\",\n1,\n\"“现代 Linux 主要用哪个？”“分页。”\"\n],\n[\n\"分页的大小可变，分段的大小固定。\",\n0,\n\"“说反了。”\"\n],\n[\n\"两者都按固定大小划分。\",\n0,\n\"“分段大小不固定。”\"\n]\n],\n\"n\": \"考点：分页固定大小、透明、有内部碎片；分段按逻辑单位、有外部碎片。\"\n},\n{\n\"s\": \"考官：“现代 Linux 内存管理主要依赖哪种机制？”\",\n\"o\": [\n[\n\"主要依赖分页，段基址基本设为 0，分段退化。\",\n1,\n\"“权限怎么控制？”“通过页表项的权限位。”\"\n],\n[\n\"只使用分段。\",\n0,\n\"“主要是分页。”\"\n],\n[\n\"段页式并重。\",\n0,\n\"“现代 64 位系统几乎只用分页。”\"\n]\n],\n\"n\": \"考点：现代 Linux 以分页为主，分段退化。\"\n}\n]\n},\n{\n\"t\": \"补5　三种拥塞控制算法\",\n\"d\": \"计算机网络：Reno、Cubic、BBR\",\n\"tags\": [\n\"Reno / Cubic / BBR\"\n],\n\"card\": {\n\"p\": \"三种开车的风格：Reno 一路慢慢加油、一堵就大幅减速；Cubic 记着上次堵车的位置，先猛加速、接近时收脚、过了再试探；BBR 不等堵车，而是测出路的宽度和最短行车时间，按需要匀速开。\",\n\"f\": \"Reno：慢启动、拥塞避免（AIMD：每个 RTT 加 1 个 MSS，丢包后乘性减半）、快重传与快恢复，以丢包作为拥塞信号。Cubic：Linux 默认，窗口按三次函数增长，以上次丢包时的窗口 W_max 为参照：远离时快速增长，接近时放缓，超过后再探测；增长与 RTT 无关，适合高带宽高延迟链路，仍以丢包为信号。BBR（Google）：基于模型，估计瓶颈带宽与最小往返时延，按带宽乘以时延（BDP）控制在途数据量，不把丢包当拥塞信号。\",\n\"c\": \"BBR 的状态：Startup、Drain、ProbeBW、ProbeRTT。优点：高丢包链路（无线、跨洋）吞吐更好，缓解缓冲区膨胀（bufferbloat）导致的高延迟。缺点：与 Cubic 共存时早期版本存在公平性问题，后续有 BBRv2 等改进。选择：数据中心内常用 Cubic 或 DCTCP；跨国长距离、丢包较多的链路可考虑 BBR。\",\n\"a\": \"为什么基于丢包的算法在浅缓冲区容易吞吐低？（随机丢包被误判成拥塞）bufferbloat 是什么？（缓冲区过大造成排队延迟）\"\n},\n\"story\": [\n[\nnull,\n\"三位司机上路：一位凭感觉，一位记着上次堵车的位置，一位提前测好路况。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“Cubic 的窗口增长有什么特点？”\",\n\"o\": [\n[\n\"按三次函数、以上次丢包窗口为参照：远离时增长快，接近时放缓，超过后再探测，且与 RTT 无关。\",\n1,\n\"“Linux 默认用哪个？”“Cubic。”\"\n],\n[\n\"和 Reno 一样每个 RTT 线性加 1 个 MSS。\",\n0,\n\"“那是 Reno 的拥塞避免。”\"\n],\n[\n\"窗口固定不变。\",\n0,\n\"“它会动态增长。”\"\n]\n],\n\"n\": \"考点：Cubic 窗口按三次函数增长，与 RTT 无关，Linux 默认。\"\n},\n{\n\"s\": \"考官：“BBR 和基于丢包的算法有什么本质区别？”\",\n\"o\": [\n[\n\"BBR 不把丢包当拥塞信号，而是估计瓶颈带宽与最小 RTT 来控制发送速率，高丢包链路表现更好，也缓解缓冲区膨胀。\",\n1,\n\"“缺点呢？”“与其他算法共存时可能有公平性问题。”\"\n],\n[\n\"BBR 也是靠丢包减半窗口。\",\n0,\n\"“那是 Reno 的做法。”\"\n],\n[\n\"BBR 只能用于 UDP。\",\n0,\n\"“BBR 用于 TCP，QUIC 也支持。”\"\n]\n],\n\"n\": \"考点：BBR 基于带宽与最小 RTT 的模型，不依赖丢包。\"\n}\n]\n},\n{\n\"t\": \"补6　B+ 树三层能存多少\",\n\"d\": \"MySQL：怎么计算数据量使 B+ 树不超过三层\",\n\"tags\": [\n\"B+ 树容量计算\"\n],\n\"card\": {\n\"p\": \"算一座三层的目录楼能放多少本书：一层楼有多少个房间指向下一层，再乘上最底层每个房间放多少本。\",\n\"f\": \"前提：InnoDB 页 16KB。非叶子节点每项 = 主键 + 指针：bigint 主键 8 字节，指针约 6 字节，一项约 14 字节，一页约 16384 / 14 ≈ 1170 个指针（忽略页头，实际略少）。叶子节点存整行数据：若一行约 1KB，一页约 16 行。三层 B+ 树：根节点一层、中间一层、叶子一层，总行数约 1170 × 1170 × 16 ≈ 2190 万，所以常说“单表约两千万行以内三层”。\",\n\"c\": \"变量：主键越短（如 int 4 字节，一项约 10 字节，一页约 1600 项）扇出越大；行越小，叶子页能放的行越多，同样层数能存更多。例如一行 200 字节，一页约 80 行，三层可达上亿行。这是估算，实际受页填充率、行长度、索引碎片影响。三层意味着一次查找约 3 次 IO，根页通常常驻内存，实际更少。这也是单表数据量大了考虑分库分表的参考依据之一，但不是硬性标准。\",\n\"a\": \"为什么不建议用过长的主键？（扇出变小、树更高、二级索引也更大）两层最多存多少？（1170 × 16 ≈ 1.9 万行）\"\n},\n\"story\": [\n[\nnull,\n\"账房先生拿出算盘：一页 16KB，一项目录 14 字节，一页放多少个？\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“主键 bigint，每行约 1KB，页 16KB，三层 B+ 树大约能存多少行？”\",\n\"o\": [\n[\n\"非叶子每页约 1170 个指针，叶子每页约 16 行，1170 × 1170 × 16 ≈ 2000 万行。\",\n1,\n\"“怎么让它存得更多？”“行更小、主键更短。”\"\n],\n[\n\"大约 20 万行。\",\n0,\n\"“数量级差了 100 倍。”\"\n],\n[\n\"大约 20 亿行。\",\n0,\n\"“数量级偏大太多。”\"\n]\n],\n\"n\": \"考点：三层 B+ 树按每行 1KB 约两千万行；公式为扇出的平方乘叶子每页行数。\"\n},\n{\n\"s\": \"考官：“行的大小和主键长度对 B+ 树层数有什么影响？”\",\n\"o\": [\n[\n\"行越小叶子页存的行越多，主键越短非叶子扇出越大，同样层数能存更多数据。\",\n1,\n\"“这是精确值吗？”“不是，是估算。”\"\n],\n[\n\"行越小树越高。\",\n0,\n\"“恰好相反。”\"\n],\n[\n\"与行大小无关。\",\n0,\n\"“叶子页每页行数取决于行大小。”\"\n]\n],\n\"n\": \"考点：行越小、主键越短，同样层数容量越大。\"\n}\n]\n},\n{\n\"t\": \"补7　MVCC 能解决幻读吗\",\n\"d\": \"MySQL：快照读、当前读与幻读的边界\",\n\"tags\": [\n\"MVCC 与幻读\"\n],\n\"card\": {\n\"p\": \"MVCC 能让你读同一份“旧照片”，所以重复看结果不变。但如果你伸手去改了别人刚放进来的东西，就会看到“新出现的东西”。\",\n\"f\": \"在可重复读（RR）下：快照读（普通 SELECT）通过 MVCC，ReadView 在第一次读时生成并复用，多次读结果一致，避免了幻读。当前读（SELECT ... FOR UPDATE、UPDATE、DELETE）读最新版本，靠临键锁（记录锁加间隙锁）阻止其他事务在范围内插入，从而避免幻读。\",\n\"c\": \"但并非绝对：事务 A 先快照读，事务 B 插入一行并提交，事务 A 对这一行做 UPDATE（当前读，能看到并修改它），之后 A 再快照读就会看到这一行（因为是自己修改过的版本），出现幻读。所以结论是：MVCC 加临键锁在很大程度上解决了幻读，但不能绝对保证；要完全避免需要一致地使用当前读加锁，或使用串行化。面试时要把快照读与当前读分开说。\",\n\"a\": \"RC 下有幻读吗？（有，每次读都是新的 ReadView，会看到新插入的行）间隙锁会带来什么问题？（降低并发，可能增加死锁）\"\n},\n\"story\": [\n[\nnull,\n\"账房先生翻出两张照片：事务开始时拍的，和自己动手改过之后的。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“MVCC 能完全解决幻读吗？”\",\n\"o\": [\n[\n\"不能完全解决：快照读靠 MVCC，当前读靠临键锁；先快照读，再对别人新插入的行做 UPDATE，之后再读仍可能出现幻读。\",\n1,\n\"“怎么避免？”“一致地用当前读加锁，或使用串行化。”\"\n],\n[\n\"能，RR 下完全不会出现幻读。\",\n0,\n\"“有特殊情况。”\"\n],\n[\n\"能，只要使用读已提交就行。\",\n0,\n\"“RC 下反而会有幻读。”\"\n]\n],\n\"n\": \"考点：MVCC 加临键锁在很大程度上解决幻读，但快照读与当前读混用时仍可能出现。\"\n},\n{\n\"s\": \"考官：“当前读是如何防止幻读的？”\",\n\"o\": [\n[\n\"通过临键锁（记录锁加间隙锁）锁住范围，阻止其他事务在间隙中插入。\",\n1,\n\"“代价呢？”“并发降低，可能增加死锁。”\"\n],\n[\n\"通过 ReadView 看历史版本。\",\n0,\n\"“那是快照读。”\"\n],\n[\n\"通过 undo log 回滚。\",\n0,\n\"“与回滚无关。”\"\n]\n],\n\"n\": \"考点：当前读用临键锁防止其他事务在范围内插入。\"\n}\n]\n},\n{\n\"t\": \"补8　Agent 与普通 Chat\",\n\"d\": \"Agent：本质区别与核心组件\",\n\"tags\": [\n\"Agent 与 Chat 的区别\"\n],\n\"card\": {\n\"p\": \"普通 Chat 像一位只会回答问题的顾问，你问一句他答一句。Agent 像一位能自己把活干完的员工：拿到目标，拆步骤，找工具，检查结果，不对就重来。\",\n\"f\": \"本质区别：Chat 是根据上下文生成文本，被动响应，不与外部环境交互；Agent 以目标为导向，能自主规划多步任务、调用工具与环境交互、观察反馈并循环迭代，直到完成或终止，控制流由模型动态决定，并与外部世界形成闭环。核心组件：LLM（决策核心）、规划（任务分解与反思）、记忆（短期上下文、长期存储）、工具（API、检索、代码执行等），加上控制循环、终止条件与护栏。\",\n\"c\": \"判断标准：有没有“行动—观察—再决策”的循环。只是调用一次模型加一次检索，更像 workflow 或增强的 Chat。Agent 的代价：延迟、成本、不确定性更高，需要评测与护栏。落地建议：从最简单的方案开始，必要时才增加自主性。\",\n\"a\": \"为什么 Agent 更难评测？（路径不固定，结果与过程都要评）Agent 与 RPA、工作流有什么不同？（决策由模型动态产生）\"\n},\n\"story\": [\n[\nnull,\n\"总管说：“能回答问题的是顾问，能把事办成的才是员工。”\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“AI Agent 与普通 LLM Chat 的本质区别是什么？”\",\n\"o\": [\n[\n\"Agent 以目标为导向，能自主规划、调用工具、观察结果并循环迭代，与外部环境形成闭环；Chat 只是根据上下文生成文本。\",\n1,\n\"“核心组件有哪些？”“LLM、规划、记忆、工具，以及控制循环。”\"\n],\n[\n\"Agent 用了更大的模型。\",\n0,\n\"“和模型大小无关。”\"\n],\n[\n\"Agent 不需要提示词。\",\n0,\n\"“仍需要提示词。”\"\n]\n],\n\"n\": \"考点：Agent 的本质是目标导向、自主规划、工具交互与闭环迭代。\"\n},\n{\n\"s\": \"考官：“怎么判断一个系统是 Agent，还是增强的 Chat？”\",\n\"o\": [\n[\n\"看是否有“行动—观察—再决策”的循环，由模型动态决定下一步。\",\n1,\n\"“只做一次检索再生成呢？”“更像 workflow 或 RAG。”\"\n],\n[\n\"看是否使用了向量数据库。\",\n0,\n\"“RAG 也用向量库，但不一定是 Agent。”\"\n],\n[\n\"看提示词是否很长。\",\n0,\n\"“提示词长度不能说明。”\"\n]\n],\n\"n\": \"考点：Agent 的判断标准是行动与观察的循环、模型动态决策。\"\n}\n]\n},\n{\n\"t\": \"补9　意图识别\",\n\"d\": \"Agent：LLM Router、规则分类、微调分类器怎么选\",\n\"tags\": [\n\"意图识别\"\n],\n\"card\": {\n\"p\": \"客人一进门，得先判断他是来问路的、投诉的，还是买东西的，才知道该找哪位同事。判断的办法有：看关键词、训练一个小分类员、让一位见多识广的顾问来判断。\",\n\"f\": \"三类方案：规则或关键词、正则（快、便宜、可解释，覆盖有限）；微调的小模型分类器（如 BERT 类，低延迟、稳定、成本低，需要标注数据）；LLM Router（零样本或少样本提示，灵活、冷启动快、能处理长尾，但延迟、成本较高，输出可能不稳定）。还可以用向量检索匹配相似意图。\",\n\"c\": \"实践常用分层混合：规则兜底明确场景，小模型处理高频稳定意图，LLM 处理长尾和低置信度的情况。要有置信度阈值和兜底（澄清追问、转人工、通用回复）。多意图与槽位填充可以让 LLM 输出结构化结果。评估看准确率、召回率、混淆矩阵，把线上难例回流到训练与评测集。\",\n\"a\": \"冷启动没有标注数据怎么办？（先用 LLM Router，积累数据后蒸馏成小模型）路由错误的代价有多大？（取决于是否会触发有副作用的工具，需要确认）\"\n},\n\"story\": [\n[\nnull,\n\"门口的接待员要决定把客人带去哪个窗口，三位候选各有长短。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“意图识别用 LLM Router、规则还是微调分类器？”\",\n\"o\": [\n[\n\"按场景分层混合：规则兜底明确场景，小模型处理高频稳定意图，LLM 处理长尾与低置信度，并设置置信度兜底。\",\n1,\n\"“冷启动怎么办？”“先用 LLM，积累数据后蒸馏成小模型。”\"\n],\n[\n\"只能用 LLM。\",\n0,\n\"“延迟与成本都高。”\"\n],\n[\n\"只能用关键词规则。\",\n0,\n\"“覆盖面有限，难处理长尾。”\"\n]\n],\n\"n\": \"考点：意图识别常用规则、小模型、LLM 的分层混合。\"\n},\n{\n\"s\": \"考官：“识别的置信度很低时应该怎么办？”\",\n\"o\": [\n[\n\"交给 LLM 精细判断、向用户澄清追问，或兜底到通用回复与人工，并把难例回流。\",\n1,\n\"“为什么要回流？”“用来补充训练与评测集。”\"\n],\n[\n\"随便选一个最可能的执行。\",\n0,\n\"“可能触发错误的有副作用操作。”\"\n],\n[\n\"直接报错退出。\",\n0,\n\"“体验很差。”\"\n]\n],\n\"n\": \"考点：低置信度要有澄清、升级或兜底策略，难例回流。\"\n}\n]\n},\n{\n\"t\": \"补10　工具失败与工具幻觉\",\n\"d\": \"Agent：工具调用失败怎么兜底，如何避免错误调用工具\",\n\"tags\": [\n\"工具失败兜底\",\n\"工具幻觉\"\n],\n\"card\": {\n\"p\": \"工具出错，不能装作没事，也不能一直重试。要分清是“说错了话”还是“工具病了”，再决定改口、重试还是换人。\",\n\"f\": \"失败兜底：先分类。参数错误，把结构化的错误信息回传给模型让它修正后重试；临时故障（超时、限流），指数退避重试并限制次数；不可恢复（无权限、服务下线），降级、换备选工具、返回缓存，或如实告知用户，不能编造结果。再配合超时、熔断、幂等。工具幻觉：模型调用不存在的工具、编造参数、选错工具，或在不该调用时调用。\",\n\"c\": \"避免工具幻觉：工具描述清晰（何时用、何时不该用、参数含义与示例）；严格的 JSON schema（枚举、类型、必填）；工具白名单与精简工具集（太多会混淆，可分层路由或检索工具）；使用结构化输出或约束解码；执行前校验参数合法性与权限；高风险操作二次确认；用评测集统计工具调用准确率。\",\n\"a\": \"最大重试次数怎么定？（兼顾成功率与成本，通常 2 到 3 次）怎么知道模型在乱调工具？（trace 加工具调用准确率指标）\"\n},\n\"story\": [\n[\nnull,\n\"工具箱里突然有一把扳手坏了，总管要阿智想好：改口、重试，还是换工具。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“工具调用失败怎么兜底？”\",\n\"o\": [\n[\n\"区分错误类型：参数错误回传错误信息让模型修正；临时故障退避重试并限次；不可恢复则降级、换备选或如实告知，不编造结果。\",\n1,\n\"“重试要注意什么？”“限制次数，工具要幂等。”\"\n],\n[\n\"无限重试直到成功。\",\n0,\n\"“会拖垮下游，也浪费成本。”\"\n],\n[\n\"忽略错误，让模型自己编一个结果。\",\n0,\n\"“会产生严重的幻觉。”\"\n]\n],\n\"n\": \"考点：错误分类处理、有限重试、降级与诚实告知。\"\n},\n{\n\"s\": \"考官：“什么是工具幻觉？怎么避免？”\",\n\"o\": [\n[\n\"指模型调用不存在的工具、编造参数或选错工具；用清晰描述、严格 schema 校验、白名单、精简工具集、执行前校验与关键操作确认。\",\n1,\n\"“怎么度量？”“工具调用准确率。”\"\n],\n[\n\"指工具返回的数据不准确。\",\n0,\n\"“那是数据质量问题。”\"\n],\n[\n\"把 temperature 调高就能解决。\",\n0,\n\"“调高只会更随机。”\"\n]\n],\n\"n\": \"考点：工具幻觉指错误调用，靠 schema、白名单、校验与确认来避免。\"\n}\n]\n},\n{\n\"t\": \"补11　流式响应\",\n\"d\": \"Agent：LLM 流式返回，工具调用的 JSON 参数流式怎么处理\",\n\"tags\": [\n\"流式响应\",\n\"工具参数流式解析\"\n],\n\"card\": {\n\"p\": \"流式就像边写边念：每写几个字就读给你听，不用等整篇写完。但读到一半的参数是残缺的，不能当成完整的指令去执行。\",\n\"f\": \"文本流式：通常用 SSE 逐块返回，降低首字延迟。服务端要流式读取并转发，关闭反向代理的响应缓冲（如 nginx 的 proxy_buffering），保持连接与心跳，客户端断开时要取消上游请求并释放资源，注意背压。工具调用参数流式：参数以 JSON 片段（delta）分批到达，不能每收到一块就直接解析。做法：按调用的 index 或 id 累积拼接，等该调用结束（如 finish_reason 为 tool_calls，或内容块结束事件）再完整解析、校验、执行。\",\n\"c\": \"边收边展示：可以用容错的增量 JSON 解析器，仅用于 UI 预览，执行必须等完整参数。并行多个工具调用时，按 index 分别累积。解析失败（截断、非法 JSON）：让模型重试或做有限的修复。前端要增量渲染，Markdown 渲染要处理未闭合的语法。选择：简单展示用 SSE，需要双向交互用 WebSocket。\",\n\"a\": \"为什么不能边收边执行？（参数不完整，可能执行错误的操作）流式场景下怎么做超时？（首包超时与整体超时分开设置）\"\n},\n\"story\": [\n[\nnull,\n\"阿智一边听大脑口述指令，一边记笔记，等一句话说完，才敢动手。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“流式返回工具调用的 JSON 参数时应该怎么处理？”\",\n\"o\": [\n[\n\"按调用的 index 或 id 累积拼接参数片段，等该调用结束后再完整解析并执行；边收边展示可用容错的增量解析，但不能据此执行。\",\n1,\n\"“并行工具调用呢？”“按 index 分别累积。”\"\n],\n[\n\"每收到一个片段就直接 JSON 解析并执行。\",\n0,\n\"“片段不完整，会出错。”\"\n],\n[\n\"忽略流式，只在最后用正则提取。\",\n0,\n\"“不可靠，也失去了流式的意义。”\"\n]\n],\n\"n\": \"考点：工具参数流式要累积完整后再解析执行。\"\n},\n{\n\"s\": \"考官：“做 LLM 流式服务时有哪些常见的坑？”\",\n\"o\": [\n[\n\"反向代理或网关的响应缓冲会让流式失效，需要关闭缓冲；客户端断开时要取消上游请求以释放资源。\",\n1,\n\"“还有吗？”“连接保活与背压。”\"\n],\n[\n\"SSE 不需要保持连接。\",\n0,\n\"“SSE 本身就是长连接。”\"\n],\n[\n\"流式场景不需要处理客户端断开。\",\n0,\n\"“不处理会浪费上游资源。”\"\n]\n],\n\"n\": \"考点：流式要关闭代理缓冲、处理断开取消、保活与背压。\"\n}\n]\n},\n{\n\"t\": \"补12　中断后安全恢复\",\n\"d\": \"Agent：执行中断后怎么恢复，工具调用如何不重复\",\n\"tags\": [\n\"中断恢复与幂等\"\n],\n\"card\": {\n\"p\": \"工人干到一半停电了，重启后不能从头再来，更不能把已经付过的钱再付一遍。得有一本记着“做到哪一步、哪些已经做完”的账。\",\n\"f\": \"关键点：一，每步持久化状态（checkpoint）：消息历史、已完成步骤、中间结果、已发出的工具调用及其结果；二，有副作用的工具调用必须幂等：用幂等键或去重表，先记录意图再执行，恢复时先检查是否已执行；三，恢复时从最近的 checkpoint 继续，已执行的步骤读取已记录的结果，不重复执行，只执行尚未完成的；四，处理“已发出但未确认”的不确定状态（查询对方状态或人工确认）。\",\n\"c\": \"工具：LangGraph 的 checkpointer 配合 thread_id；更强的 durable execution 框架（如 Temporal）。副作用的补偿：Saga 或补偿事务。要有超时与心跳检测发现中断，高风险步骤加入人工确认点。注意至少一次（at-least-once）的投递会导致重复执行，所以幂等是安全恢复的核心。\",\n\"a\": \"checkpoint 多久保存一次？（每个节点之后）恢复时模型的输出会不同怎么办？（重放时使用已记录的结果，而不是重新调用模型）\"\n},\n\"story\": [\n[\nnull,\n\"夜里停电，账本上清楚记着：做到第三步，付款已确认。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“Agent 执行中断后，怎么安全恢复？”\",\n\"o\": [\n[\n\"每步持久化 checkpoint，并让有副作用的工具调用幂等（幂等键或去重），恢复时依据记录跳过已执行的步骤。\",\n1,\n\"“不确定的状态怎么办？”“查询对方状态或人工确认。”\"\n],\n[\n\"重启后从头重新执行全部步骤。\",\n0,\n\"“会重复产生副作用。”\"\n],\n[\n\"只保存最终答案。\",\n0,\n\"“无法恢复中间过程。”\"\n]\n],\n\"n\": \"考点：checkpoint 加幂等，恢复时跳过已完成步骤。\"\n},\n{\n\"s\": \"考官：“为什么恢复时不能直接重放所有工具调用？”\",\n\"o\": [\n[\n\"有副作用的调用（转账、发邮件）会被重复执行；应读取已记录的结果，只执行尚未完成的步骤。\",\n1,\n\"“怎么防止重复？”“幂等键、去重表。”\"\n],\n[\n\"因为工具调用很慢。\",\n0,\n\"“主要问题是副作用。”\"\n],\n[\n\"因为模型不支持重放。\",\n0,\n\"“不是模型的限制。”\"\n]\n],\n\"n\": \"考点：重放要避免重复副作用，用记录的结果与幂等控制。\"\n}\n]\n},\n{\n\"t\": \"补13　召回不准怎么办\",\n\"d\": \"Agent / RAG：分层排查与优化\",\n\"tags\": [\n\"召回排查与优化\"\n],\n\"card\": {\n\"p\": \"图书馆总是找不到对的那几页。先别怪大脑，先查：书切得合不合适、标签贴得对不对、问法有没有问题、找书的办法够不够。\",\n\"f\": \"排查第一步：建立带标注的评测集（问题对应的相关文档），用 Recall@k 判断问题在检索还是生成。再沿链路逐层看：切块（过大过小、跨块丢上下文、表格与图片解析丢失）；嵌入模型（领域不匹配、中英文、长度截断）；查询（口语化、指代、多意图）；检索方式（纯向量漏专有名词）；top-k 与阈值；元数据过滤；ANN 参数（如 efSearch）；数据质量（重复、过期、噪声）。\",\n\"c\": \"优化手段：先修数据与切块（结构感知、重叠、父子块）；混合检索（BM25 加向量）；重排序（reranker）；查询改写（补全指代、拆分多意图、同义扩展、HyDE）；调整 top-k 与阈值；换更合适的嵌入模型并重建索引。优先级一般是数据与切块 > 混合检索与重排 > 查询改写。每次改动用评测集验证，不要凭几个例子判断。\",\n\"a\": \"为什么不能只加大 top-k？（噪声变多，占用上下文，生成变差）怎么发现某类问题召回差？（按问题类型分桶统计 Recall@k）\"\n},\n\"story\": [\n[\nnull,\n\"图书馆里，阿智一层层排查为什么总找不到对的那几页。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“RAG 召回不准，排查的第一步是什么？”\",\n\"o\": [\n[\n\"建立带标注的评测集，用 Recall@k 判断问题在检索还是生成，再逐层看切块、嵌入、查询、检索参数。\",\n1,\n\"“然后呢？”“先修数据与切块，再混合检索与重排。”\"\n],\n[\n\"直接换更大的生成模型。\",\n0,\n\"“还没定位问题。”\"\n],\n[\n\"直接把 top-k 加到 100。\",\n0,\n\"“噪声更多，上下文更长。”\"\n]\n],\n\"n\": \"考点：先分层定位再针对性优化，用评测集验证。\"\n},\n{\n\"s\": \"考官：“用户提问口语化、有指代，召回差，怎么办？”\",\n\"o\": [\n[\n\"做查询改写：补全指代、拆分多意图、同义扩展、HyDE，并配合混合检索与重排。\",\n1,\n\"“改写会有什么风险？”“可能偏离原意，要评估。”\"\n],\n[\n\"要求用户必须规范提问。\",\n0,\n\"“体验差，不现实。”\"\n],\n[\n\"只能增大 chunk 大小。\",\n0,\n\"“与口语化无关。”\"\n]\n],\n\"n\": \"考点：口语化与指代用查询改写，配合混合检索与重排。\"\n}\n]\n},\n{\n\"t\": \"补14　Agent 怎么评估\",\n\"d\": \"Agent：任务完成率、步骤效率、工具调用准确率\",\n\"tags\": [\n\"Agent 评估指标\"\n],\n\"card\": {\n\"p\": \"考核员工不能只看结果交没交，还要看他走了多少弯路、有没有用对工具。\",\n\"f\": \"核心指标：任务完成率（端到端是否达成目标，需要明确的判定标准）；步骤效率（平均步数、与最优路径的比值、冗余或重复调用）；工具调用准确率（选对工具、参数正确、必要时才调用）。辅助指标：延迟、成本（token）、稳定性（多次运行的方差，如 pass@k）、安全性（越权与注入成功率）、用户满意度。\",\n\"c\": \"评测方法：标注数据集，加规则或 LLM 判官，再加人工抽检；轨迹评估（逐步检查工具选择与参数）；改动前后做回归对比。LLM 判官要注意位置、长度、自我偏好偏差，并与人工标注校准。线上用 tracing 与监控，把失败案例回流到评测集。\",\n\"a\": \"任务完成率怎么判定？（规则、参考答案、LLM 判官、环境状态检查）为什么多次运行要看方差？（同一任务结果不稳定也是问题）\"\n},\n\"story\": [\n[\nnull,\n\"总管给阿智设了三张考核表：完成了吗，绕路了吗，用对工具了吗。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“评估一个 Agent 系统，核心看哪些指标？”\",\n\"o\": [\n[\n\"任务完成率、步骤效率（步数与冗余）、工具调用准确率，再加延迟、成本与稳定性。\",\n1,\n\"“怎么发现问题？”“看轨迹与 trace。”\"\n],\n[\n\"只看回答的文采。\",\n0,\n\"“重点是任务是否完成。”\"\n],\n[\n\"只看 token 数。\",\n0,\n\"“那只是成本的一个方面。”\"\n]\n],\n\"n\": \"考点：任务完成率、步骤效率、工具调用准确率，辅以延迟成本稳定性。\"\n},\n{\n\"s\": \"考官：“为什么要关注步骤效率？”\",\n\"o\": [\n[\n\"即使最终完成，过多或重复的步骤会增加延迟与成本，也暗示规划或工具描述有问题。\",\n1,\n\"“怎么优化？”“改进规划、精简工具、缓存。”\"\n],\n[\n\"步骤越多说明越认真。\",\n0,\n\"“只会更慢更贵。”\"\n],\n[\n\"步骤数与成本无关。\",\n0,\n\"“每一步都有调用成本。”\"\n]\n],\n\"n\": \"考点：步骤效率影响延迟与成本，也反映规划质量。\"\n}\n]\n},\n{\n\"t\": \"补15　一万人排行榜\",\n\"d\": \"Redis：ZSet 实现排行榜，同分排序与更大规模\",\n\"tags\": [\n\"排行榜实战\"\n],\n\"card\": {\n\"p\": \"计分牌上，每个人名字旁边有个分数，谁加分了，牌子自动重新排。看前十名、看自己第几名，都不用重新排一遍。\",\n\"f\": \"一万人用一个 ZSet 就够：ZADD 设分、ZINCRBY 加分（原子），ZREVRANGE 0 9 WITHSCORES 取前十，ZREVRANK 查个人名次，ZSCORE 查分数。ZSet 底层是跳表加字典，更新与查询都是 O(log n)，一万人的规模毫无压力。分页用 ZREVRANGE 的范围参数。\",\n\"c\": \"同分排序：把时间信息编码进 score（如分数加上反向时间戳的小数部分），让先达到者排前，或另存时间做二次排序。周期榜（日榜、周榜）：按周期建不同的 key 并设置过期。更大规模（千万级）：按分数段或用户哈希分片成多个 ZSet，只保留 TopN 榜单，或用定期汇总。一致性：以数据库为准，Redis 做缓存，定期校准；热点榜单可以再加本地缓存。\",\n\"a\": \"为什么用 ZSet 而不是 List 加排序？（每次排序 O(n log n)，ZSet 插入就有序）并发更新同一个用户怎么办？（ZINCRBY 是原子的）\"\n},\n\"story\": [\n[\nnull,\n\"计分牌前挤满了人，每个人一加分，牌子就自己重新排。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“一万人的实时排行榜怎么用 Redis 实现？”\",\n\"o\": [\n[\n\"用一个 ZSet：ZINCRBY 加分，ZREVRANGE 取前 N，ZREVRANK 查个人名次，都是 O(log n)，一个 key 就够。\",\n1,\n\"“同分怎么办？”“把时间编码进 score，先到先排。”\"\n],\n[\n\"用 List，每次更新后重新排序。\",\n0,\n\"“排序成本高。”\"\n],\n[\n\"用 Hash 存分数，查询时在应用层排序。\",\n0,\n\"“数据量大时很慢。”\"\n]\n],\n\"n\": \"考点：排行榜用 ZSet，更新与查询 O(log n)。\"\n},\n{\n\"s\": \"考官：“同分时想让先达到的人排前面，怎么做？”\",\n\"o\": [\n[\n\"把时间信息编码进 score（如加上反向时间戳的小数部分），或另存时间做二次排序。\",\n1,\n\"“更大规模怎么办？”“分片，只保留 TopN。”\"\n],\n[\n\"Redis 不能处理同分。\",\n0,\n\"“可以，同分按成员字典序。”\"\n],\n[\n\"同分一定随机排列。\",\n0,\n\"“同分有确定的顺序。”\"\n]\n],\n\"n\": \"考点：同分排序可把时间编码进 score。\"\n}\n]\n},\n{\n\"t\": \"补16　sync.Map 的实现\",\n\"d\": \"Go：如何做到并发安全，与加锁 map 的区别\",\n\"tags\": [\n\"sync.Map 原理\"\n],\n\"card\": {\n\"p\": \"sync.Map 像一间有“公示栏”和“内部档案室”的办公室：常见的东西贴在公示栏，人人可看、不用排队；新的和变动的先放档案室，需要时再整理上墙。\",\n\"f\": \"以 Go 1.9 到 1.23 的实现为例：内部有 read（原子读取的只读 map，无锁读取）、dirty（带互斥锁的 map）、mu 与 misses 计数。读：先查 read，命中无锁；未命中且 dirty 里有新数据，则加锁查 dirty，并 misses 加一；misses 达到 dirty 长度时，把 dirty 提升为 read。写已存在的 key：在 read 里通过 CAS 更新；写新 key：加锁写入 dirty。删除是逻辑删除（标记）。\",\n\"c\": \"对比 map 加 RWMutex：读多写少、键集合相对稳定时，sync.Map 读无锁更快；写多、新 key 多时，sync.Map 要加锁并提升复制，反而慢；sync.Map 没有泛型和 Len，类型不安全，API 较少。Go 1.24 起 sync.Map 底层改为并发哈希字典树（HashTrieMap），特性有变化，但对外语义不变。选择：先用加锁 map，有明确的读多写少场景再考虑 sync.Map。\",\n\"a\": \"misses 的作用是什么？（决定何时把 dirty 提升为 read，摊销成本）为什么不一直用 sync.Map？（写多时性能差，类型不安全）\"\n},\n\"story\": [\n[\nnull,\n\"办公室里，常用的资料贴在公示栏，新资料先放档案室。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“sync.Map 是如何做到并发安全且读很快的？”\",\n\"o\": [\n[\n\"读路径先查只读的 read map（原子操作，无锁），未命中再加锁查 dirty；misses 达到阈值后把 dirty 提升为 read。\",\n1,\n\"“这是哪个版本的实现？”“Go 1.9 到 1.23，1.24 起改为 HashTrieMap。”\"\n],\n[\n\"每次读写都加一把全局锁。\",\n0,\n\"“那样读就不快了。”\"\n],\n[\n\"底层是多个分片锁。\",\n0,\n\"“不是分片锁。”\"\n]\n],\n\"n\": \"考点：sync.Map 的 read 加 dirty 结构，读无锁，misses 触发提升。\"\n},\n{\n\"s\": \"考官：“sync.Map 与 map 加 RWMutex 怎么选？”\",\n\"o\": [\n[\n\"读多写少、键相对稳定选 sync.Map；写多、键频繁变化、需要类型安全和 Len 时用加锁 map。\",\n1,\n\"“为什么写多时 sync.Map 慢？”“要加锁并有提升与复制成本。”\"\n],\n[\n\"sync.Map 总是更快。\",\n0,\n\"“写多时更慢。”\"\n],\n[\n\"加锁 map 不能并发读。\",\n0,\n\"“RWMutex 允许并发读。”\"\n]\n],\n\"n\": \"考点：sync.Map 适合读多写少；其余场景加锁 map 更合适。\"\n}\n]\n},\n{\n\"t\": \"补17　channel 的底层\",\n\"d\": \"Go：hchan 结构、收发流程，context.Done 关闭后继续读\",\n\"tags\": [\n\"channel 底层结构\",\n\"Done channel 关闭后读取\"\n],\n\"card\": {\n\"p\": \"channel 像一条带货位的传送带，带子上有货位（环形缓冲），两头各有一排等着的人（等待队列），还有一把小锁。\",\n\"f\": \"底层结构 hchan：buf（环形缓冲区）、qcount（当前元素数）、dataqsiz（容量）、sendx 与 recvx（环形下标）、recvq 与 sendq（等待的 goroutine 链表）、lock（互斥锁）、closed 标志。发送：加锁，若有等待的接收者，直接把数据拷贝给它并唤醒；否则缓冲未满就入环形缓冲；都不行则当前 goroutine 入 sendq 并阻塞。接收对称。关闭：唤醒所有等待的接收者（得到零值）和发送者（panic）。\",\n\"c\": \"关闭后：读先取完缓冲数据，之后立即返回零值与 ok=false；写会 panic；再次关闭会 panic；nil channel 读写永久阻塞。context 的 Done() 返回只读 channel，取消时被 close：关闭后读取立即返回、不阻塞，可以重复读取，所有等待者同时被唤醒（相当于广播）；对 Background 这类永不取消的 ctx，Done() 返回 nil channel，在 select 中该分支永不就绪。\",\n\"a\": \"为什么 close 能广播而发送不能？（关闭会唤醒所有等待者，发送只配对一个）channel 是线程安全的靠什么？（内部的互斥锁）\"\n},\n\"story\": [\n[\nnull,\n\"传送带上有货位，两头排着等待的人，还有一把小锁。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“context 的 Done channel 被关闭后，继续读取会怎样？”\",\n\"o\": [\n[\n\"立即返回零值且不阻塞，可重复读取，所有等待者都会被唤醒；永不取消的 ctx 其 Done 是 nil channel，会一直阻塞。\",\n1,\n\"“为什么它能广播？”“关闭会唤醒所有等待的接收者。”\"\n],\n[\n\"第二次读取会阻塞。\",\n0,\n\"“关闭后读取总是立即返回。”\"\n],\n[\n\"读到一次后 channel 被清空。\",\n0,\n\"“关闭状态不会清空。”\"\n]\n],\n\"n\": \"考点：已关闭的 Done channel 读取立即返回，可广播；nil channel 永远阻塞。\"\n},\n{\n\"s\": \"考官：“向 channel 发送时，如果已有接收者在等待，会怎样？”\",\n\"o\": [\n[\n\"直接把数据拷贝给等待的接收者并唤醒它，不经过缓冲区。\",\n1,\n\"“没有接收者且缓冲已满呢？”“发送者入 sendq 阻塞。”\"\n],\n[\n\"先放入缓冲区，再通知接收者。\",\n0,\n\"“有等待的接收者时是直接交接。”\"\n],\n[\n\"发送者阻塞，直到接收者主动来取。\",\n0,\n\"“已有接收者在等，直接交接，不用阻塞。”\"\n]\n],\n\"n\": \"考点：有等待接收者时发送直接拷贝并唤醒；否则入缓冲或阻塞。\"\n}\n]\n},\n{\n\"t\": \"补18　闭包的注意事项\",\n\"d\": \"Go：捕获的是变量，不是值\",\n\"tags\": [\n\"闭包注意事项\"\n],\n\"card\": {\n\"p\": \"闭包带走的不是东西的“照片”，而是通往那样东西的“钥匙”。别人改了它，你下次用钥匙打开，看到的就是新的样子。\",\n\"f\": \"闭包捕获的是变量本身（引用），不是当时值的快照。要点：一，循环变量：Go 1.22 之前所有迭代共享同一个变量，goroutine 或 defer 中使用会读到最终值；1.22 起（go.mod 声明 go 1.22 及以上）每次迭代都是独立变量。二，延迟求值：defer 后的闭包在函数返回前执行时才读取变量，而 defer fmt.Println(i) 的参数在注册时就已求值。三，生命周期：闭包持有外部变量的引用，会延长其生命周期，大对象被闭包引用可能无法回收，造成内存占用。\",\n\"c\": \"四，并发：多个 goroutine 读写被捕获的变量，存在数据竞争，需要同步。五，逃逸：被闭包捕获并可能在函数外使用的变量会逃逸到堆。解决循环变量问题：把变量作为参数传入，或在循环体里重新声明 i := i。闭包的典型用途：函数选项、中间件、延迟执行、回调。\",\n\"a\": \"defer 闭包和 defer 带参数调用的区别？（求值时机不同）怎么发现闭包导致的内存问题？（pprof 的 heap profile）\"\n},\n\"story\": [\n[\nnull,\n\"阿鼠拿着一把钥匙，别人换了锁里的东西，他再开门，看到的就变了。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“defer func() { fmt.Println(i) }() 与 defer fmt.Println(i) 有什么区别？”\",\n\"o\": [\n[\n\"前者闭包在执行时读取 i 的当前值，后者的参数 i 在注册 defer 时就已求值。\",\n1,\n\"“这说明了闭包的什么特点？”“捕获的是变量，不是快照。”\"\n],\n[\n\"两者完全相同。\",\n0,\n\"“求值时机不同。”\"\n],\n[\n\"前者在注册时求值。\",\n0,\n\"“闭包是在执行时读取。”\"\n]\n],\n\"n\": \"考点：闭包延迟读取变量；defer 的普通参数在注册时求值。\"\n},\n{\n\"s\": \"考官：“使用闭包要注意哪些问题？”\",\n\"o\": [\n[\n\"捕获的是变量引用：循环变量共享（1.22 前）、延迟求值读到最新值、持有大对象导致无法回收、并发读写捕获的变量有数据竞争。\",\n1,\n\"“怎么规避循环变量问题？”“把变量作为参数传入，或在循环体内重新声明。”\"\n],\n[\n\"闭包捕获的是值拷贝，所以没有风险。\",\n0,\n\"“闭包捕获的是变量引用。”\"\n],\n[\n\"闭包会让变量一直分配在栈上。\",\n0,\n\"“被捕获的变量可能逃逸到堆。”\"\n]\n],\n\"n\": \"考点：闭包捕获变量引用；注意循环变量、延迟求值、生命周期、数据竞争。\"\n}\n]\n},\n{\n\"t\": \"补19　HashMap 与 ConcurrentHashMap\",\n\"d\": \"数据结构（Java）：实现、扩容与并发安全\",\n\"tags\": [\n\"HashMap 与 ConcurrentHashMap\"\n],\n\"card\": {\n\"p\": \"HashMap 是一间没有人管秩序的档案室，多人同时进来会出乱子；ConcurrentHashMap 在每个柜子口派了一位小管理员，各管各的柜子，互不妨碍。\",\n\"f\": \"HashMap（JDK 8）：数组加链表加红黑树；默认容量 16（保持 2 的幂，用 (n-1) & hash 取下标），负载因子 0.75，元素数超过容量乘 0.75 时扩容为 2 倍，扩容时利用 hash 的高位判断元素留在原位置还是移到“原位置加旧容量”，不必重新计算；链表长度达到 8 且数组长度至少 64 时树化，降到 6 退化回链表；hash 经过扰动（高 16 位异或）。JDK 7 用头插法，并发扩容可能形成环导致死循环；JDK 8 改尾插法，但仍非线程安全（并发 put 可能丢数据）。\",\n\"c\": \"ConcurrentHashMap：JDK 7 用 Segment 分段锁（默认 16 段，ReentrantLock）；JDK 8 取消 Segment，改为数组加链表加红黑树，put 时桶为空用 CAS 插入，否则对桶头节点加 synchronized，锁粒度是单个桶；读操作基本无锁（volatile）；扩容（transfer）支持多线程协助迁移；size 用 baseCount 加 CounterCell 数组（类似 LongAdder）减少竞争；不允许 null 的 key 和 value。\",\n\"a\": \"为什么容量是 2 的幂？（用位与代替取模，且扩容时好分配）ConcurrentHashMap 为什么不允许 null？（无法区分“没有该 key”与“值为 null”）\"\n},\n\"story\": [\n[\nnull,\n\"档案室里，一间没人管，一间每个柜子口都有管理员。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“JDK 8 的 ConcurrentHashMap 如何保证并发安全？”\",\n\"o\": [\n[\n\"桶为空时 CAS 插入，否则对桶头节点加 synchronized，锁粒度是单个桶；读基本无锁；扩容时多线程协助迁移。\",\n1,\n\"“JDK 7 呢？”“用 Segment 分段锁。”\"\n],\n[\n\"沿用 Segment 分段锁。\",\n0,\n\"“那是 JDK 7 的实现。”\"\n],\n[\n\"使用一把全局锁。\",\n0,\n\"“那样并发性能太差。”\"\n]\n],\n\"n\": \"考点：JDK 8 的 CHM 用 CAS 加 synchronized 锁桶头节点，取消 Segment。\"\n},\n{\n\"s\": \"考官：“HashMap 什么时候扩容、什么时候树化？”\",\n\"o\": [\n[\n\"元素数超过容量乘 0.75 时扩容为 2 倍；链表长度至少 8 且数组长度至少 64 时树化。\",\n1,\n\"“为什么容量是 2 的幂？”“用位与取下标，扩容时便于分配。”\"\n],\n[\n\"元素数等于容量时扩容为 1.5 倍。\",\n0,\n\"“默认是超过阈值扩容 2 倍。”\"\n],\n[\n\"链表长度达到 3 就树化。\",\n0,\n\"“树化阈值是 8。”\"\n]\n],\n\"n\": \"考点：HashMap 负载因子 0.75 扩容 2 倍；链表至少 8 且数组至少 64 树化。\"\n}\n]\n},\n{\n\"t\": \"补20　深拷贝与浅拷贝\",\n\"d\": \"数据结构：区别与实现方式\",\n\"tags\": [\n\"深拷贝与浅拷贝\"\n],\n\"card\": {\n\"p\": \"浅拷贝是复印了一张“藏宝图”，你们两个拿着同一张图去挖同一个宝；深拷贝是把宝也复制一份，各挖各的。\",\n\"f\": \"浅拷贝：只复制顶层，内部的引用类型字段（指针、slice、map、对象引用）与原对象共享底层数据，改一个会影响另一个。深拷贝：递归复制所有层级，两者完全独立。Go：结构体直接赋值 b := a 是浅拷贝——值类型字段独立，指针、slice、map、channel 共享。slice 的拷贝用 copy 或 append([]T(nil), s...)；map 需要遍历复制。\",\n\"c\": \"Go 的深拷贝方式：手写递归复制（性能最好、最可控）；序列化再反序列化（encoding/json、gob，简单但慢，且可能丢失未导出字段）；第三方库（基于反射，较慢）。注意循环引用会导致无限递归，需要记录已访问的对象。Java：clone() 默认浅拷贝，可重写递归、用序列化或拷贝构造。不可变对象不需要深拷贝。\",\n\"a\": \"为什么 append 之后有时会影响原 slice？（共享底层数组）深拷贝为什么慢？（递归与反射、序列化的额外开销）\"\n},\n\"story\": [\n[\nnull,\n\"阿鼠复印了藏宝图，才发现两个人挖的是同一个宝。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“Go 中 b := a（a 是含 slice 字段的结构体）属于哪种拷贝？”\",\n\"o\": [\n[\n\"浅拷贝：值类型字段独立，slice 字段共享底层数组，修改元素会互相影响。\",\n1,\n\"“怎么深拷贝？”“手写递归、序列化反序列化或反射库。”\"\n],\n[\n\"深拷贝。\",\n0,\n\"“slice 字段是共享的。”\"\n],\n[\n\"编译错误。\",\n0,\n\"“这是合法的。”\"\n]\n],\n\"n\": \"考点：Go 结构体赋值是浅拷贝，指针、slice、map 共享。\"\n},\n{\n\"s\": \"考官：“Go 里有哪些实现深拷贝的方式？”\",\n\"o\": [\n[\n\"手写递归复制（高效可控）、序列化再反序列化（简单但慢）、反射类库；要注意循环引用与未导出字段。\",\n1,\n\"“各自的优缺点？”“手写最快，序列化最省事，反射最通用但慢。”\"\n],\n[\n\"直接赋值就是深拷贝。\",\n0,\n\"“直接赋值是浅拷贝。”\"\n],\n[\n\"用 unsafe 复制指针。\",\n0,\n\"“复制指针仍然共享。”\"\n]\n],\n\"n\": \"考点：深拷贝的常见方式与取舍，注意循环引用。\"\n}\n]\n},\n{\n\"t\": \"补21　位运算\",\n\"d\": \"数据结构：判断 2 的幂及常用技巧\",\n\"tags\": [\n\"位运算\",\n\"判断 2 的幂\"\n],\n\"card\": {\n\"p\": \"2 的幂的二进制里只有一个 1。减去 1 之后，那个 1 变成 0，它后面的 0 全变成 1。两者一对比，什么都对不上，按位与的结果就是 0。\",\n\"f\": \"判断 n 是否为 2 的幂：n > 0 && (n & (n-1)) == 0。原理：2 的幂只有一位是 1，n-1 会把这一位变成 0，并把低位全变成 1，所以两者按位与为 0。注意先判断 n > 0（0 和负数不是 2 的幂）。n & (n-1) 的作用是清除最低位的 1。\",\n\"c\": \"常用技巧：统计二进制中 1 的个数（反复 n &= n-1，次数就是 1 的个数，Brian Kernighan 算法）；lowbit：n & -n 取最低位的 1；异或：a ^ a = 0，a ^ 0 = a，可用来找只出现一次的数；判断奇偶 n & 1；乘除 2 用左移右移；对 2 的幂取模：n & (2^k - 1)（HashMap 的取下标）。注意有符号数右移的符号位问题（Go 中有符号数右移是算术右移）。\",\n\"a\": \"如何判断 n 是否是 4 的幂？（先是 2 的幂，再与 0x55555555 做与运算不为 0）怎么用位运算交换两个数？（三次异或）\"\n},\n\"story\": [\n[\nnull,\n\"算法王国的一道小题：怎么一步判断一个数是不是 2 的幂？\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“怎么判断一个整数 n 是不是 2 的幂？”\",\n\"o\": [\n[\n\"n > 0 且 n & (n-1) == 0：2 的幂只有一位为 1，n-1 会让该位变 0、低位变 1，按位与为 0。\",\n1,\n\"“n & (n-1) 还有什么用？”“清除最低位的 1，可统计 1 的个数。”\"\n],\n[\n\"n % 2 == 0。\",\n0,\n\"“偶数不一定是 2 的幂。”\"\n],\n[\n\"n & 1 == 0。\",\n0,\n\"“那只是判断偶数。”\"\n]\n],\n\"n\": \"考点：判断 2 的幂用 n > 0 且 n & (n-1) == 0。\"\n},\n{\n\"s\": \"考官：“n & (n-1) 的作用是什么？”\",\n\"o\": [\n[\n\"清除 n 二进制中最低位的 1，反复使用可统计 1 的个数。\",\n1,\n\"“取最低位的 1 呢？”“n & -n。”\"\n],\n[\n\"取出最低位的 1。\",\n0,\n\"“那是 n & -n。”\"\n],\n[\n\"判断奇偶。\",\n0,\n\"“那是 n & 1。”\"\n]\n],\n\"n\": \"考点：n & (n-1) 清除最低位的 1；n & -n 取最低位的 1。\"\n}\n]\n},\n{\n\"t\": \"补22　海量数据 Top K\",\n\"d\": \"数据结构：哈希表加小顶堆，数据放不进内存怎么办\",\n\"tags\": [\n\"海量数据 Top K\"\n],\n\"card\": {\n\"p\": \"十亿条日志，找出出现最多的 100 个词。内存装不下，就把它们按词分到很多小仓库，每个仓库自己统计，最后各自推荐前 100，再合并。\",\n\"f\": \"若数据放得进内存：用哈希表统计频次，再用大小为 K 的小顶堆遍历，O(n log K)。放不进内存：一，分治：对 key 做 hash 取模，把大文件分成 N 个小文件（相同的 key 一定落在同一个文件）；二，每个小文件用哈希表统计频次；三，对每个文件用大小为 K 的小顶堆取局部 Top K；四，合并各文件的局部结果，再用小顶堆得到全局 Top K。\",\n\"c\": \"为什么要按 hash 分文件：保证同一个 key 的所有出现都在同一文件内，统计的频次才完整，局部 Top K 才能直接合并。若只是随便切分，同一个词的次数会分散在多个文件，局部 Top K 不能直接合并。分布式场景同理：先按 key 分区聚合，再各节点取局部 Top K 汇总。近似方案：Count-Min Sketch 加堆，允许一定误差。纯数值的 Top K（不是频次）直接用小顶堆即可。\",\n\"a\": \"为什么用小顶堆而不是大顶堆？（堆顶是当前第 K 大，方便淘汰）某个文件仍然太大怎么办？（再次用另一个 hash 函数继续分）\"\n},\n\"story\": [\n[\nnull,\n\"十亿条日志堆成山，阿算要从里面找出最常出现的一百个词。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“内存放不下的大文件，如何找出出现次数最多的 K 个词？”\",\n\"o\": [\n[\n\"先按 hash 分到多个小文件，逐个统计频次并用小顶堆取局部 Top K，最后合并局部结果。\",\n1,\n\"“为什么要用 hash 分？”“保证同一个词都在同一个文件里。”\"\n],\n[\n\"直接把所有数据排序。\",\n0,\n\"“数据太大，无法排序。”\"\n],\n[\n\"每个文件取前 K 条记录就是全局 Top K。\",\n0,\n\"“前 K 条记录不等于频次最高。”\"\n]\n],\n\"n\": \"考点：hash 分治加局部哈希统计加小顶堆加合并。\"\n},\n{\n\"s\": \"考官：“为什么要先 hash 分文件，而不是随便切分？”\",\n\"o\": [\n[\n\"保证同一个 key 的所有出现都在同一个文件，统计的频次才完整，局部 Top K 才能合并。\",\n1,\n\"“某个文件仍太大呢？”“换个 hash 函数继续分。”\"\n],\n[\n\"为了加快排序。\",\n0,\n\"“目的不是排序。”\"\n],\n[\n\"只是为了去重。\",\n0,\n\"“关键是频次统计的完整性。”\"\n]\n],\n\"n\": \"考点：按 key 的 hash 分区保证同 key 在同一文件。\"\n}\n]\n},\n{\n\"t\": \"补23　循环队列与并发安全\",\n\"d\": \"数据结构：环形缓冲区，加锁与无锁实现\",\n\"tags\": [\n\"循环队列并发安全\"\n],\n\"card\": {\n\"p\": \"一圈固定数量的座位，队头和队尾两个人在圈里追逐：队尾往前坐，队头往前走。座位用完了绕回开头继续用，不用来回搬。\",\n\"f\": \"循环队列（环形缓冲区）：固定容量数组加 head 与 tail，下标对容量取模，O(1) 入队出队，不需要搬移元素。判空：head == tail；判满：牺牲一个位置，(tail+1) % cap == head，或额外维护 count。并发安全的实现：一，互斥锁保护 head、tail 与数据，简单可靠；二，条件变量或 channel 实现阻塞版（满时等待、空时等待）；三，单生产者单消费者（SPSC）可无锁：生产者只写 tail，消费者只写 head，用原子操作读写并保证内存可见性，再用缓存行填充避免伪共享。\",\n\"c\": \"多生产者多消费者无锁：通过 CAS 抢占槽位，并给每个槽位带序号（如 Disruptor、Vyukov 的有界 MPMC 队列），要处理 ABA、伪共享和内存序。容量取 2 的幂时可用位与代替取模。Go 里带缓冲的 channel 本身就是并发安全的循环队列（内部是环形缓冲加锁）。选择：一般场景用锁或 channel，性能极致的场景才考虑无锁。\",\n\"a\": \"为什么要牺牲一个位置？（避免队空和队满都变成 head == tail）无锁队列一定比加锁快吗？（竞争小时差距不大，且实现复杂）\"\n},\n\"story\": [\n[\nnull,\n\"一圈固定的座位，队头和队尾在圈里追逐，用完绕回来继续用。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“循环队列怎么区分队空和队满？”\",\n\"o\": [\n[\n\"队空 head == tail；队满时牺牲一个位置 (tail+1)%cap == head，或额外维护 count。\",\n1,\n\"“容量取 2 的幂有什么好处？”“可以用位与代替取模。”\"\n],\n[\n\"队空和队满都是 head == tail，不需要区分。\",\n0,\n\"“会无法区分，必须有办法区分。”\"\n],\n[\n\"只能用链表实现。\",\n0,\n\"“循环队列基于数组。”\"\n]\n],\n\"n\": \"考点：循环队列判空判满的常见做法。\"\n},\n{\n\"s\": \"考官：“单生产者单消费者的循环队列，如何做到无锁？”\",\n\"o\": [\n[\n\"生产者只修改 tail，消费者只修改 head，用原子操作读写并保证可见性，各自读对方的下标判断满与空，再用缓存行填充避免伪共享。\",\n1,\n\"“多生产者呢？”“要用 CAS 加槽位序号，如 Disruptor。”\"\n],\n[\n\"必须使用互斥锁。\",\n0,\n\"“SPSC 可以无锁。”\"\n],\n[\n\"靠 time.Sleep 来同步。\",\n0,\n\"“不可靠，也很慢。”\"\n]\n],\n\"n\": \"考点：SPSC 循环队列无锁：读写下标各由一方修改，配合原子操作与伪共享避免。\"\n}\n]\n}\n]\n;\nconst $=id=>document.getElementById(id);\nlet done=[];try{done=JSON.parse(localStorage.getItem(\"extra-done\")||\"[]\")}catch(e){}\nfunction save(){try{localStorage.setItem(\"extra-done\",JSON.stringify(done))}catch(e){}}\nfunction show(id){document.querySelectorAll(\".screen\").forEach(s=>s.classList.toggle(\"on\",s.id===id))}\nlet ch=0,i=0,q=[],ok=0,wrong=[],fromGame=false;\nfunction menu(){\n  const got=C.filter((c,n)=>done.includes(n)).flatMap(c=>c.tags),all=C.flatMap(c=>c.tags).concat(PLAN);\n  $(\"cov\").innerHTML=`<div style=\"font:14px system-ui,sans-serif;color:var(--dim)\">知识点覆盖 ${got.length} / ${all.length}（本部规划中，后续章节陆续追加）<\/div><div class=\"bar\"><i style=\"width:${got.length/all.length*100}%\"><\/i><\/div>`;\n  $(\"chips\").innerHTML=all.map(t=>`<span class=\"${got.includes(t)?\"on\":\"\"}\">${t}<\/span>`).join(\"\");\n  $(\"list\").innerHTML=\"\";C.forEach((c,n)=>{const b=document.createElement(\"button\");b.className=\"ch\"+(done.includes(n)?\" done\":\"\");\n    b.innerHTML=`<b>${c.t}<\/b><span>${c.d}<\/span>`;b.onclick=()=>{ch=n;fromGame=false;card()};$(\"list\").appendChild(b)});\n  show(\"menu\");\n}\nfunction card(){\n  const c=C[ch],k=c.card;\n  $(\"cardbody\").innerHTML=`<h2>${c.t}<\/h2><div class=\"sub\">知识卡：${c.d}<\/div>\n   <details open><summary>${(k.L||[])[0]||'大白话'}<\/summary><p>${k.p}<\/p><\/details>\n   <details open><summary>${(k.L||[])[1]||'正经解释'}<\/summary><p>${k.f}<\/p><\/details>\n   <details open><summary>${(k.L||[])[2]||'对比与适用场景'}<\/summary><p>${k.c}<\/p><\/details>\n   <details open><summary>${(k.L||[])[3]||'面试官常见追问'}<\/summary><p>${k.a}<\/p><\/details>\n   <button class=\"go\" id=\"goOn\">${fromGame?\"回到剧情\":\"进入剧情\"}<\/button><button class=\"go alt\" id=\"cb\">返回目录<\/button>`;\n  $(\"goOn\").onclick=()=>fromGame?show(\"game\"):start();$(\"cb\").onclick=menu;show(\"card\");\n}\nfunction start(){\n  const c=C[ch];q=[];ok=0;wrong=[];i=0;\n  c.story.forEach(l=>q.push({k:\"l\",w:l[0],t:l[1]}));\n  c.qs.forEach(x=>{q.push({k:\"l\",w:\"考官\",t:x.s});q.push({k:\"c\",x})});q.push({k:\"end\"});\n  $(\"title\").textContent=c.t;$(\"title\").style.animation=\"none\";void $(\"title\").offsetWidth;$(\"title\").style.animation=\"\";\n  $(\"choices\").innerHTML=\"\";$(\"sc\").textContent=\"答对 0 / \"+c.qs.length;fromGame=true;show(\"game\");line(null,\"点击对话框开始。\");\n}\nfunction line(w,t,note){$(\"who\").textContent=w||\"\";$(\"who\").className=w===\"考官\"?\"int\":w===\"我\"?\"me\":\"\";$(\"txt\").textContent=t;$(\"txt\").className=note?\"note\":\"\"}\nfunction next(){\n  if($(\"choices\").children.length)return;const n=q[i++];if(!n)return;\n  if(n.k===\"l\")line(n.w,n.t,n.note);else if(n.k===\"c\")ask(n.x);else finish();\n}\nfunction ask(x){\n  line(\"考官\",x.s);const c=$(\"choices\");c.innerHTML=\"\";\n  x.o.forEach(o=>{const b=document.createElement(\"button\");b.className=\"opt\";b.textContent=o[0];\n    b.onclick=()=>{c.innerHTML=\"\";if(o[1])ok++;else wrong.push(x.n);\n      $(\"sc\").textContent=\"答对 \"+ok+\" / \"+C[ch].qs.length;\n      q.splice(i,0,{k:\"l\",w:\"我\",t:o[0]},{k:\"l\",w:\"考官\",t:o[2]},{k:\"l\",w:null,t:(o[1]?\"答对了。\":\"答错了。\")+\"\\n\"+x.n,note:1});next()};\n    c.appendChild(b)});\n}\nfunction finish(){\n  const c=C[ch],pass=ok===c.qs.length;if(pass&&!done.includes(ch)){done.push(ch);save()}\n  $(\"endbody\").innerHTML=`<h2 style=\"margin:0 0 4px\">${pass?\"本章通关\":\"差一点，再看一遍知识卡\"}<\/h2>\n   <div style=\"color:var(--dim)\">答对 ${ok} / ${c.qs.length}<\/div>\n   ${wrong.length?\"<p>需要巩固：<\/p><ul>\"+wrong.map(w=>`<li>${w}<\/li>`).join(\"\")+\"<\/ul>\":\"<p>本章全部答对。<\/p>\"}\n   <button class=\"go\" id=\"r1\">重玩本章<\/button>${pass&&ch<C.length-1?'<button class=\"go\" id=\"r2\">下一章<\/button>':\"\"}\n   <button class=\"go alt\" id=\"r3\">回目录<\/button>`;\n  $(\"r1\").onclick=start;$(\"r3\").onclick=menu;if($(\"r2\"))$(\"r2\").onclick=()=>{ch++;fromGame=false;card()};show(\"end\");\n}\n$(\"box\").onclick=next;$(\"back\").onclick=menu;$(\"kc\").onclick=card;\ndocument.addEventListener(\"keydown\",e=>{if((e.key===\" \"||e.key===\"Enter\")&&document.activeElement.tagName!==\"BUTTON\"&&$(\"game\").classList.contains(\"on\")){e.preventDefault();next()}});\nmenu();\n<\/script>\n<\/body>\n<\/html>\n"}];
const home = document.getElementById('home');
const reader = document.getElementById('reader');
const grid = document.getElementById('chapterGrid');
const frame = document.getElementById('frame');
const readerTitle = document.getElementById('readerTitle');

function renderHome() {
  grid.innerHTML = '';
  for (const page of PAGES) {
    const button = document.createElement('button');
    button.className = 'chapter';
    button.style.setProperty('--card-bg2', page.colors.bg2);
    button.style.setProperty('--card-gold', page.colors.gold);
    button.innerHTML = `<div><div class="num">${page.num}</div><b>${page.name}</b><span>${page.sub}</span></div>`;
    button.addEventListener('click', () => openPage(page.id));
    grid.appendChild(button);
  }
}

function openPage(id) {
  const page = PAGES.find(item => item.id === id) || PAGES[0];
  readerTitle.textContent = page.title;
  frame.srcdoc = page.html;
  home.style.display = 'none';
  reader.style.display = 'flex';
  if (location.hash !== `#${page.id}`) history.pushState(null, '', `#${page.id}`);
}

function showHome(push = true) {
  frame.removeAttribute('srcdoc');
  reader.style.display = 'none';
  home.style.display = 'block';
  readerTitle.textContent = '';
  if (push && location.hash) history.pushState(null, '', location.pathname + location.search);
}

document.getElementById('backHome').addEventListener('click', () => showHome(true));
window.addEventListener('popstate', () => {
  const id = location.hash.slice(1);
  if (id) openPage(id); else showHome(false);
});

renderHome();
if (location.hash) openPage(location.hash.slice(1));
</script>
