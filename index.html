从。持久化不能替代备份与高可用。\",\na:\"AOF 文件为什么要重写？（命令会越积越多，重写只保留生成当前数据所需的命令）RDB 与 AOF 恢复速度谁快？（RDB）\"},\nstory:[[null,\"一次停电，阿闪发现全景照是三小时前拍的，期间的货全没了；而流水账只丢了最后一秒的记录。\"]],\nqs:[{s:\"考官：“AOF 的 appendfsync 设为 everysec，含义是什么？”\",\no:[[\"每秒把缓冲区刷盘一次，最多丢失约 1 秒的数据，是默认的折中。\",1,\"“always 呢？”“每条命令都刷盘，最安全但最慢。”\"],[\"每条命令都刷盘。\",0,\"“那是 always。”\"],[\"完全交给内核，一定不会丢。\",0,\"“交给内核可能丢更多。”\"]],\nn:\"考点：everysec 每秒刷盘，最多丢约 1 秒；always 最安全最慢；no 交给系统。\"},\n{s:\"考官：“RDB 和 AOF 怎么选？”\",\no:[[\"RDB 恢复快、文件小，但可能丢较多数据；AOF 数据更完整但文件大、恢复慢；混合持久化兼顾两者。\",1,\"“混合持久化怎么工作？”“重写时前半是 RDB，后半是增量 AOF。”\"],[\"RDB 的实时性比 AOF 更好。\",0,\"“AOF 更实时。”\"],[\"AOF 不会产生文件重写。\",0,\"“AOF 需要重写来压缩。”\"]],\nn:\"考点：RDB 快照恢复快、丢数据多；AOF 完整但慢；混合持久化兼顾。\"}]},\n\n{t:\"第6章　缓存三兄弟\",d:\"缓存穿透、击穿、雪崩\",tags:[\"缓存穿透\",\"缓存击穿\",\"缓存雪崩\"],\ncard:{p:\"货栈是挡在仓库前面的前台。三种事会让前台失效：有人专找不存在的货（穿透），某件爆款货刚好过期（击穿），一大批货同时过期或前台整体倒了（雪崩）。\",\nf:\"缓存穿透：查询不存在的数据，缓存和数据库都没有，每次都打到数据库。解法：布隆过滤器（判断不存在一定准，判断存在可能误判）、缓存空值并设短 TTL、参数校验。缓存击穿：热点 key 过期的瞬间，大量请求打到数据库。解法：互斥锁重建缓存、逻辑过期、热点 key 不过期。缓存雪崩：大量 key 同时过期，或 Redis 整体宕机。解法：过期时间加随机抖动、多级缓存、限流降级、高可用（哨兵、集群）、缓存预热。\",\nc:\"区分要点：穿透是数据本就不存在；击穿是单个热点 key 过期；雪崩是大面积失效。布隆过滤器不支持删除（标准版），有误判率，需按预估元素数与误判率设计。互斥锁方案保证一致但会阻塞，逻辑过期保证可用但可能读到旧数据。\",\na:\"布隆过滤器的误判方向？（可能把不存在的判为存在，不会把存在的判为不存在）空值缓存的副作用？（占内存，要设短 TTL）\"},\nstory:[[null,\"货栈前台来了三种麻烦：有人一直问不存在的货，有人抢同一件爆款，还有一次，半夜里一整排货同时到期。\"]],\nqs:[{s:\"考官：“布隆过滤器有什么特点？”\",\no:[[\"判断“不存在”一定准确，判断“存在”可能误判；适合拦截不存在的 key。\",1,\"“能删除元素吗？”“标准布隆过滤器不支持。”\"],[\"判断“存在”一定准确。\",0,\"“存在的判断可能误判。”\"],[\"支持删除且没有误判。\",0,\"“标准版不支持删除，也有误判。”\"]],\nn:\"考点：布隆过滤器说不存在一定不存在，说存在可能误判；标准版不支持删除。\"},\n{s:\"考官：“大批 key 在同一时刻集中过期，导致数据库压力暴增，怎么预防？”\",\no:[[\"过期时间加随机抖动，配合多级缓存、限流降级。\",1,\"“还有哪种雪崩？”“Redis 整体宕机，用高可用解决。”\"],[\"把所有 key 设为永不过期，不做任何处理。\",0,\"“内存会撑满，数据也会变旧。”\"],[\"给数据库多加几个索引。\",0,\"“不能解决集中失效。”\"]],\nn:\"考点：雪崩预防：TTL 随机、多级缓存、限流降级、高可用、预热。\"}]},\n\n{t:\"第7章　缓存与库对账\",d:\"缓存一致性：Cache Aside\",tags:[\"缓存一致性\",\"Cache Aside\"],\ncard:{p:\"前台和仓库各记一份账，改了仓库的货，前台的旧价签不换，客人就会看到旧价格。最稳妥的办法：先改仓库，再把前台的价签撕掉，下次有人问再重新贴。\",\nf:\"Cache Aside（旁路缓存）：读时先读缓存，未命中则查数据库再写入缓存；写时先更新数据库，再删除缓存。为什么删除而不是更新：更新缓存开销大、并发下可能写入旧值、数据可能很少被读。为什么先更新库再删缓存：若先删缓存再更新库，并发的读可能在更新前把旧值回填进缓存，并一直保留到过期；先更新库后删缓存，要出现不一致需要读请求恰好夹在中间，概率低得多，但仍可能发生。\",\nc:\"删除缓存失败怎么办：重试（如借助消息队列）、订阅 binlog（如 Canal）异步删除、延迟双删、设置过期时间兜底。需要强一致的场景：不缓存或使用分布式锁，一般缓存只保证最终一致。一致性与性能、复杂度要做取舍。\",\na:\"延迟双删为什么要延迟？（等并发读回填完成后再删一次）读多写少与写多读少时策略一样吗？（写多时缓存命中率低，收益小）\"},\nstory:[[null,\"仓库价格改了，前台的价签没换，客人按旧价买走了货。老伙计立下新规矩：先改仓库，再撕价签。\"]],\nqs:[{s:\"考官：“为什么通常选择先更新数据库、再删除缓存？”\",\no:[[\"并发下不一致的窗口更小；先删缓存再更新库，并发读可能把旧值回填缓存并长期保留。\",1,\"“能完全避免不一致吗？”“不能，只是概率更低，要有兜底。”\"],[\"因为这样能保证强一致。\",0,\"“只能保证最终一致，仍有极小概率不一致。”\"],[\"因为删除缓存比更新数据库慢。\",0,\"“删除通常更快。”\"]],\nn:\"考点：先更新库再删缓存，窗口更小；不是强一致，仍需兜底。\"},\n{s:\"考官：“删除缓存失败了怎么办？”\",\no:[[\"重试机制（如借助消息队列）或订阅 binlog 异步删除，并用过期时间兜底。\",1,\"“延迟双删呢？”“延迟再删一次，处理并发回填。”\"],[\"忽略失败。\",0,\"“会留下长期不一致。”\"],[\"重启 Redis。\",0,\"“代价太大且不解决问题。”\"]],\nn:\"考点：重试、binlog 订阅（Canal）、延迟双删、过期时间兜底。\"}]},\n\n{t:\"第8章　抢钥匙的规矩\",d:\"分布式锁：SET NX PX、Lua、续期、RedLock\",tags:[\"分布式锁\",\"Redisson watchdog\",\"RedLock\"],\ncard:{p:\"几家分店同时抢一把钥匙，谁先到谁先拿，用完要还。但钥匙要有时限，免得拿钥匙的人半路失踪，大家永远进不去；还钥匙时要认清是不是自己那一把，别把别人手里的拿走了。\",\nf:\"加锁：SET key uuid NX PX 30000，一条命令原子完成“不存在才设置并带过期时间”，uuid 标识持有者。解锁：先判断 value 是自己的，再 DEL，用 Lua 保证判断与删除原子，防止锁过期后误删别人的锁。为什么不用 SETNX 加 EXPIRE 两条命令：不是原子的，中间崩溃会留下永不过期的锁。业务执行超过锁过期时间会导致锁提前释放：Redisson 的 watchdog 默认 30 秒，每约 10 秒续期（未指定 leaseTime 时启用）。\",\nc:\"可重入：Redisson 用 Hash 记录持有者与重入次数。主从切换丢锁：异步复制，主库宕机时锁可能尚未同步到从库，新主上没有该锁。RedLock：向多个独立 Redis 主节点加锁，多数派成功才算成功；存在争议（时钟漂移、GC 暂停），需要 fencing token 等机制。对比 ZooKeeper：临时顺序节点，强一致，性能较低。需要强一致就考虑 ZooKeeper 或 etcd。\",\na:\"锁过期了但业务没跑完怎么办？（watchdog 续期，或做幂等与 fencing token）RedLock 为什么有争议？（依赖时钟与时序假设）\"},\nstory:[[null,\"几家分店同时伸手去拿唯一的钥匙。阿闪学会了：拿钥匙要带上自己的名牌，还钥匙时先对名牌。\"]],\nqs:[{s:\"考官：“为什么加锁用 SET key value NX PX，而不是 SETNX 加 EXPIRE 两条命令？”\",\no:[[\"两条命令不是原子的，中间崩溃会留下永不过期的锁；SET NX PX 一条命令原子完成。\",1,\"“解锁呢？”“校验 value 再删除，用 Lua 保证原子。”\"],[\"因为 SETNX 会覆盖已有的锁。\",0,\"“SETNX 不会覆盖，不是这个原因。”\"],[\"因为 EXPIRE 不支持毫秒。\",0,\"“不是主要原因。”\"]],\nn:\"考点：SET NX PX 原子加锁并设过期；避免两条命令之间崩溃造成死锁。\"},\n{s:\"考官：“释放锁为什么要校验 value，并用 Lua？”\",\no:[[\"防止锁已过期被别人持有时误删他人的锁；校验与删除需要原子执行。\",1,\"“持有时间不够怎么办？”“用 watchdog 续期。”\"],[\"为了加快删除速度。\",0,\"“和速度无关。”\"],[\"因为 Redis 不支持直接 DEL。\",0,\"“支持，但会误删。”\"]],\nn:\"考点：解锁校验持有者并用 Lua 原子执行；超时用 watchdog 续期。\"}]},\n\n{t:\"第9章　分店与哨兵\",d:\"主从复制、哨兵与脑裂\",tags:[\"主从复制\",\"哨兵\",\"脑裂\"],\ncard:{p:\"总店之外开几家分店抄账，总店出事，要有人发现、选一家分店顶上，并通知所有客人换地址。负责盯着总店的，就是哨兵。\",\nf:\"主从复制：从库发送 PSYNC，主库执行 BGSAVE 生成 RDB 发送，同时把期间的写命令存入缓冲区，之后增量同步；断线重连后依据复制偏移量与复制积压缓冲区做增量同步，积压不够则全量。复制是异步的，可能丢数据。哨兵：监控、通知、自动故障转移。主观下线：单个哨兵认为节点不可达；客观下线：达到 quorum 数量的哨兵都认为不可达，才进入故障转移。选出领头哨兵（类似 Raft 投票）执行转移，按优先级、复制偏移量、run id 选新主。\",\nc:\"脑裂：主库因网络分区与哨兵和从库失联，哨兵选出了新主，但旧主仍被部分客户端写入；分区恢复后旧主被降为从库并同步新主，分区期间的写入丢失。缓解：min-replicas-to-write 与 min-replicas-max-lag，要求至少有一定数量的从库在一定延迟内，否则主库拒绝写入。哨兵至少部署 3 个且为奇数。\",\na:\"为什么哨兵要有多个？（避免误判与单点）选新主依据什么？（优先级、复制偏移量最大、run id 小）\"},\nstory:[[null,\"总店突然断网，三位哨兵互相核对：“我看它没响应。”“我也是。”达到约定人数，才决定换主。\"]],\nqs:[{s:\"考官：“主观下线和客观下线有什么区别？”\",\no:[[\"主观下线是单个哨兵认为节点不可达；客观下线是达到 quorum 个哨兵都认为下线，才触发故障转移。\",1,\"“quorum 一般怎么设？”“哨兵数的一半加一。”\"],[\"两者是同一个概念。\",0,\"“不同阶段。”\"],[\"客观下线由主节点自己宣布。\",0,\"“由哨兵投票判定。”\"]],\nn:\"考点：主观下线（单哨兵判断）、客观下线（quorum 同意）后才故障转移。\"},\n{s:\"考官：“Redis 主从切换的脑裂会造成什么？怎么缓解？”\",\no:[[\"旧主被分区后仍接收写入，恢复后被降为从库，分区期间的写入丢失；可用 min-replicas-to-write 等缓解。\",1,\"“代价是什么？”“从库不足时主库拒绝写，牺牲可用性。”\"],[\"导致 RDB 文件损坏。\",0,\"“与文件损坏无关。”\"],[\"导致内存淘汰。\",0,\"“与淘汰无关。”\"]],\nn:\"考点：脑裂导致旧主分区期间的写入丢失；用 min-replicas-to-write、min-replicas-max-lag 缓解。\"}]},\n\n{t:\"第10章　一万六千个格子\",d:\"Redis Cluster 与哈希槽\",tags:[\"Redis Cluster\",\"哈希槽\"],\ncard:{p:\"货太多一家店装不下，就把货栈分成一万六千多个格子，几家店各管一部分。每件货先算出它该进哪个格子，再去负责那个格子的店。\",\nf:\"Redis Cluster 把键空间分成 16384 个哈希槽，key 经 CRC16 后对 16384 取模得到槽号，每个主节点负责一部分槽。客户端访问了不负责的槽，节点返回 MOVED 重定向；槽迁移过程中会返回 ASK 做临时重定向。节点间用 gossip 协议交换状态；主节点故障时，它的从节点发起选举替代。扩缩容通过迁移槽及其数据完成。\",\nc:\"为什么是 16384：节点间心跳包携带槽位图，16384 位约 2KB，若是 65536 位约 8KB，占带宽更大；而集群规模通常不超过千级节点，16384 足够分配。限制：多 key 命令（如 MGET、事务、Lua）要求所有 key 在同一槽，否则报 CROSSSLOT；可用 hash tag（花括号内的部分参与哈希）让相关 key 落到同一槽；只支持 db0。Cluster 是去中心化的分片方案，哨兵则只解决高可用。\",\na:\"Cluster 和哨兵的区别？（Cluster 同时解决分片与高可用，哨兵只管高可用）怎么保证一批 key 在同一节点？（hash tag）\"},\nstory:[[null,\"货栈扩成了几家店。阿闪给每件货算了个格子号，再顺着号去找店。偶尔走错了店，店员会指路：“你要的格子在隔壁。”\"]],\nqs:[{s:\"考官：“Redis Cluster 如何决定一个 key 存在哪个节点？”\",\no:[[\"对 key 做 CRC16 再对 16384 取模得到槽号，槽再映射到负责的节点。\",1,\"“客户端走错节点怎么办？”“节点返回 MOVED 指路。”\"],[\"使用一致性哈希环。\",0,\"“Cluster 用的是哈希槽。”\"],[\"按 key 的首字母分配。\",0,\"“与首字母无关。”\"]],\nn:\"考点：CRC16(key) mod 16384 得到槽，槽映射到节点；走错节点会 MOVED 重定向。\"},\n{s:\"考官：“为什么槽数是 16384，而不是 65536？”\",\no:[[\"心跳包携带槽位图，16384 位约 2KB，更省带宽；节点数有限，16384 足够分配。\",1,\"“多 key 操作有什么限制？”“要在同一槽，可用 hash tag。”\"],[\"因为 Redis 只能存 16384 个 key。\",0,\"“与存储 key 的数量无关。”\"],[\"因为 CRC16 只能输出 16384 个值。\",0,\"“CRC16 输出范围更大，取模得到 16384。”\"]],\nn:\"考点：槽位图随心跳传输，16384 在带宽与规模间折中；多 key 命令需同槽，用 hash tag。\"}]},\n\n{t:\"第11章　大货与爆款\",d:\"大 Key 与热 Key\",tags:[\"大 Key\",\"热 Key\"],\ncard:{p:\"货栈里有些货特别笨重（大 Key），伙计搬起来整个货栈都停摆；也有些货特别抢手（热 Key），全城的人都盯着同一件，把一家店挤爆。\",\nf:\"大 Key：String 值过大（经验上超过 10KB 就要警惕）或集合元素过多（如上万）。危害：读写耗时阻塞单线程、占网络带宽、删除阻塞、主从同步与迁移变慢、内存分布不均。发现：redis-cli --bigkeys、MEMORY USAGE、SCAN 抽样、RDB 分析工具。解决：拆分（如 Hash 分桶）、压缩、清理；删除用 UNLINK（异步，4.0+）或 HSCAN、HDEL 分批删除。\",\nc:\"热 Key：访问量极高的 key，会把单个节点打满。解决：本地缓存（多级缓存）、把热 key 复制多份（key 加随机后缀，分散到不同节点）、从库分担读、限流。监控：Redis 4.0 起可用 --hotkeys（需 LFU 策略）。预防大 Key 要在写入前评估，设计时就避免单 key 无限增长。\",\na:\"为什么大 key 会阻塞？（命令执行是单线程，耗时操作排队）怎么发现热 key？（监控、客户端统计、--hotkeys）\"},\nstory:[[null,\"阿闪想一次性搬走一整排货，结果整个货栈停了十几秒。老伙计叹气：“笨重的货要分批搬，别一次动。”\"]],\nqs:[{s:\"考官：“要删除一个超大的 Hash key，怎么避免阻塞？”\",\no:[[\"用 UNLINK 异步删除，或用 HSCAN 加 HDEL 分批删除。\",1,\"“为什么 DEL 会阻塞？”“同步释放大量内存，且命令是单线程执行。”\"],[\"直接 DEL，因为 DEL 一定很快。\",0,\"“大 key 的 DEL 会阻塞。”\"],[\"重启 Redis。\",0,\"“代价太大。”\"]],\nn:\"考点：大 key 删除用 UNLINK（异步）或分批删除。\"},\n{s:\"考官：“热 Key 把单个节点压垮，有哪些手段？”\",\no:[[\"本地缓存（多级缓存）、把热 key 复制多份分散到不同节点、从库分担读、限流。\",1,\"“复制多份怎么读？”“key 加随机后缀，随机读其中一份。”\"],[\"把热 key 全部删除。\",0,\"“删除会让请求全部打到数据库。”\"],[\"增大 maxmemory。\",0,\"“和访问压力无关。”\"]],\nn:\"考点：热 key 用本地缓存、多副本打散、读写分离、限流缓解。\"}]},\n\n{t:\"第12章　打包办事\",d:\"事务、Pipeline 与 Lua 脚本\",tags:[\"Redis 事务\",\"Pipeline\",\"Lua 脚本\"],\ncard:{p:\"要办一串事，有三种打包办法：交给前台一张清单让它连着办完（事务），把好几张单子一起递进去、省得来回跑（Pipeline），或者让前台照一份写好的剧本整套办完（Lua）。\",\nf:\"事务：MULTI 开启，命令入队，EXEC 顺序连续执行，中间不会被其他命令打断。Redis 事务不支持回滚：入队时的语法错误会导致整个事务拒绝执行；执行时的运行错误（如对 List 执行 INCR）只让该命令失败，其他命令继续。WATCH 提供乐观锁：被监视的 key 在 EXEC 前被修改，则事务失败。Pipeline：批量发送命令、批量读取结果，减少网络往返（RTT），不保证原子性。Lua（EVAL）：脚本在服务端原子执行，适合实现限流、解锁等复杂原子逻辑。\",\nc:\"区别：Pipeline 优化网络，事务保证命令连续执行，Lua 保证脚本整体原子且可含逻辑判断。Lua 脚本不能太耗时，否则会阻塞整个 Redis。集群模式下事务与 Lua 涉及的 key 需在同一槽。Pub/Sub 不持久化，订阅者离线会丢消息；做消息队列更推荐 Stream。\",\na:\"为什么 Redis 事务不支持回滚？（设计取舍：运行时错误多源于程序 bug，追求简单与速度）Lua 脚本和事务比有什么优势？（可带逻辑判断，原子执行）\"},\nstory:[[null,\"阿闪要办十件事。第一次一件件跑，累得满头大汗；后来他把十张单子打包一起递进去，又学会了写“剧本”让前台照着办。\"]],\nqs:[{s:\"考官：“Redis 事务中某条命令运行时出错，其他命令会怎样？”\",\no:[[\"其他命令仍继续执行，Redis 事务不支持回滚。\",1,\"“入队时语法错误呢？”“整个事务会被拒绝执行。”\"],[\"整个事务自动回滚。\",0,\"“Redis 不支持回滚。”\"],[\"事务被丢弃，所有命令都不执行。\",0,\"“运行时错误不会丢弃其他命令。”\"]],\nn:\"考点：运行时错误只影响该命令，不回滚；入队时语法错误则整个事务被拒绝。\"},\n{s:\"考官：“Pipeline 和事务有什么区别？”\",\no:[[\"Pipeline 只是批量发送以减少网络往返，不保证原子；事务保证一组命令按序连续执行。\",1,\"“想要原子加逻辑判断呢？”“用 Lua 脚本。”\"],[\"Pipeline 保证原子性。\",0,\"“Pipeline 不保证原子。”\"],[\"两者完全等价。\",0,\"“目的与保证都不同。”\"]],\nn:\"考点：Pipeline 减少 RTT 不保证原子；事务保证顺序连续执行；Lua 原子加逻辑。\"}]},\n\n{t:\"第13章　货栈的各种用法\",d:\"限流、排行榜与计数、延迟队列、消息队列\",tags:[\"限流\",\"排行榜与计数\",\"延迟队列\"],\ncard:{p:\"货栈除了当缓存，还能干很多活：当门卫数人头（限流）、当计分牌（排行榜）、当闹钟（延迟队列）、当传话筒（消息队列）。\",\nf:\"限流：固定窗口（INCR 加 EXPIRE，简单，窗口边界可能出现两倍流量的突刺）；滑动窗口（ZSet，时间戳作 score，删除窗口外的再 ZCARD 计数）；令牌桶或漏桶（用 Lua 实现）。排行榜：ZSet（ZINCRBY、ZREVRANGE）。签到：Bitmap（SETBIT、BITCOUNT）。UV：HyperLogLog（PFADD、PFCOUNT）。点赞、关注：Set。附近的人：GEO。延迟队列：ZSet，score 为到期时间，消费者轮询取 score 不大于当前时间的任务。\",\nc:\"消息队列选型：List（BRPOP）简单但没有确认机制，消费者崩溃会丢消息；Pub/Sub 不持久化；Stream 支持消费组与 ACK，更可靠。延迟队列要保证“取出与删除”的原子性（Lua 或 ZPOPMIN 等），避免多个消费者重复处理。Redis 不是专业消息队列，对可靠性与堆积要求高时应使用 Kafka、RocketMQ 等。\",\na:\"令牌桶和漏桶的区别？（令牌桶允许突发，漏桶匀速）为什么限流常用 Lua？（多步操作要原子）\"},\nstory:[[null,\"阿闪发现货栈能当门卫、当计分牌、当闹钟。他给每位客人发了号牌，按时间窗口数人头；又给任务排了个按到期时间排序的队。\"]],\nqs:[{s:\"考官：“固定窗口限流有什么问题？”\",\no:[[\"窗口边界处可能出现两倍流量的突刺（前一窗口末尾加后一窗口开头）；滑动窗口可缓解。\",1,\"“滑动窗口怎么实现？”“用 ZSet，按时间戳删旧、再计数。”\"],[\"无法计数。\",0,\"“可以用 INCR 计数。”\"],[\"只能用于单机。\",0,\"“Redis 本身就能做分布式限流。”\"]],\nn:\"考点：固定窗口有边界突刺；滑动窗口用 ZSet；令牌桶与漏桶用 Lua。\"},\n{s:\"考官：“用 Redis 实现延迟队列，怎么做？”\",\no:[[\"用 ZSet：score 为到期时间戳，消费者轮询取 score 不大于当前时间的任务，并保证取出与删除原子。\",1,\"“多个消费者怎么避免重复？”“用 Lua 或原子的弹出命令。”\"],[\"用 List 的 LPUSH 就能自动延迟。\",0,\"“List 没有延迟能力。”\"],[\"用 Pub/Sub。\",0,\"“Pub/Sub 不持久化，也没有延迟。”\"]],\nn:\"考点：延迟队列用 ZSet，score 为到期时间；取出与删除需原子，避免重复消费。\"}]},\n\n{t:\"终章　总复习：货栈大考\",d:\"跨章混合题：把缓存、持久化、高可用与分布式串起来\",tags:[],\ncard:{p:\"线上出问题，很少是单一原因。你要判断问题落在命令、数据、持久化、复制还是缓存策略，再给出验证手段。\",\nf:\"思路：延迟飙升先看慢命令、大 key、热 key、持久化 fork；数据丢失看持久化与复制；一致性问题看缓存读写策略；高可用问题看主从、哨兵、集群；容量问题看淘汰策略与大 key。\",\nc:\"常见混淆对：穿透、击穿、雪崩；RDB 与 AOF；哨兵与 Cluster；事务与 Pipeline；惰性删除与定期删除；LRU 与 LFU；单线程与多线程 IO。\",\na:\"遇到“Redis 慢”，先问：是个别命令慢、整体变慢，还是网络慢？分别用 SLOWLOG、INFO、延迟监控去验证。\"},\nstory:[[null,\"货栈大考。考官把前面所有的案例摊在桌上，开始连环问。\"]],\nqs:[{s:\"考官：“线上 Redis 的 CPU 单核打满，延迟飙升，排查方向？”\",\no:[[\"查 SLOWLOG 看慢命令，排查 KEYS、HGETALL 等 O(N) 命令，大 key、热 key 与持久化的 fork。\",1,\"“怎么避免 KEYS？”“用 SCAN 增量遍历。”\"],[\"把单线程改成多线程执行命令。\",0,\"“命令执行依然是单线程。”\"],[\"直接重启。\",0,\"“治标不治本，还可能丢数据。”\"]],\nn:\"考点：延迟问题先查慢命令、大 key、热 key、持久化；用 SCAN 替代 KEYS。\"},\n{s:\"考官：“缓存与数据库双写，如何尽量保证一致？”\",\no:[[\"Cache Aside：先更新数据库再删缓存；失败重试或订阅 binlog；设置过期时间兜底；强一致场景慎用缓存。\",1,\"“为什么删除而不是更新？”“更新开销大，且并发下可能写入旧值。”\"],[\"先更新缓存，再更新数据库。\",0,\"“更新失败会造成不一致。”\"],[\"并发写，谁快谁赢。\",0,\"“没有任何一致性保证。”\"]],\nn:\"考点：先更新库再删缓存，加重试、binlog、过期兜底；强一致场景不适合缓存。\"},\n{s:\"考官：“Redis 宕机重启后丢了一部分数据，怎么配置以减少丢失？”\",\no:[[\"开启 AOF（everysec）或混合持久化，并配合主从高可用。\",1,\"“还能更安全吗？”“appendfsync always，代价是性能。”\"],[\"只开 RDB，并把间隔调大。\",0,\"“丢得更多。”\"],[\"关闭持久化。\",0,\"“重启后数据全部丢失。”\"]],\nn:\"考点：AOF everysec 或混合持久化，加主从；always 最安全但最慢。\"},\n{s:\"考官：“分布式锁在主从切换后，出现了两个客户端同时持锁，为什么？”\",\no:[[\"主从异步复制，主库宕机时锁还没同步到从库，新主上没有该锁；需要更强保证（RedLock、ZooKeeper、fencing token）。\",1,\"“RedLock 完全可靠吗？”“有争议，依赖时钟与时序假设。”\"],[\"因为锁的过期时间太短。\",0,\"“那是另一种问题。”\"],[\"因为从库不支持 SET NX。\",0,\"“从库支持，问题在于复制是异步的。”\"]],\nn:\"考点：异步复制导致主从切换丢锁；用 RedLock、ZooKeeper 或 fencing token 增强。\"},\n{s:\"考官：“Redis Cluster 下 MGET 多个 key 报 CROSSSLOT，为什么？怎么办？”\",\no:[[\"key 落在不同的槽与节点，多 key 命令要求同槽；用 hash tag 让相关 key 落到同一槽，或拆分请求。\",1,\"“hash tag 怎么写？”“用花括号包住参与哈希的部分。”\"],[\"因为 MGET 不支持集群。\",0,\"“支持，但有同槽限制。”\"],[\"因为 key 太长。\",0,\"“与长度无关。”\"]],\nn:\"考点：Cluster 多 key 命令需同槽；用 hash tag 或拆分请求。\"}]}\n];\nconst $=id=>document.getElementById(id);\nlet done=[];try{done=JSON.parse(localStorage.getItem(\"redis-done\")||\"[]\")}catch(e){}\nfunction save(){try{localStorage.setItem(\"redis-done\",JSON.stringify(done))}catch(e){}}\nfunction show(id){document.querySelectorAll(\".screen\").forEach(s=>s.classList.toggle(\"on\",s.id===id))}\nlet ch=0,i=0,q=[],ok=0,wrong=[],fromGame=false;\nfunction menu(){\n  const got=C.filter((c,n)=>done.includes(n)).flatMap(c=>c.tags),all=C.flatMap(c=>c.tags).concat(PLAN);\n  $(\"cov\").innerHTML=`<div style=\"font:14px system-ui,sans-serif;color:var(--dim)\">知识点覆盖 ${got.length} / ${all.length}（本部规划中，后续章节陆续追加）<\/div><div class=\"bar\"><i style=\"width:${got.length/all.length*100}%\"><\/i><\/div>`;\n  $(\"chips\").innerHTML=all.map(t=>`<span class=\"${got.includes(t)?\"on\":\"\"}\">${t}<\/span>`).join(\"\");\n  $(\"list\").innerHTML=\"\";C.forEach((c,n)=>{const b=document.createElement(\"button\");b.className=\"ch\"+(done.includes(n)?\" done\":\"\");\n    b.innerHTML=`<b>${c.t}<\/b><span>${c.d}<\/span>`;b.onclick=()=>{ch=n;fromGame=false;card()};$(\"list\").appendChild(b)});\n  show(\"menu\");\n}\nfunction card(){\n  const c=C[ch],k=c.card;\n  $(\"cardbody\").innerHTML=`<h2>${c.t}<\/h2><div class=\"sub\">知识卡：${c.d}<\/div>\n   <details open><summary>大白话<\/summary><p>${k.p}<\/p><\/details>\n   <details open><summary>正经解释<\/summary><p>${k.f}<\/p><\/details>\n   <details open><summary>对比与适用场景<\/summary><p>${k.c}<\/p><\/details>\n   <details open><summary>面试官常见追问<\/summary><p>${k.a}<\/p><\/details>\n   <button class=\"go\" id=\"goOn\">${fromGame?\"回到剧情\":\"进入剧情\"}<\/button><button class=\"go alt\" id=\"cb\">返回目录<\/button>`;\n  $(\"goOn\").onclick=()=>fromGame?show(\"game\"):start();$(\"cb\").onclick=menu;show(\"card\");\n}\nfunction start(){\n  const c=C[ch];q=[];ok=0;wrong=[];i=0;\n  c.story.forEach(l=>q.push({k:\"l\",w:l[0],t:l[1]}));\n  c.qs.forEach(x=>{q.push({k:\"l\",w:\"考官\",t:x.s});q.push({k:\"c\",x})});q.push({k:\"end\"});\n  $(\"title\").textContent=c.t;$(\"title\").style.animation=\"none\";void $(\"title\").offsetWidth;$(\"title\").style.animation=\"\";\n  $(\"choices\").innerHTML=\"\";$(\"sc\").textContent=\"答对 0 / \"+c.qs.length;fromGame=true;show(\"game\");line(null,\"点击对话框开始。\");\n}\nfunction line(w,t,note){$(\"who\").textContent=w||\"\";$(\"who\").className=w===\"考官\"?\"int\":w===\"我\"?\"me\":\"\";$(\"txt\").textContent=t;$(\"txt\").className=note?\"note\":\"\"}\nfunction next(){\n  if($(\"choices\").children.length)return;const n=q[i++];if(!n)return;\n  if(n.k===\"l\")line(n.w,n.t,n.note);else if(n.k===\"c\")ask(n.x);else finish();\n}\nfunction ask(x){\n  line(\"考官\",x.s);const c=$(\"choices\");c.innerHTML=\"\";\n  x.o.forEach(o=>{const b=document.createElement(\"button\");b.className=\"opt\";b.textContent=o[0];\n    b.onclick=()=>{c.innerHTML=\"\";if(o[1])ok++;else wrong.push(x.n);\n      $(\"sc\").textContent=\"答对 \"+ok+\" / \"+C[ch].qs.length;\n      q.splice(i,0,{k:\"l\",w:\"我\",t:o[0]},{k:\"l\",w:\"考官\",t:o[2]},{k:\"l\",w:null,t:(o[1]?\"答对了。\":\"答错了。\")+\"\\n\"+x.n,note:1});next()};\n    c.appendChild(b)});\n}\nfunction finish(){\n  const c=C[ch],pass=ok===c.qs.length;if(pass&&!done.includes(ch)){done.push(ch);save()}\n  $(\"endbody\").innerHTML=`<h2 style=\"margin:0 0 4px\">${pass?\"本章通关\":\"差一点，再看一遍知识卡\"}<\/h2>\n   <div style=\"color:var(--dim)\">答对 ${ok} / ${c.qs.length}<\/div>\n   ${wrong.length?\"<p>需要巩固：<\/p><ul>\"+wrong.map(w=>`<li>${w}<\/li>`).join(\"\")+\"<\/ul>\":\"<p>本章全部答对。<\/p>\"}\n   <button class=\"go\" id=\"r1\">重玩本章<\/button>${pass&&ch<C.length-1?'<button class=\"go\" id=\"r2\">下一章<\/button>':\"\"}\n   <button class=\"go alt\" id=\"r3\">回目录<\/button>`;\n  $(\"r1\").onclick=start;$(\"r3\").onclick=menu;if($(\"r2\"))$(\"r2\").onclick=()=>{ch++;fromGame=false;card()};show(\"end\");\n}\n$(\"box\").onclick=next;$(\"back\").onclick=menu;$(\"kc\").onclick=card;\ndocument.addEventListener(\"keydown\",e=>{if((e.key===\" \"||e.key===\"Enter\")&&document.activeElement.tagName!==\"BUTTON\"&&$(\"game\").classList.contains(\"on\")){e.preventDefault();next()}});\nmenu();\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "ch07", "num": "07", "title": "算法王国 · 数据结构与算法", "name": "算法王国", "sub": "数据结构与算法篇。每章先读知识卡，再看剧情，最后过面试关。剧情顺序就是知识的依赖顺序。", "colors": {"bg": "#121a10", "bg2": "#2c3d1c", "gold": "#b7e36b"}, "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>算法王国 · 数据结构与算法<\/title>\n<style>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);\n--bg:#121a10;--bg2:#2c3d1c;--ink:#ece6d2;--dim:#9b9884;--gold:#b7e36b;--red:#d8664b;--ok:#7fc096;--box:rgba(14,20,10,.9);--line:rgba(236,230,210,.2)}\n:root[data-theme=\"dark\"]{--bg:#121a10}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#121a10}}\n*,*::before,*::after{box-sizing:inherit}\nhtml{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.8 \"Songti SC\",\"Noto Serif SC\",\"Source Han Serif SC\",serif;overflow:hidden}\n#app{height:100%;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 0%,var(--bg2),var(--bg))}\nbutton{font:inherit;color:inherit;cursor:pointer}\nbutton:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}\n.screen{display:none;flex:1;min-height:0;flex-direction:column}.screen.on{display:flex}\n.wrap{width:100%;max-width:680px;margin:0 auto;padding:6vh 20px 24px;overflow-y:auto}\nh1{font-size:clamp(32px,9vw,48px);line-height:1.15;margin:0 0 6px;letter-spacing:.06em;font-weight:900}\n.sub{color:var(--dim);font-size:15px;margin:0 0 18px}\n.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 10px}\n.bar i{display:block;height:100%;background:var(--gold)}\n.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px;font:12px/1 system-ui,sans-serif}\n.chips span{padding:5px 8px;border:1px dashed var(--line);border-radius:12px;color:var(--dim)}\n.chips span.on{border:1px solid var(--gold);color:var(--gold)}\n.ch{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:6px;padding:13px 16px;margin-bottom:12px}\n.ch:hover{border-color:var(--gold)}.ch b{display:block;font-size:18px}.ch span{color:var(--dim);font-size:14px}\n.ch.done b::after{content:\" 已通关\";color:var(--ok);font-size:13px;font-weight:400}\n/* card */\n#card h2{font-size:24px;margin:0 0 4px}\ndetails{border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:rgba(255,255,255,.03)}\nsummary{cursor:pointer;font:700 14px/1.6 system-ui,sans-serif;color:var(--gold)}\ndetails p{margin:8px 0 2px;font-size:16px}\n.go{background:var(--gold);color:#1a2a06;border:0;border-radius:6px;padding:11px 20px;font-weight:700;margin:10px 10px 0 0}\n.go.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}\n/* game */\n#hud{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;font:14px/1 system-ui,sans-serif;color:var(--dim)}\n#hud button{background:none;border:0;color:var(--dim);padding:6px 0}\n#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 24px;text-align:center}\n#title{font-size:clamp(24px,6.5vw,36px);font-weight:900;line-height:1.3;letter-spacing:.05em;animation:rise 1s both}\n@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}\n@media (prefers-reduced-motion:reduce){#title{animation:none}}\n#choices{padding:0 16px 8px;display:flex;flex-direction:column;gap:10px;max-width:680px;width:100%;margin:0 auto}\n.opt{background:var(--box);border:1px solid var(--gold);border-radius:6px;padding:12px 14px;text-align:left;line-height:1.6}\n.opt:hover{background:rgba(183,227,107,.14)}\n#box{margin:8px 12px 14px;max-width:680px;width:calc(100% - 24px);align-self:center;min-height:132px;background:var(--box);border:1px solid var(--line);border-radius:8px;padding:14px 18px 20px;text-align:left;cursor:pointer;position:relative}\n#who{font:700 14px/1 system-ui,sans-serif;color:var(--gold);margin-bottom:8px;min-height:14px}\n#who.int{color:var(--red)}#who.me{color:var(--ok)}\n#txt{font-size:17px;white-space:pre-wrap}#txt.note{color:var(--gold)}\n#tap{position:absolute;right:14px;bottom:6px;color:var(--dim);font:12px system-ui,sans-serif}\n#end ul{padding-left:20px}#end li{margin-bottom:10px}\npre{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;margin:8px 0;white-space:pre}<\/style>\n<\/head>\n<body>\n<div id=\"app\">\n <div id=\"menu\" class=\"screen on\"><div class=\"wrap\">\n  <h1>算法王国<\/h1>\n  <p class=\"sub\">数据结构与算法篇。每章先读知识卡，再看剧情，最后过面试关。剧情顺序就是知识的依赖顺序。<\/p>\n  <div id=\"cov\"><\/div><div id=\"chips\" class=\"chips\"><\/div><div id=\"list\"><\/div>\n <\/div><\/div>\n <div id=\"card\" class=\"screen\"><div class=\"wrap\" id=\"cardbody\"><\/div><\/div>\n <div id=\"game\" class=\"screen\">\n  <div id=\"hud\"><button id=\"back\">返回<\/button><button id=\"kc\">看知识卡<\/button><span id=\"sc\"><\/span><\/div>\n  <div id=\"stage\"><div id=\"title\"><\/div><\/div>\n  <div id=\"choices\"><\/div>\n  <div id=\"box\"><div id=\"who\"><\/div><div id=\"txt\"><\/div><span id=\"tap\">点击继续<\/span><\/div>\n <\/div>\n <div id=\"end\" class=\"screen\"><div class=\"wrap\" id=\"endbody\"><\/div><\/div>\n<\/div>\n<script>\nconst PLAN=[];\nconst C=[\n{\n\"t\": \"第1章　整齐的货架\",\n\"d\": \"数组、二分查找、双指针与滑动窗口\",\n\"tags\": [\n\"数组\",\n\"二分查找\",\n\"双指针与滑动窗口\"\n],\n\"card\": {\n\"p\": \"数组像一排编好号的货架：按编号取货一步到位，但中间想插一件货，后面的全得往后挪。\",\n\"f\": \"数组在内存中连续存放，按下标访问 O(1)；插入和删除需要移动元素，O(n)；删除元素本质上是覆盖。二维数组在内存中也是连续的（Go、C 按行存放）。二分查找要求数组有序，时间 O(log n)，要守住循环不变量：左闭右闭写法用 while l <= r，更新 l = mid+1 或 r = mid-1；左闭右开写法用 while l < r，更新 r = mid。mid 用 l+(r-l)/2 防止溢出。\",\n\"c\": \"双指针（快慢指针）原地移除元素：快指针找要保留的元素，慢指针负责写入，O(n) 时间 O(1) 空间。滑动窗口：用左右指针维护一个区间，右指针扩张、满足条件后左指针收缩，每个元素最多进出一次，O(n)，比暴力的 O(n²) 快（如长度最小的子数组）。前缀和：预处理后区间和 O(1) 查询。\",\n\"a\": \"二分查找容易错在哪？（边界与更新不统一）滑动窗口为什么是 O(n)？（左右指针各最多走 n 步）\"\n},\n\"story\": [\n[\nnull,\n\"阿算是算法王国的学徒。第一关，是一排按编号排列的货架。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“二分查找的前提和时间复杂度是什么？”\",\n\"o\": [\n[\n\"数组有序，时间复杂度 O(log n)。\",\n1,\n\"“循环不变量是什么意思？”“区间的开闭要前后统一。”\"\n],\n[\n\"不需要有序，时间复杂度 O(n)。\",\n0,\n\"“那是顺序查找。”\"\n],\n[\n\"必须是链表，时间复杂度 O(log n)。\",\n0,\n\"“二分依赖随机访问。”\"\n]\n],\n\"n\": \"考点：二分要求有序，O(log n)；区间开闭要统一，mid 防溢出。\"\n},\n{\n\"s\": \"考官：“滑动窗口为什么比暴力快？”\",\n\"o\": [\n[\n\"用左右指针维护窗口，每个元素最多进出一次，O(n)；暴力是 O(n²)。\",\n1,\n\"“什么题适合？”“连续子数组、子串类。”\"\n],\n[\n\"因为它先对数组排序。\",\n0,\n\"“滑动窗口不需要排序。”\"\n],\n[\n\"因为它使用了哈希表。\",\n0,\n\"“不一定需要哈希表。”\"\n]\n],\n\"n\": \"考点：滑动窗口左右指针各走一遍，O(n)；适合连续子数组、子串问题。\"\n}\n]\n},\n{\n\"t\": \"第2章　串起来的货\",\n\"d\": \"链表、数组与链表的对比、快慢指针\",\n\"tags\": [\n\"链表\",\n\"数组 vs 链表\",\n\"快慢指针\"\n],\n\"card\": {\n\"p\": \"链表像一队人，每个人只知道下一个人是谁。想找第 5 个人，必须从头一个个数过去；但要在中间插一个人，只用改两个人的手。\",\n\"f\": \"单链表节点由值和 next 组成，还有双向链表、循环链表。已知前驱节点时，插入删除 O(1)；按位置查找 O(n)。常用技巧：虚拟头节点（统一处理头节点）；反转链表（prev、cur 双指针迭代）；快慢指针找中点、判断是否有环（快指针每次两步，慢指针每次一步，相遇则有环）；找环入口（相遇后一个指针回到头，两者同速前进，再次相遇处就是入口）；删除倒数第 N 个（快指针先走 N 步）。\",\n\"c\": \"数组：连续内存，随机访问 O(1)，缓存友好，增删 O(n)，需要扩容。链表：不连续，随机访问 O(n)，已知位置的增删 O(1)，每个节点有额外指针开销，缓存局部性差。实际工程里数组（切片）往往更快，只有频繁在中间增删且已持有节点引用（如 LRU）时链表才有优势。\",\n\"a\": \"为什么实际中链表常常比数组慢？（缓存不友好，指针跳转）环入口为什么是那个公式？（相遇时路程关系 a = (n-1)(b+c) + c）\"\n},\n\"story\": [\n[\nnull,\n\"第二关，是一队互相牵手的货物，每个只记得下一个是谁。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“数组和链表在随机访问与中间插入上的差别？”\",\n\"o\": [\n[\n\"数组随机访问 O(1)、中间插入 O(n)；链表随机访问 O(n)、已知位置的插入 O(1)。\",\n1,\n\"“为什么实际中数组常常更快？”“缓存友好。”\"\n],\n[\n\"数组随机访问 O(n)，链表 O(1)。\",\n0,\n\"“说反了。”\"\n],\n[\n\"两者完全一样。\",\n0,\n\"“结构不同，性能不同。”\"\n]\n],\n\"n\": \"考点：数组随机访问快、增删慢；链表反之；数组缓存友好。\"\n},\n{\n\"s\": \"考官：“怎么判断链表是否有环？”\",\n\"o\": [\n[\n\"快慢指针：快指针每次走两步，慢指针一步，若相遇则有环。\",\n1,\n\"“怎么找入口？”“相遇后一个指针回到头，同速前进再相遇即入口。”\"\n],\n[\n\"遍历到 nil 就说明有环。\",\n0,\n\"“遍历到 nil 说明没有环。”\"\n],\n[\n\"用递归求链表长度。\",\n0,\n\"“有环时递归不会终止。”\"\n]\n],\n\"n\": \"考点：快慢指针判环；相遇后重置一个指针到头，同速前进，再次相遇为入口。\"\n}\n]\n},\n{\n\"t\": \"第3章　编号对照表\",\n\"d\": \"哈希表、哈希冲突、map 的有序性\",\n\"tags\": [\n\"哈希表\",\n\"哈希冲突\",\n\"map 有序性\"\n],\n\"card\": {\n\"p\": \"哈希表像按“姓名首字母算出的号码”分格的柜子：给名字，算一下号码，直接去那一格找，几乎不用翻。偶尔两个名字算出同一个号码，就在那格里排队。\",\n\"f\": \"哈希表通过哈希函数把 key 映射到数组下标，平均查找、插入、删除 O(1)，最坏 O(n)。哈希冲突的解法：拉链法（同一格挂链表，Java 8 的 HashMap 链表过长会转成红黑树）、开放寻址（线性探测、二次探测等）。负载因子 = 元素数 / 桶数，过大就扩容并 rehash。适合场景：判断元素是否出现过、统计频次（两数之和、字母异位词）。\",\n\"c\": \"有序性对比：Go 的 map 遍历顺序随机（无序，且故意随机化）；Java 的 HashMap 不保证顺序，LinkedHashMap 按插入（或访问）顺序，TreeMap 基于红黑树按 key 排序；C++ 的 unordered_map 无序，std::map 基于红黑树有序。要有序遍历 Go 的 map，需要先取出 key 排序。哈希表不支持范围查询，这是它与平衡树的关键差异。\",\n\"a\": \"哈希表扩容为什么要 rehash？（桶数变了，下标需要重新计算）为什么需要有序时用树而不是哈希？（哈希无序，范围查询不支持）\"\n},\n\"story\": [\n[\nnull,\n\"第三关是一座分格的柜子：给个名字，算一下，直接去那一格。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“Go 的 map 遍历是有序的吗？”\",\n\"o\": [\n[\n\"无序，且每次遍历的顺序可能不同；需要有序要先取 key 排序。\",\n1,\n\"“Java 的 TreeMap 呢？”“基于红黑树，按 key 有序。”\"\n],\n[\n\"按插入顺序。\",\n0,\n\"“Go 的 map 不保证插入顺序。”\"\n],\n[\n\"按 key 升序。\",\n0,\n\"“不会自动排序。”\"\n]\n],\n\"n\": \"考点：Go map 遍历无序且随机；LinkedHashMap 保插入序；TreeMap 按 key 有序。\"\n},\n{\n\"s\": \"考官：“哈希冲突怎么解决？”\",\n\"o\": [\n[\n\"拉链法和开放寻址（如线性探测）；负载因子过大会扩容 rehash。\",\n1,\n\"“Java 8 做了什么优化？”“链表过长转成红黑树。”\"\n],\n[\n\"禁止冲突发生。\",\n0,\n\"“冲突无法完全避免。”\"\n],\n[\n\"只能直接覆盖旧值。\",\n0,\n\"“那会丢数据。”\"\n]\n],\n\"n\": \"考点：拉链法、开放寻址；负载因子与扩容；Java 8 链表转红黑树。\"\n}\n]\n},\n{\n\"t\": \"第4章　对暗号\",\n\"d\": \"字符串与 KMP\",\n\"tags\": [\n\"KMP\"\n],\n\"card\": {\n\"p\": \"在一大段文字里找一个暗号。笨办法是每次失配都回到起点重新对；KMP 的聪明之处是：已经对上的那一部分里有规律，失配时不必从头再来。\",\n\"f\": \"暴力匹配是 O(n·m)。KMP 在失配时主串指针不回退，只让模式串指针按 next 数组回退，时间 O(n+m)。next[i] 表示模式串 [0..i] 的最长相等前后缀长度（前缀不含最后一个字符，后缀不含第一个字符）。构造 next 也是用双指针让模式串自己匹配自己。\",\n\"c\": \"常见字符串题：反转字符串（双指针）、翻转单词、重复的子串（把 s 拼成 s+s，去掉首尾字符后看是否包含 s，或用 next 数组判断）。Go 的 strings.Index 内部并不总是 KMP，实际会按长度选不同算法，但面试考的是原理。理解 next 数组的“最长相等前后缀”就能手写。\",\n\"a\": \"next 数组怎么求？（双指针，前缀末尾 j 与后缀末尾 i 比较，失配时 j 回退到 next[j-1]）KMP 与哈希匹配（Rabin-Karp）的区别？\"\n},\n\"story\": [\n[\nnull,\n\"第四关是一段很长的文字，里面藏着一个暗号。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“KMP 的 next 数组表示什么？”\",\n\"o\": [\n[\n\"模式串每个前缀的最长相等前后缀长度，失配时据此回退模式串指针。\",\n1,\n\"“时间复杂度？”“O(n+m)。”\"\n],\n[\n\"每个字符出现的次数。\",\n0,\n\"“那是频次统计。”\"\n],\n[\n\"主串的哈希值。\",\n0,\n\"“那是哈希匹配。”\"\n]\n],\n\"n\": \"考点：next 记录最长相等前后缀，失配时模式串指针回退，主串不回退。\"\n},\n{\n\"s\": \"考官：“KMP 相比暴力匹配的优势是什么？”\",\n\"o\": [\n[\n\"主串指针不回退，时间复杂度 O(n+m)。\",\n1,\n\"“暴力是多少？”“O(n·m)。”\"\n],\n[\n\"时间复杂度 O(log n)。\",\n0,\n\"“不是。”\"\n],\n[\n\"空间复杂度为 0。\",\n0,\n\"“需要额外的 next 数组。”\"\n]\n],\n\"n\": \"考点：KMP 线性复杂度，需 O(m) 额外空间。\"\n}\n]\n},\n{\n\"t\": \"第5章　先进后出与优先排队\",\n\"d\": \"栈、队列、单调栈与堆\",\n\"tags\": [\n\"栈与队列\",\n\"单调栈\",\n\"堆与 Top-K\"\n],\n\"card\": {\n\"p\": \"栈像一摞盘子，最后放的最先拿；队列像排队买票，先来先走。堆则像一个“永远让最大（或最小）的人站在队头”的特殊队伍。\",\n\"f\": \"栈（LIFO）：括号匹配、逆波兰表达式。队列（FIFO）：用两个栈实现队列（入栈、出栈，出栈为空时把入栈全部倒入）。单调栈：找每个元素右侧第一个更大（或更小）的元素，每个元素最多入栈出栈一次，O(n)。单调队列：滑动窗口最大值，队头始终是窗口最大值，O(n)。堆（优先队列）：完全二叉树，大顶堆堆顶最大，插入与弹出 O(log n)，取堆顶 O(1)。\",\n\"c\": \"Top-K：求最大的 K 个元素，维护大小为 K 的小顶堆，遍历时比堆顶大就替换，O(n log K)，内存只需 K 个，适合海量数据流式处理。快速选择（quickselect）平均 O(n)，但需要把数据放进内存。Go 里用 container/heap 实现堆。堆排序也基于堆。\",\n\"a\": \"为什么求最大的 K 个用小顶堆？（堆顶是当前第 K 大，方便淘汰）单调栈为什么是 O(n)？（每个元素至多入栈出栈各一次）\"\n},\n\"story\": [\n[\nnull,\n\"第五关里有三种排队的方式：后进先出、先进先出，还有永远让最大的人排最前。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“求数组中最大的 K 个元素，常用什么办法？”\",\n\"o\": [\n[\n\"维护一个大小为 K 的小顶堆，比堆顶大就替换，O(n log K)。\",\n1,\n\"“海量数据呢？”“流式处理，只占 K 个空间。”\"\n],\n[\n\"维护大小为 K 的大顶堆，堆顶就是第 K 大。\",\n0,\n\"“大顶堆的堆顶是最大的，不是第 K 大。”\"\n],\n[\n\"没有比全排序更好的办法。\",\n0,\n\"“堆和快速选择都更优。”\"\n]\n],\n\"n\": \"考点：Top-K 用大小为 K 的小顶堆，O(n log K)。\"\n},\n{\n\"s\": \"考官：“单调栈解决什么问题？复杂度？”\",\n\"o\": [\n[\n\"找每个元素右侧第一个更大（或更小）的元素，每个元素最多入出栈一次，O(n)。\",\n1,\n\"“单调队列呢？”“滑动窗口最大值。”\"\n],\n[\n\"给数组排序。\",\n0,\n\"“单调栈不是排序算法。”\"\n],\n[\n\"只能判断括号匹配。\",\n0,\n\"“那是普通栈。”\"\n]\n],\n\"n\": \"考点：单调栈求下一个更大元素，O(n)；单调队列求滑动窗口最大值。\"\n}\n]\n},\n{\n\"t\": \"第6章　分叉的树\",\n\"d\": \"二叉树遍历、二叉搜索树、平衡树与红黑树\",\n\"tags\": [\n\"二叉树遍历\",\n\"二叉搜索树\",\n\"平衡树与红黑树\"\n],\n\"card\": {\n\"p\": \"一棵树从根开始分叉，每个节点最多两个孩子。怎么逛一遍这棵树，有先看自己、先看左边、先看右边几种顺序，也可以一层一层逛。\",\n\"f\": \"遍历：前序（根左右）、中序（左根右）、后序（左右根），可用递归或栈迭代；层序遍历用队列（BFS）。满二叉树、完全二叉树（除最后一层外全满，最后一层靠左，可用数组存储，堆就是完全二叉树）。二叉搜索树（BST）：左子树所有节点小于根、右子树所有节点大于根，中序遍历得到升序序列，查找 O(h)，极端情况退化成链表 O(n)。\",\n\"c\": \"平衡树：AVL 树严格平衡（左右子树高度差不超过 1），查询更快，但插入删除旋转更多；红黑树近似平衡（最长路径不超过最短路径的 2 倍），插入删除代价小，更适合频繁修改，C++ 的 map、Java 的 TreeMap 与 HashMap 的树化都用它。B+ 树则面向磁盘，见 MySQL 篇。递归写法的“三部曲”：确定参数与返回值、终止条件、单层逻辑。\",\n\"a\": \"二叉树深度怎么求？（后序递归，或层序统计层数）为什么 BST 可能退化？（按顺序插入会变成链）\"\n},\n\"story\": [\n[\nnull,\n\"第六关是一棵会分叉的树。逛法有好几种。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“二叉搜索树的中序遍历结果有什么特点？”\",\n\"o\": [\n[\n\"是升序序列。\",\n1,\n\"“怎么利用？”“验证 BST、求第 K 小。”\"\n],\n[\n\"是降序序列。\",\n0,\n\"“反中序才是降序。”\"\n],\n[\n\"是随机顺序。\",\n0,\n\"“有序是 BST 的性质。”\"\n]\n],\n\"n\": \"考点：BST 中序遍历为升序；可用来验证 BST、求第 K 小。\"\n},\n{\n\"s\": \"考官：“AVL 树和红黑树有什么区别？”\",\n\"o\": [\n[\n\"AVL 严格平衡，查询更快但旋转更多；红黑树近似平衡，插入删除代价小，更适合频繁修改。\",\n1,\n\"“哪个用得更多？”“红黑树，如 Java 的 TreeMap。”\"\n],\n[\n\"红黑树比 AVL 更严格平衡。\",\n0,\n\"“AVL 更严格。”\"\n],\n[\n\"两者没有区别。\",\n0,\n\"“平衡程度与旋转次数不同。”\"\n]\n],\n\"n\": \"考点：AVL 严格平衡查询快、旋转多；红黑树近似平衡、修改代价小。\"\n}\n]\n},\n{\n\"t\": \"第7章　城市之间的路\",\n\"d\": \"图：存储、遍历、拓扑排序、并查集、最短路径\",\n\"tags\": [\n\"图遍历\",\n\"拓扑排序\",\n\"并查集\",\n\"最短路径\"\n],\n\"card\": {\n\"p\": \"城市与城市之间有路，就是图。想逛遍所有城市，可以一条路走到底再回头（DFS），也可以一圈一圈往外扩（BFS）。\",\n\"f\": \"存储：邻接矩阵（稠密图，空间 O(V²)，查边 O(1)）、邻接表（稀疏图，空间 O(V+E)）。DFS 用递归或栈，BFS 用队列，无权图的最短路径用 BFS。拓扑排序：有向无环图，Kahn 算法每次取入度为 0 的节点，若处理的节点数小于总数则存在环。并查集：find 加路径压缩、union 按秩合并，近似 O(1)，用于连通性、判环、Kruskal 最小生成树。\",\n\"c\": \"最短路径：Dijkstra 适用于非负权边，用堆优化 O((V+E) log V)；Bellman-Ford 可处理负权边并能检测负环；Floyd 求任意两点最短路，O(V³)。最小生成树：Prim（点扩展）、Kruskal（按边权排序加并查集）。BFS 与 DFS 的选择：求最短步数用 BFS，枚举所有路径、连通分量用 DFS。\",\n\"a\": \"Dijkstra 为什么不能有负权边？（已确定的最短路可能被负边改写）课程表问题怎么做？（拓扑排序判环）\"\n},\n\"story\": [\n[\nnull,\n\"第七关是一张错综复杂的地图，城市之间有的路单向，有的双向。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“无权图的最短路径用什么算法？”\",\n\"o\": [\n[\n\"BFS，一层一层扩展，第一次到达就是最短。\",\n1,\n\"“带权呢？”“非负权用 Dijkstra。”\"\n],\n[\n\"DFS，一定先找到最短路。\",\n0,\n\"“DFS 不保证最短。”\"\n],\n[\n\"拓扑排序。\",\n0,\n\"“拓扑排序用于有向无环图的排序。”\"\n]\n],\n\"n\": \"考点：无权图最短路径用 BFS；非负权用 Dijkstra；有负权用 Bellman-Ford。\"\n},\n{\n\"s\": \"考官：“多个任务有依赖关系，如何判断能否全部完成？”\",\n\"o\": [\n[\n\"拓扑排序：若处理的节点数小于总数，说明有环，无法完成。\",\n1,\n\"“怎么实现？”“Kahn 算法，用入度为 0 的队列。”\"\n],\n[\n\"用并查集判断。\",\n0,\n\"“并查集适合无向图的连通性。”\"\n],\n[\n\"用 Dijkstra。\",\n0,\n\"“那是最短路径。”\"\n]\n],\n\"n\": \"考点：依赖关系用拓扑排序，有环则无法完成。\"\n}\n]\n},\n{\n\"t\": \"第8章　试错与撤销\",\n\"d\": \"回溯：组合、排列、子集与去重\",\n\"tags\": [\n\"回溯\"\n],\n\"card\": {\n\"p\": \"回溯像走迷宫：选一条路走下去，走不通就退回上一个路口，换一条路。每一次选择都要能被“撤销”。\",\n\"f\": \"回溯本质是递归加撤销选择，等价于对一棵决策树做深度优先搜索。模板：终止条件时收集结果；for 遍历选择列表，做选择、递归、撤销选择。组合问题用 startIndex 控制只往后选，避免重复；排列问题用 used 数组标记已用元素；子集问题在每个节点都收集结果。N 皇后、分割回文串、解数独都属于这一类。\",\n\"c\": \"含重复元素时的去重：先排序，在同一层（树层）跳过相同元素（i > start 且 nums[i] == nums[i-1]），同一枝（树枝）上可以重复使用。剪枝：提前判断不可能成功就返回，如和已超过目标。复杂度通常是指数级或阶乘级，回溯不是高效算法，只是穷举加剪枝。\",\n\"a\": \"树层去重与树枝去重的区别？（同一层不能选相同值，同一条路径上可以）怎么优化？（排序加剪枝）\"\n},\n\"story\": [\n[\nnull,\n\"第八关是一座迷宫。走不通的路，要退回来换一条。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“组合问题怎么避免选出重复的组合？”\",\n\"o\": [\n[\n\"用 startIndex 控制只往后选，避免回头选前面的元素。\",\n1,\n\"“排列问题呢？”“用 used 数组标记。”\"\n],\n[\n\"用 used 数组。\",\n0,\n\"“那是排列问题的做法。”\"\n],\n[\n\"限制递归深度。\",\n0,\n\"“和重复无关。”\"\n]\n],\n\"n\": \"考点：组合用 startIndex，排列用 used 数组。\"\n},\n{\n\"s\": \"考官：“含重复元素的数组做组合，如何去重？”\",\n\"o\": [\n[\n\"先排序，同一层里跳过相同元素，剪掉重复分支。\",\n1,\n\"“树枝上可以重复选吗？”“可以。”\"\n],\n[\n\"只能在得到全部结果后再去重，无法剪枝。\",\n0,\n\"“排序加同层跳过可以提前剪枝。”\"\n],\n[\n\"不需要处理。\",\n0,\n\"“不处理会产生重复结果。”\"\n]\n],\n\"n\": \"考点：排序加树层去重（同层跳过相同元素）。\"\n}\n]\n},\n{\n\"t\": \"第9章　每步取最好\",\n\"d\": \"贪心\",\n\"tags\": [\n\"贪心\"\n],\n\"card\": {\n\"p\": \"贪心就是每一步都挑当下最划算的，不回头。运气好的时候，每一步最划算，合起来就是整体最划算。\",\n\"f\": \"贪心的核心：局部最优推出全局最优，没有固定套路，常见做法是排序加选择。例子：分发饼干（大饼干给大胃口）、跳跃游戏（维护最远可达范围）、买卖股票 II（累加所有上涨差价）、区间调度（按右端点升序排序，选择不重叠的区间）。证明常靠举反例或反证，试一试找不到反例，就可以尝试。\",\n\"c\": \"贪心与动态规划的区别：贪心每一步只做当前最优选择，不回溯，也不保存子问题，需要证明正确；动态规划保存子问题的最优解，通过状态转移比较所有可能。能用贪心的通常更简单高效，但不是所有问题都适用，比如 0-1 背包就不能用贪心（按单位价值排序会出错），但可以用于分数背包。\",\n\"a\": \"怎么判断能不能用贪心？（找得到反例就不行，找不到可以尝试证明）区间问题按左端点还是右端点排序？（取决于问题，调度问题按右端点）\"\n},\n\"story\": [\n[\nnull,\n\"第九关里，每一步都有人催：现在就做决定，别回头。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“贪心和动态规划有什么区别？”\",\n\"o\": [\n[\n\"贪心每步选局部最优且不回溯，需要证明；动态规划保存子问题最优解，通过状态转移比较所有选择。\",\n1,\n\"“0-1 背包能用贪心吗？”“不能，会出错。”\"\n],\n[\n\"贪心一定比动态规划慢。\",\n0,\n\"“通常更快，但不一定适用。”\"\n],\n[\n\"两者没有区别。\",\n0,\n\"“思路完全不同。”\"\n]\n],\n\"n\": \"考点：贪心不回溯需证明；DP 保存子问题最优解；0-1 背包不能用贪心。\"\n},\n{\n\"s\": \"考官：“要选出最多的互不重叠区间，贪心策略是什么？”\",\n\"o\": [\n[\n\"按右端点升序排序，依次选择不与已选区间重叠的。\",\n1,\n\"“为什么按右端点？”“结束得越早，留给后面的空间越大。”\"\n],\n[\n\"按左端点升序，随便选。\",\n0,\n\"“这样无法保证最多。”\"\n],\n[\n\"按区间长度降序选。\",\n0,\n\"“长区间会占用更多空间。”\"\n]\n],\n\"n\": \"考点：区间调度按右端点升序排序。\"\n}\n]\n},\n{\n\"t\": \"第10章　基础排序三兄弟\",\n\"d\": \"冒泡、选择、插入，稳定性\",\n\"tags\": [\n\"冒泡/选择/插入排序\",\n\"稳定性\"\n],\n\"card\": {\n\"p\": \"排序最朴素的三种办法：相邻的比一比，大的往后冒（冒泡）；每次从剩下的里挑最小的放前面（选择）；像整理扑克牌，把新牌插进已排好的牌里（插入）。\",\n\"f\": \"冒泡排序：相邻元素比较交换，每轮把最大的冒到末尾，O(n²)，稳定，原地；加一个“本轮是否交换过”的标志可在已有序时提前结束，最好 O(n)。选择排序：每轮选最小的放到前面，O(n²)，不稳定（交换会打乱相同元素的相对顺序），原地。插入排序：把元素插入已排序部分的合适位置，平均 O(n²)，最好 O(n)（近乎有序），稳定，原地。\",\n\"c\": \"稳定性：值相等的元素排序后相对顺序不变。多字段排序时需要稳定（先按次要字段排，再按主要字段稳定排）。小规模或近乎有序的数据，插入排序反而很快，所以常被用在高级排序的小区间里（如 TimSort、pdqsort）。复杂度总结：冒泡、选择、插入平均都是 O(n²)；稳定的有冒泡、插入；选择不稳定。\",\n\"a\": \"为什么插入排序在近乎有序时快？（几乎不需要移动）选择排序为什么不稳定？（交换会把相同元素跨过去）\"\n},\n\"story\": [\n[\nnull,\n\"第十关是整理一排乱放的卡牌，阿算一张张试了三种办法。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“近乎有序的数组，下面哪种基础排序最快？”\",\n\"o\": [\n[\n\"插入排序，最好情况 O(n)。\",\n1,\n\"“冒泡也能 O(n) 吗？”“加提前结束的标志可以。”\"\n],\n[\n\"选择排序，因为它总是 O(n)。\",\n0,\n\"“选择排序总是 O(n²)。”\"\n],\n[\n\"堆排序。\",\n0,\n\"“堆排序是 O(n log n)，不如插入快。”\"\n]\n],\n\"n\": \"考点：近乎有序时插入排序接近 O(n)；选择排序总是 O(n²)。\"\n},\n{\n\"s\": \"考官：“排序的稳定性指什么？哪个基础排序不稳定？”\",\n\"o\": [\n[\n\"值相等的元素排序后相对顺序不变；选择排序不稳定。\",\n1,\n\"“快速排序呢？”“也不稳定。”\"\n],\n[\n\"排序耗时稳定。\",\n0,\n\"“稳定性指相对顺序。”\"\n],\n[\n\"冒泡排序不稳定。\",\n0,\n\"“冒泡排序是稳定的。”\"\n]\n],\n\"n\": \"考点：稳定性是相等元素的相对顺序；冒泡、插入稳定，选择、快排、堆排不稳定。\"\n}\n]\n},\n{\n\"t\": \"第11章　高级排序\",\n\"d\": \"快速排序、归并排序、堆排序与非比较排序\",\n\"tags\": [\n\"快速排序\",\n\"归并排序\",\n\"堆排序\",\n\"非比较排序\"\n],\n\"card\": {\n\"p\": \"大批货物要排序，三种聪明办法：选个基准，小的放左边大的放右边，再各自处理（快排）；一分为二，各自排好再合并（归并）；用堆每次取出最大的（堆排）。\",\n\"f\": \"快速排序：选 pivot 分区，递归处理两边；平均 O(n log n)，最坏 O(n²)（如已有序且总取首元素），空间 O(log n)（递归栈），原地，不稳定。优化：随机或三数取中选 pivot、小区间改用插入排序、三路快排（大量重复元素）。归并排序：分治，拆半递归排序再合并，任何情况 O(n log n)，稳定，空间 O(n)，适合链表与外部排序。堆排序：建堆 O(n)，逐个取堆顶 O(n log n)，原地，不稳定，缓存不友好。\",\n\"c\": \"非比较排序：计数排序（整数范围小）O(n+k)，桶排序、基数排序 O(d(n+k))，稳定，但对数据范围有要求。基于比较的排序时间下界是 Ω(n log n)。实际库：Go 的 sort 在 1.19 起用 pdqsort（不稳定，需要稳定用 sort.SliceStable）；Java 对象排序用 TimSort（归并加插入，稳定），基本类型用双轴快排。选择：要求稳定选归并或 TimSort；内存紧张选快排或堆排；范围小的整数用计数排序。\",\n\"a\": \"快排最坏怎么避免？（随机 pivot、三数取中）为什么快排实际比堆排快？（局部性好，常数小）\"\n},\n\"story\": [\n[\nnull,\n\"第十一关里货物堆成了山。阿算要学三种聪明办法。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“快排的最坏情况是什么？怎么避免？”\",\n\"o\": [\n[\n\"每次 pivot 取到最大或最小（如已有序且取首元素），退化成 O(n²)；用随机或三数取中缓解。\",\n1,\n\"“空间复杂度？”“O(log n)，主要是递归栈。”\"\n],\n[\n\"数据完全随机时最坏。\",\n0,\n\"“随机数据通常接近平均。”\"\n],\n[\n\"只有堆排序能避免。\",\n0,\n\"“优化 pivot 就能缓解。”\"\n]\n],\n\"n\": \"考点：快排最坏 O(n²)；随机或三数取中 pivot 缓解；空间 O(log n)。\"\n},\n{\n\"s\": \"考官：“归并排序和快速排序各有什么特点？”\",\n\"o\": [\n[\n\"归并稳定、最坏也是 O(n log n)，但要 O(n) 额外空间；快排原地、平均更快，但不稳定、最坏 O(n²)。\",\n1,\n\"“要稳定排序怎么选？”“归并或 TimSort。”\"\n],\n[\n\"归并是原地且不稳定的。\",\n0,\n\"“归并稳定，需要额外空间。”\"\n],\n[\n\"快排是稳定的。\",\n0,\n\"“快排不稳定。”\"\n]\n],\n\"n\": \"考点：归并稳定、O(n) 空间；快排原地、不稳定、最坏 O(n²)。\"\n}\n]\n},\n{\n\"t\": \"第12章　记下子问题\",\n\"d\": \"动态规划基础与五部曲\",\n\"tags\": [\n\"动态规划基础\",\n\"DP 五部曲\"\n],\n\"card\": {\n\"p\": \"有些问题，大问题是由一堆小问题拼起来的，而且小问题会反复出现。每个小问题只算一次，把答案记下来，大问题就好办了。\",\n\"f\": \"动态规划适用于：重叠子问题、最优子结构（无后效性）。代码随想录的五部曲：确定 dp 数组及下标的含义；确定递推公式；dp 数组如何初始化；确定遍历顺序；举例推导并打印 dp 数组调试。两种实现：记忆化搜索（自顶向下）与递推（自底向上）。例：爬楼梯 dp[i] = dp[i-1] + dp[i-2]；不同路径 dp[i][j] = dp[i-1][j] + dp[i][j-1]；打家劫舍 dp[i] = max(dp[i-1], dp[i-2] + nums[i])。\",\n\"c\": \"与分治的区别：分治的子问题相互独立，动态规划的子问题有重叠。状态压缩：只依赖前面少数几个状态时可以用滚动变量，把空间降到 O(1)（如斐波那契）。调试技巧：先写暴力递归，再加记忆化，再改成递推。很多题的难点在于定义好 dp 数组的含义，而不是公式本身。\",\n\"a\": \"记忆化搜索和递推的区别？（前者按需计算，后者按顺序填表）什么时候能做空间压缩？（只依赖有限的前几个状态）\"\n},\n\"story\": [\n[\nnull,\n\"第十二关是一座算力迷宫：同一个房间，被好几条路反复经过。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“动态规划适用的问题有什么特征？”\",\n\"o\": [\n[\n\"重叠子问题和最优子结构。\",\n1,\n\"“五部曲是什么？”“dp 含义、递推公式、初始化、遍历顺序、打印调试。”\"\n],\n[\n\"只要用到递归就适合。\",\n0,\n\"“不一定有重叠子问题。”\"\n],\n[\n\"子问题相互独立、没有重叠。\",\n0,\n\"“那是分治。”\"\n]\n],\n\"n\": \"考点：DP 需要重叠子问题与最优子结构；五部曲。\"\n},\n{\n\"s\": \"考官：“爬楼梯（每次 1 或 2 阶）的递推公式和初始化？”\",\n\"o\": [\n[\n\"dp[i] = dp[i-1] + dp[i-2]，dp[1]=1，dp[2]=2。\",\n1,\n\"“空间能优化吗？”“可以，只保留前两个值。”\"\n],\n[\n\"dp[i] = dp[i-1] * dp[i-2]。\",\n0,\n\"“是加，不是乘。”\"\n],\n[\n\"dp[i] = dp[i-1] + 1。\",\n0,\n\"“忽略了一步走两阶的情况。”\"\n]\n],\n\"n\": \"考点：爬楼梯 dp[i]=dp[i-1]+dp[i-2]；可滚动变量优化空间。\"\n}\n]\n},\n{\n\"t\": \"第13章　只能带一次的行李\",\n\"d\": \"0-1 背包\",\n\"tags\": [\n\"0-1 背包\"\n],\n\"card\": {\n\"p\": \"背包容量有限，有几件物品，每件只有一个，各有重量和价值。怎么装，总价值最大？每件物品只有两种选择：装，或者不装。\",\n\"f\": \"问题：n 件物品，重量 w[i]、价值 v[i]，背包容量 W，每件至多选一次，求最大价值。二维写法：dp[i][j] 表示前 i 件物品、容量 j 时的最大价值，dp[i][j] = max(dp[i-1][j], dp[i-1][j-w[i]] + v[i])（j ≥ w[i]）。滚动成一维：dp[j] = max(dp[j], dp[j-w[i]] + v[i])。关键：先遍历物品，再倒序遍历容量。倒序的原因：保证 dp[j-w[i]] 还是上一轮（i-1）的值，每件物品只被用一次；若正序，dp[j-w[i]] 已被本轮更新，同一件物品会被重复选，变成完全背包。\",\n\"c\": \"为什么物品在外层：一维倒序时，若容量在外层，每个容量只会放进一件物品。初始化：求最大价值时 dp 全为 0；求恰好装满时 dp[0]=0，其余为负无穷。应用：分割等和子集（能否恰好装满 sum/2）、最后一块石头的重量 II、目标和（求方案数：dp[j] += dp[j-num]）、一和零（两个维度的容量）。时间 O(nW)，一维空间 O(W)。<pre>for i := 0; i &lt; n; i++ {          // 先遍历物品\\n    for j := W; j &gt;= w[i]; j-- {  // 再倒序遍历容量\\n        dp[j] = max(dp[j], dp[j-w[i]]+v[i])\\n    }\\n}<\/pre>\",\n\"a\": \"为什么 0-1 背包内层要倒序？（保证每件物品只用一次）二维转一维的依据是什么？（dp[i] 只依赖 dp[i-1]）\"\n},\n\"story\": [\n[\nnull,\n\"第十三关里，每件行李只有一件，要么带走，要么留下。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“一维 0-1 背包，内层遍历容量为什么要倒序？”\",\n\"o\": [\n[\n\"保证每件物品只被选一次，避免 dp[j-w] 已被本轮更新而重复使用。\",\n1,\n\"“正序会变成什么？”“完全背包，同一件物品可重复选。”\"\n],\n[\n\"倒序速度更快。\",\n0,\n\"“与速度无关。”\"\n],\n[\n\"正序会数组越界。\",\n0,\n\"“不是越界问题。”\"\n]\n],\n\"n\": \"考点：倒序保证 dp[j-w] 来自上一轮，物品只用一次；正序等价于完全背包。\"\n},\n{\n\"s\": \"考官：“一维 0-1 背包的循环顺序是什么？”\",\n\"o\": [\n[\n\"外层遍历物品，内层倒序遍历容量。\",\n1,\n\"“反过来行吗？”“一维下不行，每个容量只会放一件物品。”\"\n],\n[\n\"外层遍历容量，内层遍历物品。\",\n0,\n\"“这样每个容量只会放进一件物品，结果会错。”\"\n],\n[\n\"顺序无所谓。\",\n0,\n\"“0-1 背包对顺序有要求。”\"\n]\n],\n\"n\": \"考点：一维 0-1 背包：外层物品，内层容量倒序。\"\n}\n]\n},\n{\n\"t\": \"第14章　想拿几件拿几件\",\n\"d\": \"完全背包、组合与排列、多重背包\",\n\"tags\": [\n\"完全背包\",\n\"组合与排列的遍历顺序\",\n\"多重背包\"\n],\n\"card\": {\n\"p\": \"这次每种物品店里有无限多件，想拿几件拿几件。装的办法变多了，遍历的顺序也就有了讲究：算“有几种组合”和“有几种排列”，循环的内外层不一样。\",\n\"f\": \"完全背包：每种物品可选无限次，一维写法 dp[j] = max(dp[j], dp[j-w[i]] + v[i])，容量正序遍历（允许同一件物品被多次使用）。纯完全背包求最大价值时，物品与容量两层循环的先后都可以。零钱兑换（最少硬币数）：dp[j] = min(dp[j], dp[j-coin] + 1)，dp 初始化为无穷、dp[0]=0，顺序均可。\",\n\"c\": \"求组合数（零钱兑换 II，不同顺序视为同一种）：外层遍历物品，内层正序遍历容量，dp[j] += dp[j-coin]。求排列数（组合总和 IV、爬楼梯进阶，不同顺序视为不同）：外层遍历容量，内层遍历物品。原因：先固定物品顺序，每种物品只能按“先后”出现一次，得到组合；先遍历容量，每个容量都能放入任意物品，得到排列。多重背包：每种物品有 s 件，转化成 0-1 背包（展开成 s 件，或用二进制拆分优化）。<pre>// 完全背包：容量正序\\nfor i := 0; i &lt; n; i++ {\\n    for j := w[i]; j &lt;= W; j++ {\\n        dp[j] = max(dp[j], dp[j-w[i]]+v[i])\\n    }\\n}\\n// 组合数：先物品后容量；排列数：先容量后物品<\/pre>\",\n\"a\": \"0-1 与完全背包在代码上的唯一区别？（容量遍历方向）为什么求排列要把容量放外层？（每个容量下都可以放任意物品，顺序不同算不同）\"\n},\n\"story\": [\n[\nnull,\n\"第十四关里，货源无限，只是容量有限。阿算发现，装的先后顺序，也会改变答案的含义。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“0-1 背包与完全背包的一维写法，关键区别是什么？”\",\n\"o\": [\n[\n\"0-1 背包内层容量倒序，完全背包内层容量正序。\",\n1,\n\"“为什么完全背包是正序？”“允许同一件物品被重复选。”\"\n],\n[\n\"完全背包要倒序。\",\n0,\n\"“倒序会限制每件只能一次。”\"\n],\n[\n\"没有区别。\",\n0,\n\"“遍历方向不同。”\"\n]\n],\n\"n\": \"考点：0-1 背包倒序、完全背包正序。\"\n},\n{\n\"s\": \"考官：“零钱兑换 II（求凑成金额的组合数）的遍历顺序是？”\",\n\"o\": [\n[\n\"外层遍历硬币，内层正序遍历金额；若外层金额、内层硬币，得到的是排列数。\",\n1,\n\"“组合总和 IV 呢？”“求排列，外层遍历金额。”\"\n],\n[\n\"外层遍历金额，内层遍历硬币。\",\n0,\n\"“这样会把不同顺序当成不同方案，得到排列数。”\"\n],\n[\n\"两种顺序结果相同。\",\n0,\n\"“组合与排列的结果不同。”\"\n]\n],\n\"n\": \"考点：求组合数先物品后容量；求排列数先容量后物品。\"\n}\n]\n},\n{\n\"t\": \"第15章　子序列的学问\",\n\"d\": \"LIS、LCS、编辑距离、最大子数组和\",\n\"tags\": [\n\"最长递增子序列\",\n\"LCS 与编辑距离\",\n\"最大子数组和\"\n],\n\"card\": {\n\"p\": \"从一串东西里挑出若干个，保持原来的先后顺序，就是子序列；必须连在一起的，叫子数组（子串）。找最长的、最像的、改动最少的，都是这一类问题。\",\n\"f\": \"最长递增子序列（LIS）：dp[i] 表示以 nums[i] 结尾的最长递增子序列长度，dp[i] = max(dp[j]+1)（j < i 且 nums[j] < nums[i]），O(n²)；用贪心加二分维护 tails 数组可做到 O(n log n)。最长公共子序列（LCS）：dp[i][j] 表示 text1 前 i 个与 text2 前 j 个的 LCS 长度，字符相等则 dp[i-1][j-1]+1，否则 max(dp[i-1][j], dp[i][j-1])。\",\n\"c\": \"编辑距离：dp[i][j] 表示把 word1 前 i 个变成 word2 前 j 个的最少操作数；字符相等取 dp[i-1][j-1]；不相等取插入、删除、替换三种操作中的最小值再加 1，即 min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]) + 1。最大子数组和（Kadane）：dp[i] = max(nums[i], dp[i-1] + nums[i])。子序列与子数组的区别：子数组要求连续，子序列只要求相对顺序。\",\n\"a\": \"LIS 的 O(n log n) 怎么做？（tails 数组加二分替换）编辑距离的三种操作分别对应哪个状态？（插入、删除、替换）\"\n},\n\"story\": [\n[\nnull,\n\"第十五关要在两串货物里找最长的共同部分，还要算最少改动几次。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“LCS 的状态转移方程是什么？”\",\n\"o\": [\n[\n\"字符相等时 dp[i][j]=dp[i-1][j-1]+1；不相等时取 max(dp[i-1][j], dp[i][j-1])。\",\n1,\n\"“编辑距离呢？”“不相等时取三种操作的最小值加 1。”\"\n],\n[\n\"字符相等时取最小值。\",\n0,\n\"“相等时是加 1。”\"\n],\n[\n\"字符不相等时 dp 置为 0。\",\n0,\n\"“那是连续子串的写法。”\"\n]\n],\n\"n\": \"考点：LCS 相等 dp[i-1][j-1]+1，不相等取两边最大；子串则重置。\"\n},\n{\n\"s\": \"考官：“编辑距离中字符不相等时，如何转移？”\",\n\"o\": [\n[\n\"取插入、删除、替换三种操作代价的最小值再加 1。\",\n1,\n\"“三种分别对应哪个状态？”“删除 dp[i-1][j]，插入 dp[i][j-1]，替换 dp[i-1][j-1]。”\"\n],\n[\n\"直接加 1，不用比较。\",\n0,\n\"“需要在三种操作中取最小。”\"\n],\n[\n\"取三者的最大值。\",\n0,\n\"“求的是最少操作数。”\"\n]\n],\n\"n\": \"考点：编辑距离不相等时 min(删除, 插入, 替换)+1。\"\n}\n]\n},\n{\n\"t\": \"终章　总复习：算法王国大考\",\n\"d\": \"跨章混合题：把数据结构、排序与 DP 串起来\",\n\"tags\": [],\n\"card\": {\n\"p\": \"大考不会按章节出题。同一个问题常常要你先判断该用哪类结构或算法，再讲复杂度。\",\n\"f\": \"思路：先看数据特征（有序、范围、规模、是否要稳定、是否连续），再选结构（数组、链表、哈希、堆、树、图），最后讲复杂度与边界。\",\n\"c\": \"常见混淆对：数组与链表；哈希与平衡树；快排与归并；贪心与 DP；组合与排列的遍历顺序；子序列与子数组。\",\n\"a\": \"遇到新题，先问：能不能暴力？瓶颈在哪？有没有重叠子问题或单调性？\"\n},\n\"story\": [\n[\nnull,\n\"算法王国的大考到了。考官把前面所有的关卡摊在桌上。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“要对对象按多个字段排序，次要字段排好后再按主要字段排，应该选什么排序？”\",\n\"o\": [\n[\n\"稳定排序，如归并排序或 TimSort（Go 里用 sort.SliceStable）。\",\n1,\n\"“快排为什么不行？”“不稳定，会打乱相同主字段元素的次要顺序。”\"\n],\n[\n\"快速排序。\",\n0,\n\"“快排不稳定。”\"\n],\n[\n\"堆排序。\",\n0,\n\"“堆排序不稳定。”\"\n]\n],\n\"n\": \"考点：多字段排序需要稳定排序；快排、堆排、选择不稳定。\"\n},\n{\n\"s\": \"考官：“十亿个数找出最大的 100 个，内存装不下，怎么做？”\",\n\"o\": [\n[\n\"流式遍历，维护大小为 100 的小顶堆，O(n log 100)。\",\n1,\n\"“分布式怎么办？”“各节点先求局部 Top-K，再合并。”\"\n],\n[\n\"先全部排序再取前 100。\",\n0,\n\"“内存装不下，也没必要。”\"\n],\n[\n\"全部放进哈希表。\",\n0,\n\"“同样装不下。”\"\n]\n],\n\"n\": \"考点：海量数据 Top-K 用小顶堆流式处理，分布式则局部再合并。\"\n},\n{\n\"s\": \"考官：“零钱兑换 II 求组合数，与组合总和 IV 求排列数，代码上区别在哪？”\",\n\"o\": [\n[\n\"遍历顺序：组合数是外层物品内层容量，排列数是外层容量内层物品。\",\n1,\n\"“为什么？”“先固定物品顺序，只能按先后出现一次。”\"\n],\n[\n\"状态定义完全不同。\",\n0,\n\"“状态定义一样，区别在遍历顺序。”\"\n],\n[\n\"初始化不同。\",\n0,\n\"“初始化相同，dp[0]=1。”\"\n]\n],\n\"n\": \"考点：组合与排列的区别在遍历顺序。\"\n},\n{\n\"s\": \"考官：“链表有环，怎么找到环的入口？”\",\n\"o\": [\n[\n\"快慢指针相遇后，一个指针回到头，两者同速前进，再次相遇处就是入口。\",\n1,\n\"“为什么成立？”“相遇时路程关系保证了这一点。”\"\n],\n[\n\"遍历一遍，遇到 nil 的位置就是入口。\",\n0,\n\"“有环就不会遇到 nil。”\"\n],\n[\n\"用二分查找。\",\n0,\n\"“链表不支持随机访问。”\"\n]\n],\n\"n\": \"考点：快慢指针相遇后重置一个到头，同速前进再次相遇为环入口。\"\n},\n{\n\"s\": \"考官：“课程之间有先修关系，怎么判断能否学完？”\",\n\"o\": [\n[\n\"拓扑排序：处理的节点数小于总数说明有环，无法学完。\",\n1,\n\"“为什么不用并查集？”“它适合无向连通性。”\"\n],\n[\n\"用并查集判断。\",\n0,\n\"“先修关系是有向的。”\"\n],\n[\n\"用 Dijkstra。\",\n0,\n\"“那是最短路径。”\"\n]\n],\n\"n\": \"考点：依赖关系用拓扑排序，有环则无法完成。\"\n}\n]\n}\n]\n;\nconst $=id=>document.getElementById(id);\nlet done=[];try{done=JSON.parse(localStorage.getItem(\"ds-done\")||\"[]\")}catch(e){}\nfunction save(){try{localStorage.setItem(\"ds-done\",JSON.stringify(done))}catch(e){}}\nfunction show(id){document.querySelectorAll(\".screen\").forEach(s=>s.classList.toggle(\"on\",s.id===id))}\nlet ch=0,i=0,q=[],ok=0,wrong=[],fromGame=false;\nfunction menu(){\n  const got=C.filter((c,n)=>done.includes(n)).flatMap(c=>c.tags),all=C.flatMap(c=>c.tags).concat(PLAN);\n  $(\"cov\").innerHTML=`<div style=\"font:14px system-ui,sans-serif;color:var(--dim)\">知识点覆盖 ${got.length} / ${all.length}（本部规划中，后续章节陆续追加）<\/div><div class=\"bar\"><i style=\"width:${got.length/all.length*100}%\"><\/i><\/div>`;\n  $(\"chips\").innerHTML=all.map(t=>`<span class=\"${got.includes(t)?\"on\":\"\"}\">${t}<\/span>`).join(\"\");\n  $(\"list\").innerHTML=\"\";C.forEach((c,n)=>{const b=document.createElement(\"button\");b.className=\"ch\"+(done.includes(n)?\" done\":\"\");\n    b.innerHTML=`<b>${c.t}<\/b><span>${c.d}<\/span>`;b.onclick=()=>{ch=n;fromGame=false;card()};$(\"list\").appendChild(b)});\n  show(\"menu\");\n}\nfunction card(){\n  const c=C[ch],k=c.card;\n  $(\"cardbody\").innerHTML=`<h2>${c.t}<\/h2><div class=\"sub\">知识卡：${c.d}<\/div>\n   <details open><summary>${(k.L||[])[0]||'大白话'}<\/summary><p>${k.p}<\/p><\/details>\n   <details open><summary>${(k.L||[])[1]||'正经解释'}<\/summary><p>${k.f}<\/p><\/details>\n   <details open><summary>${(k.L||[])[2]||'对比与适用场景'}<\/summary><p>${k.c}<\/p><\/details>\n   <details open><summary>${(k.L||[])[3]||'面试官常见追问'}<\/summary><p>${k.a}<\/p><\/details>\n   <button class=\"go\" id=\"goOn\">${fromGame?\"回到剧情\":\"进入剧情\"}<\/button><button class=\"go alt\" id=\"cb\">返回目录<\/button>`;\n  $(\"goOn\").onclick=()=>fromGame?show(\"game\"):start();$(\"cb\").onclick=menu;show(\"card\");\n}\nfunction start(){\n  const c=C[ch];q=[];ok=0;wrong=[];i=0;\n  c.story.forEach(l=>q.push({k:\"l\",w:l[0],t:l[1]}));\n  c.qs.forEach(x=>{q.push({k:\"l\",w:\"考官\",t:x.s});q.push({k:\"c\",x})});q.push({k:\"end\"});\n  $(\"title\").textContent=c.t;$(\"title\").style.animation=\"none\";void $(\"title\").offsetWidth;$(\"title\").style.animation=\"\";\n  $(\"choices\").innerHTML=\"\";$(\"sc\").textContent=\"答对 0 / \"+c.qs.length;fromGame=true;show(\"game\");line(null,\"点击对话框开始。\");\n}\nfunction line(w,t,note){$(\"who\").textContent=w||\"\";$(\"who\").className=w===\"考官\"?\"int\":w===\"我\"?\"me\":\"\";$(\"txt\").textContent=t;$(\"txt\").className=note?\"note\":\"\"}\nfunction next(){\n  if($(\"choices\").children.length)return;const n=q[i++];if(!n)return;\n  if(n.k===\"l\")line(n.w,n.t,n.note);else if(n.k===\"c\")ask(n.x);else finish();\n}\nfunction ask(x){\n  line(\"考官\",x.s);const c=$(\"choices\");c.innerHTML=\"\";\n  x.o.forEach(o=>{const b=document.createElement(\"button\");b.className=\"opt\";b.textContent=o[0];\n    b.onclick=()=>{c.innerHTML=\"\";if(o[1])ok++;else wrong.push(x.n);\n      $(\"sc\").textContent=\"答对 \"+ok+\" / \"+C[ch].qs.length;\n      q.splice(i,0,{k:\"l\",w:\"我\",t:o[0]},{k:\"l\",w:\"考官\",t:o[2]},{k:\"l\",w:null,t:(o[1]?\"答对了。\":\"答错了。\")+\"\\n\"+x.n,note:1});next()};\n    c.appendChild(b)});\n}\nfunction finish(){\n  const c=C[ch],pass=ok===c.qs.length;if(pass&&!done.includes(ch)){done.push(ch);save()}\n  $(\"endbody\").innerHTML=`<h2 style=\"margin:0 0 4px\">${pass?\"本章通关\":\"差一点，再看一遍知识卡\"}<\/h2>\n   <div style=\"color:var(--dim)\">答对 ${ok} / ${c.qs.length}<\/div>\n   ${wrong.length?\"<p>需要巩固：<\/p><ul>\"+wrong.map(w=>`<li>${w}<\/li>`).join(\"\")+\"<\/ul>\":\"<p>本章全部答对。<\/p>\"}\n   <button class=\"go\" id=\"r1\">重玩本章<\/button>${pass&&ch<C.length-1?'<button class=\"go\" id=\"r2\">下一章<\/button>':\"\"}\n   <button class=\"go alt\" id=\"r3\">回目录<\/button>`;\n  $(\"r1\").onclick=start;$(\"r3\").onclick=menu;if($(\"r2\"))$(\"r2\").onclick=()=>{ch++;fromGame=false;card()};show(\"end\");\n}\n$(\"box\").onclick=next;$(\"back\").onclick=menu;$(\"kc\").onclick=card;\ndocument.addEventListener(\"keydown\",e=>{if((e.key===\" \"||e.key===\"Enter\")&&document.activeElement.tagName!==\"BUTTON\"&&$(\"game\").classList.contains(\"on\")){e.preventDefault();next()}});\nmenu();\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "ch08", "num": "08", "title": "地鼠实训场 · Go 业务代码题", "name": "地鼠实训场", "sub": "Go 业务代码题。每题先看业务场景与解题思路、参考代码，再看剧情，最后过追问关。代码题的重点是说出每种写法的坑在哪里。", "colors": {"bg": "#12151f", "bg2": "#25304d", "gold": "#ffd166"}, "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>地鼠实训场 · Go 业务代码题<\/title>\n<style>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);\n--bg:#12151f;--bg2:#25304d;--ink:#ece6d2;--dim:#9b9884;--gold:#ffd166;--red:#d8664b;--ok:#7fc096;--box:rgba(10,13,22,.9);--line:rgba(236,230,210,.2)}\n:root[data-theme=\"dark\"]{--bg:#12151f}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#12151f}}\n*,*::before,*::after{box-sizing:inherit}\nhtml{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.8 \"Songti SC\",\"Noto Serif SC\",\"Source Han Serif SC\",serif;overflow:hidden}\n#app{height:100%;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 0%,var(--bg2),var(--bg))}\nbutton{font:inherit;color:inherit;cursor:pointer}\nbutton:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}\n.screen{display:none;flex:1;min-height:0;flex-direction:column}.screen.on{display:flex}\n.wrap{width:100%;max-width:680px;margin:0 auto;padding:6vh 20px 24px;overflow-y:auto}\nh1{font-size:clamp(32px,9vw,48px);line-height:1.15;margin:0 0 6px;letter-spacing:.06em;font-weight:900}\n.sub{color:var(--dim);font-size:15px;margin:0 0 18px}\n.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 10px}\n.bar i{display:block;height:100%;background:var(--gold)}\n.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px;font:12px/1 system-ui,sans-serif}\n.chips span{padding:5px 8px;border:1px dashed var(--line);border-radius:12px;color:var(--dim)}\n.chips span.on{border:1px solid var(--gold);color:var(--gold)}\n.ch{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:6px;padding:13px 16px;margin-bottom:12px}\n.ch:hover{border-color:var(--gold)}.ch b{display:block;font-size:18px}.ch span{color:var(--dim);font-size:14px}\n.ch.done b::after{content:\" 已通关\";color:var(--ok);font-size:13px;font-weight:400}\n/* card */\n#card h2{font-size:24px;margin:0 0 4px}\ndetails{border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:rgba(255,255,255,.03)}\nsummary{cursor:pointer;font:700 14px/1.6 system-ui,sans-serif;color:var(--gold)}\ndetails p{margin:8px 0 2px;font-size:16px}\n.go{background:var(--gold);color:#2a2006;border:0;border-radius:6px;padding:11px 20px;font-weight:700;margin:10px 10px 0 0}\n.go.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}\n/* game */\n#hud{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;font:14px/1 system-ui,sans-serif;color:var(--dim)}\n#hud button{background:none;border:0;color:var(--dim);padding:6px 0}\n#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 24px;text-align:center}\n#title{font-size:clamp(24px,6.5vw,36px);font-weight:900;line-height:1.3;letter-spacing:.05em;animation:rise 1s both}\n@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}\n@media (prefers-reduced-motion:reduce){#title{animation:none}}\n#choices{padding:0 16px 8px;display:flex;flex-direction:column;gap:10px;max-width:680px;width:100%;margin:0 auto}\n.opt{background:var(--box);border:1px solid var(--gold);border-radius:6px;padding:12px 14px;text-align:left;line-height:1.6}\n.opt:hover{background:rgba(255,209,102,.14)}\n#box{margin:8px 12px 14px;max-width:680px;width:calc(100% - 24px);align-self:center;min-height:132px;background:var(--box);border:1px solid var(--line);border-radius:8px;padding:14px 18px 20px;text-align:left;cursor:pointer;position:relative}\n#who{font:700 14px/1 system-ui,sans-serif;color:var(--gold);margin-bottom:8px;min-height:14px}\n#who.int{color:var(--red)}#who.me{color:var(--ok)}\n#txt{font-size:17px;white-space:pre-wrap}#txt.note{color:var(--gold)}\n#tap{position:absolute;right:14px;bottom:6px;color:var(--dim);font:12px system-ui,sans-serif}\n#end ul{padding-left:20px}#end li{margin-bottom:10px}\npre{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;margin:8px 0;white-space:pre}<\/style>\n<\/head>\n<body>\n<div id=\"app\">\n <div id=\"menu\" class=\"screen on\"><div class=\"wrap\">\n  <h1>地鼠实训场<\/h1>\n  <p class=\"sub\">Go 业务代码题。每题先看业务场景与解题思路、参考代码，再看剧情，最后过追问关。代码题的重点是说出每种写法的坑在哪里。<\/p>\n  <div id=\"cov\"><\/div><div id=\"chips\" class=\"chips\"><\/div><div id=\"list\"><\/div>\n <\/div><\/div>\n <div id=\"card\" class=\"screen\"><div class=\"wrap\" id=\"cardbody\"><\/div><\/div>\n <div id=\"game\" class=\"screen\">\n  <div id=\"hud\"><button id=\"back\">返回<\/button><button id=\"kc\">看知识卡<\/button><span id=\"sc\"><\/span><\/div>\n  <div id=\"stage\"><div id=\"title\"><\/div><\/div>\n  <div id=\"choices\"><\/div>\n  <div id=\"box\"><div id=\"who\"><\/div><div id=\"txt\"><\/div><span id=\"tap\">点击继续<\/span><\/div>\n <\/div>\n <div id=\"end\" class=\"screen\"><div class=\"wrap\" id=\"endbody\"><\/div><\/div>\n<\/div>\n<script>\nconst PLAN=[];\nconst C=[\n{\n\"t\": \"第1题　交替打印\",\n\"d\": \"两个 goroutine 交替打印奇偶数（channel 同步）\",\n\"tags\": [\n\"交替打印\"\n],\n\"card\": {\n\"p\": \"要求两个 goroutine 交替输出：一个打印奇数，一个打印偶数，按 1、2、3……10 的顺序输出。\",\n\"f\": \"思路：用两个无缓冲 channel 做“接力棒”。奇数 goroutine 等到 oddCh 的信号才打印，打印完给 evenCh 发信号；偶数 goroutine 反过来。无缓冲 channel 的收发是同步的，所以顺序严格交替。注意收尾：最后一个偶数打印完不要再给奇数方发信号（对方已经退出，会永久阻塞），而是通知 main 结束。\",\n\"c\": \"\\n<pre>func main() {\\n\\toddCh, evenCh := make(chan struct{}), make(chan struct{})\\n\\tdone := make(chan struct{})\\n\\tgo func() {\\n\\t\\tfor i := 1; i &lt;= 10; i += 2 {\\n\\t\\t\\t&lt;-oddCh\\n\\t\\t\\tfmt.Println(i)\\n\\t\\t\\tevenCh &lt;- struct{}{}\\n\\t\\t}\\n\\t}()\\n\\tgo func() {\\n\\t\\tfor i := 2; i &lt;= 10; i += 2 {\\n\\t\\t\\t&lt;-evenCh\\n\\t\\t\\tfmt.Println(i)\\n\\t\\t\\tif i &lt; 10 {\\n\\t\\t\\t\\toddCh &lt;- struct{}{}\\n\\t\\t\\t} else {\\n\\t\\t\\t\\tclose(done)\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}()\\n\\toddCh &lt;- struct{}{} // 启动接力\\n\\t&lt;-done\\n}<\/pre>\",\n\"a\": \"还有别的实现吗？（sync.Cond、一个 channel 加共享变量、有缓冲 channel 加 WaitGroup）三个 goroutine 轮流打印怎么扩展？（用环形的 channel 链）\",\n\"L\": [\n\"业务场景\",\n\"解题思路\",\n\"参考代码\",\n\"面试官常见追问\"\n]\n},\n\"story\": [\n[\nnull,\n\"实训场的第一道题：两位工人要轮流报数，一个报单数，一个报双数。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“为什么用两个无缓冲 channel 能保证严格交替？”\",\n\"o\": [\n[\n\"无缓冲 channel 的收发是同步的，每个 goroutine 必须等到对方的信号才能打印。\",\n1,\n\"“用有缓冲的会怎样？”“信号可能提前堆积，需要额外控制。”\"\n],\n[\n\"因为 goroutine 总是按启动顺序执行。\",\n0,\n\"“调度顺序不能保证。”\"\n],\n[\n\"因为 Println 是原子的，所以顺序固定。\",\n0,\n\"“原子不等于有序。”\"\n]\n],\n\"n\": \"考点：无缓冲 channel 的同步语义让两个 goroutine 严格接力。\"\n},\n{\n\"s\": \"考官：“如果最后一次不判断 i < 10，偶数 goroutine 打印完 10 之后仍然向 oddCh 发送，会怎样？”\",\n\"o\": [\n[\n\"奇数 goroutine 已经退出，发送没有接收方，会永久阻塞，造成 goroutine 泄漏或死锁。\",\n1,\n\"“怎么收尾？”“用 done 通知 main 结束。”\"\n],\n[\n\"没有影响，数据会被丢弃。\",\n0,\n\"“无缓冲 channel 不会丢弃，会阻塞。”\"\n],\n[\n\"程序会自动 panic 并提示。\",\n0,\n\"“不会 panic，只会阻塞。”\"\n]\n],\n\"n\": \"考点：收尾阶段避免向没有接收方的无缓冲 channel 发送。\"\n}\n]\n},\n{\n\"t\": \"第2题　并发任务池\",\n\"d\": \"Worker Pool：固定数量的 worker 处理一批任务\",\n\"tags\": [\n\"Worker Pool\"\n],\n\"card\": {\n\"p\": \"有一批任务，要用固定的 N 个 goroutine 并发处理，并收集结果，不能无限创建 goroutine。\",\n\"f\": \"思路：任务 channel 加 N 个 worker。worker 用 for range 从任务 channel 取任务，处理后把结果送入结果 channel。关闭规则：任务由发送方（分发 goroutine）在发完后关闭；结果 channel 有多个发送者（所有 worker），所以必须等 WaitGroup 全部完成后，由一个专门的 goroutine 关闭，而不是由每个 worker 自己关。若需要保持输入顺序，让任务带上下标，结果写入预分配的切片对应位置。\",\n\"c\": \"<pre>func process(jobs []int, n int) []int {\\n\\tjobCh := make(chan int)\\n\\tresCh := make(chan int)\\n\\tvar wg sync.WaitGroup\\n\\tfor i := 0; i &lt; n; i++ {\\n\\t\\twg.Add(1)\\n\\t\\tgo func() {\\n\\t\\t\\tdefer wg.Done()\\n\\t\\t\\tfor j := range jobCh {\\n\\t\\t\\t\\tresCh &lt;- j * j\\n\\t\\t\\t}\\n\\t\\t}()\\n\\t}\\n\\tgo func() {\\n\\t\\tfor _, j := range jobs {\\n\\t\\t\\tjobCh &lt;- j\\n\\t\\t}\\n\\t\\tclose(jobCh)\\n\\t}()\\n\\tgo func() {\\n\\t\\twg.Wait()\\n\\t\\tclose(resCh)\\n\\t}()\\n\\tvar out []int\\n\\tfor r := range resCh {\\n\\t\\tout = append(out, r)\\n\\t}\\n\\treturn out\\n}<\/pre>\",\n\"a\": \"worker 数量怎么定？（CPU 密集看核数，IO 密集可以更多，再压测）任务出错和取消怎么处理？（errgroup 加 context）\",\n\"L\": [\n\"业务场景\",\n\"解题思路\",\n\"参考代码\",\n\"面试官常见追问\"\n]\n},\n\"story\": [\n[\nnull,\n\"第二道题：一大堆订单，要用固定数量的工人并发处理，工人不能无限增加。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“jobCh 和 resCh 应该由谁关闭？”\",\n\"o\": [\n[\n\"发送方关闭：分发 goroutine 关 jobCh；等所有 worker 结束后，由专门的 goroutine 关 resCh。\",\n1,\n\"“为什么 worker 不能自己关 resCh？”“多个发送者，会重复关闭 panic。”\"\n],\n[\n\"每个 worker 结束时各自关闭 resCh。\",\n0,\n\"“重复关闭会 panic。”\"\n],\n[\n\"main 在读取前直接关闭 resCh。\",\n0,\n\"“worker 还在发送会 panic。”\"\n]\n],\n\"n\": \"考点：channel 由发送方关闭；多个发送者需等 WaitGroup 后统一关闭。\"\n},\n{\n\"s\": \"考官：“这个实现返回的结果顺序与输入顺序一致吗？”\",\n\"o\": [\n[\n\"不保证，worker 完成顺序不确定；需要顺序就让任务带下标，把结果写入预分配切片对应位置。\",\n1,\n\"“写切片需要加锁吗？”“不同下标，不会冲突，不需要锁。”\"\n],\n[\n\"一致，因为 channel 是 FIFO 的。\",\n0,\n\"“多个 worker 并发处理，完成顺序不确定。”\"\n],\n[\n\"worker 越多越有序。\",\n0,\n\"“恰好相反。”\"\n]\n],\n\"n\": \"考点：并发处理结果顺序不保证；按下标写入可保持顺序。\"\n}\n]\n},\n{\n\"t\": \"第3题　并发安全的 LRU 缓存\",\n\"d\": \"哈希表加双向链表，加锁\",\n\"tags\": [\n\"LRU 缓存\"\n],\n\"card\": {\n\"p\": \"实现一个固定容量的 LRU 缓存，支持 Get 和 Put，要求时间复杂度 O(1)，并且并发安全。\",\n\"f\": \"思路：map 存 key 到链表节点，双向链表按访问时间排序（头部最新，尾部最旧），map 保证 O(1) 查找，链表保证 O(1) 移动与删除。Get 命中要把节点移到头部，Put 已存在则更新并移到头部，不存在则插入头部，超过容量就淘汰尾部节点，并且要同时从 map 中删除（所以节点里要保存 key）。并发安全：Get 会修改链表，属于写操作，要用互斥锁，不能用读锁。\",\n\"c\": \"<pre>type entry struct {\\n\\tkey string\\n\\tval int\\n}\\n\\ntype LRU struct {\\n\\tmu  sync.Mutex\\n\\tcap int\\n\\tll  *list.List\\n\\tm   map[string]*list.Element\\n}\\n\\nfunc NewLRU(cap int) *LRU {\\n\\treturn &amp;LRU{cap: cap, ll: list.New(), m: make(map[string]*list.Element)}\\n}\\n\\nfunc (c *LRU) Get(k string) (int, bool) {\\n\\tc.mu.Lock()\\n\\tdefer c.mu.Unlock()\\n\\tif e, ok := c.m[k]; ok {\\n\\t\\tc.ll.MoveToFront(e)\\n\\t\\treturn e.Value.(*entry).val, true\\n\\t}\\n\\treturn 0, false\\n}\\n\\nfunc (c *LRU) Put(k string, v int) {\\n\\tc.mu.Lock()\\n\\tdefer c.mu.Unlock()\\n\\tif e, ok := c.m[k]; ok {\\n\\t\\te.Value.(*entry).val = v\\n\\t\\tc.ll.MoveToFront(e)\\n\\t\\treturn\\n\\t}\\n\\tc.m[k] = c.ll.PushFront(&amp;entry{k, v})\\n\\tif c.ll.Len() &gt; c.cap {\\n\\t\\tlast := c.ll.Back()\\n\\t\\tc.ll.Remove(last)\\n\\t\\tdelete(c.m, last.Value.(*entry).key)\\n\\t}\\n}<\/pre>\",\n\"a\": \"怎么加过期时间？（节点里存过期时间，Get 时惰性检查，加定时清理）并发性能怎么提升？（分片，多个 LRU 各自加锁）\",\n\"L\": [\n\"业务场景\",\n\"解题思路\",\n\"参考代码\",\n\"面试官常见追问\"\n]\n},\n\"story\": [\n[\nnull,\n\"第三道题：工坊的缓存架子只有固定个位子，最久没人碰的要先腾出来。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“Get 里为什么不能用读锁（RLock）？”\",\n\"o\": [\n[\n\"Get 命中后要把节点移到链表头部，会修改链表，属于写操作。\",\n1,\n\"“怎么提升并发？”“分片，多个 LRU 各自加锁。”\"\n],\n[\n\"RLock 性能比 Lock 差。\",\n0,\n\"“读锁在读多时性能更好，但这里不能用。”\"\n],\n[\n\"Get 只读，不需要加锁。\",\n0,\n\"“它会修改链表，需要锁。”\"\n]\n],\n\"n\": \"考点：LRU 的 Get 会调整链表顺序，是写操作，需互斥锁。\"\n},\n{\n\"s\": \"考官：“为什么链表节点里要保存 key？”\",\n\"o\": [\n[\n\"淘汰尾部节点时，需要用 key 从 map 中删除对应的项。\",\n1,\n\"“用什么结构？”“map 加双向链表，操作都是 O(1)。”\"\n],\n[\n\"为了对链表排序。\",\n0,\n\"“链表按访问顺序维护，不靠 key 排序。”\"\n],\n[\n\"链表遍历必须要有 key。\",\n0,\n\"“与遍历无关。”\"\n]\n],\n\"n\": \"考点：淘汰节点时要用 key 清理 map，所以节点里保存 key。\"\n}\n]\n},\n{\n\"t\": \"第4题　令牌桶限流\",\n\"d\": \"单机令牌桶，并发安全\",\n\"tags\": [\n\"令牌桶限流\"\n],\n\"card\": {\n\"p\": \"接口要限流：每秒最多放行 rate 个请求，允许一定的突发（桶容量 cap），要求并发安全。\",\n\"f\": \"思路：不要起 goroutine 定时往桶里放令牌，而是“惰性补充”：每次请求到来时，按距离上次的时间差计算应补充的令牌数，上限为容量，再判断令牌是否够一个。这样没有后台 goroutine 和定时器开销，也不会泄漏。用互斥锁保证并发安全（也可用 atomic 实现更复杂的无锁版本）。生产中可直接用 golang.org/x/time/rate。多实例部署时，单机限流各算各的，需要用 Redis 加 Lua 做分布式限流或在网关统一限流。\",\n\"c\": \"<pre>type Limiter struct {\\n\\tmu     sync.Mutex\\n\\trate   float64 // 每秒生成的令牌数\\n\\tcap    float64 // 桶容量\\n\\ttokens float64\\n\\tlast   time.Time\\n}\\n\\nfunc NewLimiter(rate, cap float64) *Limiter {\\n\\treturn &amp;Limiter{rate: rate, cap: cap, tokens: cap, last: time.Now()}\\n}\\n\\nfunc (l *Limiter) Allow() bool {\\n\\tl.mu.Lock()\\n\\tdefer l.mu.Unlock()\\n\\tnow := time.Now()\\n\\tl.tokens = math.Min(l.cap, l.tokens+now.Sub(l.last).Seconds()*l.rate)\\n\\tl.last = now\\n\\tif l.tokens &gt;= 1 {\\n\\t\\tl.tokens--\\n\\t\\treturn true\\n\\t}\\n\\treturn false\\n}<\/pre>\",\n\"a\": \"令牌桶和漏桶的区别？（令牌桶允许突发，漏桶匀速）固定窗口、滑动窗口、令牌桶怎么选？（要平滑选令牌桶或滑动窗口，要简单选固定窗口）\",\n\"L\": [\n\"业务场景\",\n\"解题思路\",\n\"参考代码\",\n\"面试官常见追问\"\n]\n},\n\"story\": [\n[\nnull,\n\"第四道题：城门口要限制进城的人数，既不能一下放太多，也要允许一小波人同时进来。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“为什么用‘惰性补充’，而不是起一个 goroutine 定时往桶里放令牌？”\",\n\"o\": [\n[\n\"按时间差计算补充，不需要后台 goroutine 和定时器，没有泄漏风险，也更精确。\",\n1,\n\"“并发安全怎么做？”“互斥锁保护 tokens 与 last。”\"\n],\n[\n\"因为 Ticker 无法使用。\",\n0,\n\"“Ticker 可以用，只是没必要。”\"\n],\n[\n\"因为 map 不支持定时更新。\",\n0,\n\"“与 map 无关。”\"\n]\n],\n\"n\": \"考点：令牌桶惰性补充，无需后台 goroutine。\"\n},\n{\n\"s\": \"考官：“这个限流器部署到多个服务实例后，限流不准，原因和办法？”\",\n\"o\": [\n[\n\"每个实例各算各的，总放行量会被放大；可用 Redis 加 Lua 做分布式限流，或在网关统一限流。\",\n1,\n\"“Lua 的作用？”“保证多步操作原子。”\"\n],\n[\n\"time.Now 不准。\",\n0,\n\"“不是时间精度问题。”\"\n],\n[\n\"Mutex 让限流失效。\",\n0,\n\"“锁只保证本进程内的并发安全。”\"\n]\n],\n\"n\": \"考点：本地限流只对单实例有效；分布式限流用 Redis 加 Lua 或网关。\"\n}\n]\n},\n{\n\"t\": \"第5题　超时控制与 goroutine 泄漏\",\n\"d\": \"给慢调用加超时，避免泄漏\",\n\"tags\": [\n\"超时控制与泄漏\"\n],\n\"card\": {\n\"p\": \"调用一个可能很慢的下游服务，要求最多等 2 秒，超时就返回错误，并且不能留下泄漏的 goroutine。\",\n\"f\": \"思路：用 context.WithTimeout 派生带超时的 ctx，在 goroutine 里调用下游并把结果送到 channel，主流程用 select 同时等结果和 ctx.Done()。关键坑：如果结果 channel 是无缓冲的，超时返回后，goroutine 完成时的发送永远没人接收，会永久阻塞造成泄漏；所以结果 channel 要带 1 个缓冲。更好的做法是让下游调用本身接收 ctx，并在取消时提前返回，真正终止下游工作。Go 不会回收仍在阻塞的 goroutine。\",\n\"c\": \"<pre>func fetch(ctx context.Context) (string, error) {\\n\\tctx, cancel := context.WithTimeout(ctx, 2*time.Second)\\n\\tdefer cancel()\\n\\n\\tch := make(chan string, 1) // 带 1 个缓冲，避免超时后发送阻塞\\n\\tgo func() {\\n\\t\\tch &lt;- slowCall()\\n\\t}()\\n\\n\\tselect {\\n\\tcase r := &lt;-ch:\\n\\t\\treturn r, nil\\n\\tcase &lt;-ctx.Done():\\n\\t\\treturn &quot;&quot;, ctx.Err()\\n\\t}\\n}<\/pre>\",\n\"a\": \"slowCall 本身不支持取消怎么办？（至少保证不泄漏，同时推动下游改成支持 ctx）time.After 在循环里有什么问题？（旧版本会累积定时器，Go 1.23 起已改善，仍建议用 NewTimer 复用）\",\n\"L\": [\n\"业务场景\",\n\"解题思路\",\n\"参考代码\",\n\"面试官常见追问\"\n]\n},\n\"story\": [\n[\nnull,\n\"第五道题：下游服务有时慢得出奇，工坊最多等 2 秒，不能让那位等得不耐烦的工人一直站在门口。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“结果 channel 为什么要带 1 个缓冲？”\",\n\"o\": [\n[\n\"超时返回后 goroutine 才完成时，无缓冲的发送会永久阻塞造成泄漏；缓冲 1 让它发送完正常退出。\",\n1,\n\"“还有更根本的做法吗？”“让下游调用支持 ctx，取消时提前返回。”\"\n],\n[\n\"为了提高吞吐。\",\n0,\n\"“与吞吐无关。”\"\n],\n[\n\"防止 select 阻塞。\",\n0,\n\"“select 本身有 ctx.Done() 分支。”\"\n]\n],\n\"n\": \"考点：无缓冲 channel 在超时后会让发送方永久阻塞，缓冲 1 可避免泄漏。\"\n},\n{\n\"s\": \"考官：“超时之后，那个还在跑的 goroutine 会被 Go 自动回收吗？”\",\n\"o\": [\n[\n\"不会，只要它还在运行或阻塞就不会被回收，需要自己保证它能退出。\",\n1,\n\"“怎么发现泄漏？”“pprof 看 goroutine 数量与堆栈。”\"\n],\n[\n\"会，GC 会回收。\",\n0,\n\"“GC 不回收运行或阻塞中的 goroutine。”\"\n],\n[\n\"会，超时后 runtime 会强制终止它。\",\n0,\n\"“Go 没有强制终止 goroutine 的机制。”\"\n]\n],\n\"n\": \"考点：goroutine 不会被 GC 或超时自动终止，要设计退出条件。\"\n}\n]\n},\n{\n\"t\": \"第6题　防止缓存击穿\",\n\"d\": \"singleflight 合并并发请求\",\n\"tags\": [\n\"singleflight\"\n],\n\"card\": {\n\"p\": \"热点数据缓存过期的瞬间，大量并发请求同时查数据库。要求同一个 key 的并发请求只真正查询一次，其余请求等待并共享结果。\",\n\"f\": \"思路：用 golang.org/x/sync/singleflight。Do(key, fn) 会让同一个 key 的并发调用只执行一次 fn，其他调用阻塞等待并拿到同样的结果。流程：先查缓存，未命中则通过 singleflight 查数据库并回填缓存。它只在单进程内合并；多实例下每个实例仍会各查一次，可以配合分布式锁或本地缓存。注意：如果 fn 出错，所有等待者都会收到同一个错误。\",\n\"c\": \"<pre>var g singleflight.Group\\n\\nfunc GetUser(id string) (*User, error) {\\n\\tif u, ok := cache.Get(id); ok {\\n\\t\\treturn u, nil\\n\\t}\\n\\tv, err, _ := g.Do(&quot;user:&quot;+id, func() (any, error) {\\n\\t\\tu, err := db.Query(id)\\n\\t\\tif err == nil {\\n\\t\\t\\tcache.Set(id, u)\\n\\t\\t}\\n\\t\\treturn u, err\\n\\t})\\n\\tif err != nil {\\n\\t\\treturn nil, err\\n\\t}\\n\\treturn v.(*User), nil\\n}<\/pre>\",\n\"a\": \"singleflight 与互斥锁方案有什么区别？（不需要手写锁和重试逻辑，等待者直接共享结果）它能解决缓存穿透吗？（不能，需要布隆过滤器或缓存空值）\",\n\"L\": [\n\"业务场景\",\n\"解题思路\",\n\"参考代码\",\n\"面试官常见追问\"\n]\n},\n\"story\": [\n[\nnull,\n\"第六道题：爆款货物过期的瞬间，几百个人同时涌向仓库。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“singleflight 的作用是什么？”\",\n\"o\": [\n[\n\"把同一个 key 的并发调用合并成一次实际执行，其余调用等待并共享结果，防止缓存击穿。\",\n1,\n\"“局限呢？”“只在单进程内合并。”\"\n],\n[\n\"把全局并发限制为 1。\",\n0,\n\"“它只对同一个 key 合并。”\"\n],\n[\n\"给请求加分布式锁。\",\n0,\n\"“它是进程内的机制。”\"\n]\n],\n\"n\": \"考点：singleflight 合并同一 key 的并发调用，只执行一次。\"\n},\n{\n\"s\": \"考官：“singleflight 有什么局限？”\",\n\"o\": [\n[\n\"只在单进程内合并；多实例仍会各查一次；若执行出错，所有等待者都会收到同一个错误。\",\n1,\n\"“怎么补强？”“配合分布式锁或本地缓存。”\"\n],\n[\n\"会导致数据库死锁。\",\n0,\n\"“与死锁无关。”\"\n],\n[\n\"不能用于并发场景。\",\n0,\n\"“它正是为并发场景设计的。”\"\n]\n],\n\"n\": \"考点：singleflight 仅进程内有效，错误会被共享。\"\n}\n]\n},\n{\n\"t\": \"第7题　并发聚合多个下游\",\n\"d\": \"errgroup 加限并发，保持顺序\",\n\"tags\": [\n\"errgroup 聚合\"\n],\n\"card\": {\n\"p\": \"一个接口要并发调用多个下游服务获取数据并聚合，任何一个失败就整体失败，并限制同时调用的数量，结果要与输入顺序一致。\",\n\"f\": \"思路：用 errgroup.WithContext 得到带取消的 ctx，g.SetLimit 限制并发。每个任务按下标把结果写入预分配的切片，不同下标之间没有数据竞争，所以不需要加锁，也能保持输入顺序。任一任务返回错误时 ctx 被取消，其他任务要检查 ctx 并尽早退出，g.Wait 返回第一个错误。注意 Go 1.22 之前要显式拷贝循环变量。\",\n\"c\": \"<pre>func Aggregate(ctx context.Context, ids []int) ([]Item, error) {\\n\\titems := make([]Item, len(ids))\\n\\tg, ctx := errgroup.WithContext(ctx)\\n\\tg.SetLimit(8)\\n\\tfor i, id := range ids {\\n\\t\\ti, id := i, id // Go 1.22 之前需要拷贝\\n\\t\\tg.Go(func() error {\\n\\t\\t\\tit, err := fetchItem(ctx, id)\\n\\t\\t\\tif err != nil {\\n\\t\\t\\t\\treturn err\\n\\t\\t\\t}\\n\\t\\t\\titems[i] = it // 按下标写入，无需加锁，保持顺序\\n\\t\\t\\treturn nil\\n\\t\\t})\\n\\t}\\n\\tif err := g.Wait(); err != nil {\\n\\t\\treturn nil, err\\n\\t}\\n\\treturn items, nil\\n}<\/pre>\",\n\"a\": \"部分失败可以容忍怎么办？（不返回错误，在结果里记录每项的错误）所有错误都想收集怎么办？（用 errors.Join 手动收集）\",\n\"L\": [\n\"业务场景\",\n\"解题思路\",\n\"参考代码\",\n\"面试官常见追问\"\n]\n},\n\"story\": [\n[\nnull,\n\"第七道题：一张订单要同时问好几个部门，任何一个说“不行”就整单作废。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“为什么 items[i] = it 不需要加锁？”\",\n\"o\": [\n[\n\"每个 goroutine 写不同的下标，不同内存位置之间没有数据竞争，且顺序与输入一致。\",\n1,\n\"“如果多个 goroutine 往同一个 slice 里 append 呢？”“有竞争，需要加锁。”\"\n],\n[\n\"因为 slice 本身是线程安全的。\",\n0,\n\"“slice 不是并发安全的。”\"\n],\n[\n\"因为 Go 保证所有赋值都是原子的。\",\n0,\n\"“Go 没有这种保证。”\"\n]\n],\n\"n\": \"考点：写不同下标无竞争；append 到同一个 slice 则有竞争。\"\n},\n{\n\"s\": \"考官：“某个任务失败时，errgroup 会怎样？”\",\n\"o\": [\n[\n\"ctx 被取消，其他任务应检查 ctx 提前退出，Wait 返回第一个错误。\",\n1,\n\"“能强制终止其他任务吗？”“不能，要靠它们自己检查 ctx。”\"\n],\n[\n\"其他任务会被强制终止。\",\n0,\n\"“Go 没有强制终止 goroutine 的机制。”\"\n],\n[\n\"所有错误都会被返回。\",\n0,\n\"“只返回第一个错误。”\"\n]\n],\n\"n\": \"考点：errgroup 失败时取消 ctx、返回首个错误，任务需主动响应取消。\"\n}\n]\n},\n{\n\"t\": \"第8题　优雅关闭服务\",\n\"d\": \"HTTP 服务收到信号后平滑退出\",\n\"tags\": [\n\"优雅关闭\"\n],\n\"card\": {\n\"p\": \"服务收到 SIGTERM（如发版、容器停止）时，不能直接断开，要先停止接收新请求，等进行中的请求处理完再退出，并设置最长等待时间。\",\n\"f\": \"思路：用 signal.NotifyContext 监听 SIGINT、SIGTERM；在 goroutine 里启动 ListenAndServe；主流程等待信号，收到后调用 srv.Shutdown(ctx)，ctx 带超时（如 10 秒）。Shutdown 会先关闭监听、停止接收新连接，再等待正在处理的请求完成，超时则返回错误。ListenAndServe 在 Shutdown 后会返回 http.ErrServerClosed，这属于正常关闭，不应当作异常。其他需要一并关闭的资源（后台 goroutine、数据库连接、消息消费者）也要在此统一收尾。\",\n\"c\": \"<pre>func main() {\\n\\tsrv := &amp;http.Server{Addr: &quot;:8080&quot;, Handler: mux}\\n\\n\\tctx, stop := signal.NotifyContext(context.Background(), os.Interrupt, syscall.SIGTERM)\\n\\tdefer stop()\\n\\n\\tgo func() {\\n\\t\\tif err := srv.ListenAndServe(); err != nil &amp;&amp; !errors.Is(err, http.ErrServerClosed) {\\n\\t\\t\\tlog.Fatal(err)\\n\\t\\t}\\n\\t}()\\n\\n\\t&lt;-ctx.Done() // 等待退出信号\\n\\n\\tshutdownCtx, cancel := context.WithTimeout(context.Background(), 10*time.Second)\\n\\tdefer cancel()\\n\\tif err := srv.Shutdown(shutdownCtx); err != nil {\\n\\t\\tlog.Println(&quot;shutdown:&quot;, err)\\n\\t}\\n}<\/pre>\",\n\"a\": \"Shutdown 和 Close 的区别？（Shutdown 优雅等待，Close 立即关闭）长连接（WebSocket、SSE）怎么处理？（Shutdown 不会处理被劫持的连接，需要自己通知并关闭）\",\n\"L\": [\n\"业务场景\",\n\"解题思路\",\n\"参考代码\",\n\"面试官常见追问\"\n]\n},\n\"story\": [\n[\nnull,\n\"第八道题：工坊要下班了，不能把正在办事的客人直接赶出门。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“srv.Shutdown 做了什么？”\",\n\"o\": [\n[\n\"停止接收新连接，等待进行中的请求处理完成（直到 ctx 超时）。\",\n1,\n\"“超时了怎么办？”“返回错误，之后可以调用 Close 强制关闭。”\"\n],\n[\n\"立即关闭所有连接。\",\n0,\n\"“那是 Close。”\"\n],\n[\n\"只关闭监听，不管进行中的请求。\",\n0,\n\"“Shutdown 会等待请求结束。”\"\n]\n],\n\"n\": \"考点：Shutdown 优雅关闭，等待进行中的请求；Close 立即关闭。\"\n},\n{\n\"s\": \"考官：“为什么要判断 err 不是 http.ErrServerClosed？”\",\n\"o\": [\n[\n\"调用 Shutdown 后 ListenAndServe 会返回该错误，属于正常关闭，不应当作异常退出。\",\n1,\n\"“其他错误呢？”“比如端口被占用，应该记录并退出。”\"\n],\n[\n\"它表示端口被占用。\",\n0,\n\"“端口被占用是别的错误。”\"\n],\n[\n\"它表示证书错误。\",\n0,\n\"“与证书无关。”\"\n]\n],\n\"n\": \"考点：Shutdown 后 ListenAndServe 返回 ErrServerClosed，属于正常关闭。\"\n}\n]\n},\n{\n\"t\": \"终题　综合：业务代码大考\",\n\"d\": \"重试、竞态与 goroutine 泄漏\",\n\"tags\": [],\n\"card\": {\n\"p\": \"实训场的最后一场考试：不要求默写代码，要求能说出每种写法的坑在哪里。\",\n\"f\": \"思路：看到并发代码，先问三件事：谁在写共享数据（竞态）？每个 goroutine 什么时候退出（泄漏）？失败和取消如何传播（ctx 与错误处理）？\",\n\"c\": \"常见坑总结：向无人接收的 channel 发送；从永远不会关闭的 channel 接收；多个发送者重复关闭 channel；Get 类读操作其实修改了结构却用读锁；循环变量被闭包共享（Go 1.22 前）；忘记 cancel 导致资源泄漏。\",\n\"a\": \"线上怎么发现这些问题？（go test -race、pprof 的 goroutine 与 mutex profile、日志与 trace）\",\n\"L\": [\n\"业务场景\",\n\"解题思路\",\n\"参考代码\",\n\"面试官常见追问\"\n]\n},\n\"story\": [\n[\nnull,\n\"最后一场考试，考官不让写代码，只让你指出每段代码的坑。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“调用下游接口失败后要重试，怎么设计比较合理？”\",\n\"o\": [\n[\n\"指数退避加随机抖动，限制重试次数，只对幂等操作和可重试的错误重试，并尊重 ctx 的取消。\",\n1,\n\"“为什么要抖动？”“避免大量客户端同时重试造成雪崩。”\"\n],\n[\n\"失败后立即无限重试。\",\n0,\n\"“会把下游打垮。”\"\n],\n[\n\"固定间隔重试所有错误，包括 4xx。\",\n0,\n\"“4xx 通常不应该重试。”\"\n]\n],\n\"n\": \"考点：重试要退避、限次数、区分错误类型、保证幂等、响应取消。\"\n},\n{\n\"s\": \"考官：“多个 goroutine 同时更新一个共享 map 和计数器，怎么发现并修复数据竞争？”\",\n\"o\": [\n[\n\"用 go test -race 或 go run -race 发现；用 Mutex、atomic 或 sync.Map 修复。\",\n1,\n\"“只在测试里开 -race 就够吗？”“还要在压测和预发环境跑。”\"\n],\n[\n\"在代码里加 time.Sleep。\",\n0,\n\"“不能消除竞争。”\"\n],\n[\n\"只在生产环境加日志观察。\",\n0,\n\"“竞态很难靠日志发现。”\"\n]\n],\n\"n\": \"考点：-race 发现竞态；用锁或 atomic 修复。\"\n},\n{\n\"s\": \"考官：“goroutine 泄漏常见的场景有哪些？”\",\n\"o\": [\n[\n\"向无人接收的 channel 发送、从永远不会被关闭的 channel 接收、没有退出条件的循环、没有响应 ctx 取消。\",\n1,\n\"“怎么排查？”“pprof 的 goroutine profile。”\"\n],\n[\n\"函数返回后 goroutine 会被自动回收。\",\n0,\n\"“不会，除非它自己退出。”\"\n],\n[\n\"使用了 WaitGroup 就一定不会泄漏。\",\n0,\n\"“WaitGroup 只负责等待，不保证 goroutine 能退出。”\"\n]\n],\n\"n\": \"考点：泄漏源于阻塞的收发与缺少退出条件；用 pprof 排查。\"\n}\n]\n}\n]\n;\nconst $=id=>document.getElementById(id);\nlet done=[];try{done=JSON.parse(localStorage.getItem(\"gocode-done\")||\"[]\")}catch(e){}\nfunction save(){try{localStorage.setItem(\"gocode-done\",JSON.stringify(done))}catch(e){}}\nfunction show(id){document.querySelectorAll(\".screen\").forEach(s=>s.classList.toggle(\"on\",s.id===id))}\nlet ch=0,i=0,q=[],ok=0,wrong=[],fromGame=false;\nfunction menu(){\n  const got=C.filter((c,n)=>done.includes(n)).flatMap(c=>c.tags),all=C.flatMap(c=>c.tags).concat(PLAN);\n  $(\"cov\").innerHTML=`<div style=\"font:14px system-ui,sans-serif;color:var(--dim)\">知识点覆盖 ${got.length} / ${all.length}（本部规划中，后续章节陆续追加）<\/div><div class=\"bar\"><i style=\"width:${got.length/all.length*100}%\"><\/i><\/div>`;\n  $(\"chips\").innerHTML=all.map(t=>`<span class=\"${got.includes(t)?\"on\":\"\"}\">${t}<\/span>`).join(\"\");\n  $(\"list\").innerHTML=\"\";C.forEach((c,n)=>{const b=document.createElement(\"button\");b.className=\"ch\"+(done.includes(n)?\" done\":\"\");\n    b.innerHTML=`<b>${c.t}<\/b><span>${c.d}<\/span>`;b.onclick=()=>{ch=n;fromGame=false;card()};$(\"list\").appendChild(b)});\n  show(\"menu\");\n}\nfunction card(){\n  const c=C[ch],k=c.card;\n  $(\"cardbody\").innerHTML=`<h2>${c.t}<\/h2><div class=\"sub\">知识卡：${c.d}<\/div>\n   <details open><summary>${(k.L||[])[0]||'大白话'}<\/summary><p>${k.p}<\/p><\/details>\n   <details open><summary>${(k.L||[])[1]||'正经解释'}<\/summary><p>${k.f}<\/p><\/details>\n   <details open><summary>${(k.L||[])[2]||'对比与适用场景'}<\/summary><p>${k.c}<\/p><\/details>\n   <details open><summary>${(k.L||[])[3]||'面试官常见追问'}<\/summary><p>${k.a}<\/p><\/details>\n   <button class=\"go\" id=\"goOn\">${fromGame?\"回到剧情\":\"进入剧情\"}<\/button><button class=\"go alt\" id=\"cb\">返回目录<\/button>`;\n  $(\"goOn\").onclick=()=>fromGame?show(\"game\"):start();$(\"cb\").onclick=menu;show(\"card\");\n}\nfunction start(){\n  const c=C[ch];q=[];ok=0;wrong=[];i=0;\n  c.story.forEach(l=>q.push({k:\"l\",w:l[0],t:l[1]}));\n  c.qs.forEach(x=>{q.push({k:\"l\",w:\"考官\",t:x.s});q.push({k:\"c\",x})});q.push({k:\"end\"});\n  $(\"title\").textContent=c.t;$(\"title\").style.animation=\"none\";void $(\"title\").offsetWidth;$(\"title\").style.animation=\"\";\n  $(\"choices\").innerHTML=\"\";$(\"sc\").textContent=\"答对 0 / \"+c.qs.length;fromGame=true;show(\"game\");line(null,\"点击对话框开始。\");\n}\nfunction line(w,t,note){$(\"who\").textContent=w||\"\";$(\"who\").className=w===\"考官\"?\"int\":w===\"我\"?\"me\":\"\";$(\"txt\").textContent=t;$(\"txt\").className=note?\"note\":\"\"}\nfunction next(){\n  if($(\"choices\").children.length)return;const n=q[i++];if(!n)return;\n  if(n.k===\"l\")line(n.w,n.t,n.note);else if(n.k===\"c\")ask(n.x);else finish();\n}\nfunction ask(x){\n  line(\"考官\",x.s);const c=$(\"choices\");c.innerHTML=\"\";\n  x.o.forEach(o=>{const b=document.createElement(\"button\");b.className=\"opt\";b.textContent=o[0];\n    b.onclick=()=>{c.innerHTML=\"\";if(o[1])ok++;else wrong.push(x.n);\n      $(\"sc\").textContent=\"答对 \"+ok+\" / \"+C[ch].qs.length;\n      q.splice(i,0,{k:\"l\",w:\"我\",t:o[0]},{k:\"l\",w:\"考官\",t:o[2]},{k:\"l\",w:null,t:(o[1]?\"答对了。\":\"答错了。\")+\"\\n\"+x.n,note:1});next()};\n    c.appendChild(b)});\n}\nfunction finish(){\n  const c=C[ch],pass=ok===c.qs.length;if(pass&&!done.includes(ch)){done.push(ch);save()}\n  $(\"endbody\").innerHTML=`<h2 style=\"margin:0 0 4px\">${pass?\"本章通关\":\"差一点，再看一遍知识卡\"}<\/h2>\n   <div style=\"color:var(--dim)\">答对 ${ok} / ${c.qs.length}<\/div>\n   ${wrong.length?\"<p>需要巩固：<\/p><ul>\"+wrong.map(w=>`<li>${w}<\/li>`).join(\"\")+\"<\/ul>\":\"<p>本章全部答对。<\/p>\"}\n   <button class=\"go\" id=\"r1\">重玩本章<\/button>${pass&&ch<C.length-1?'<button class=\"go\" id=\"r2\">下一章<\/button>':\"\"}\n   <button class=\"go alt\" id=\"r3\">回目录<\/button>`;\n  $(\"r1\").onclick=start;$(\"r3\").onclick=menu;if($(\"r2\"))$(\"r2\").onclick=()=>{ch++;fromGame=false;card()};show(\"end\");\n}\n$(\"box\").onclick=next;$(\"back\").onclick=menu;$(\"kc\").onclick=card;\ndocument.addEventListener(\"keydown\",e=>{if((e.key===\" \"||e.key===\"Enter\")&&document.activeElement.tagName!==\"BUTTON\"&&$(\"game\").classList.contains(\"on\")){e.preventDefault();next()}});\nmenu();\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "ch09", "num": "09", "title": "补遗阁 · 高频八股补遗", "name": "补遗阁", "sub": "高频八股补遗。把小红书上常见、之前没覆盖或覆盖不深的题单独补在这里。每章仍是知识卡、剧情、面试关。剧情顺序就是知识的依赖顺序。", "colors": {"bg": "#1a1424", "bg2": "#3b2552", "gold": "#ff9ecb"}, "html": "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>补遗阁 · 高频八股补遗<\/title>\n<style>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);\n--bg:#1a1424;--bg2:#3b2552;--ink:#ece6d2;--dim:#9b9884;--gold:#ff9ecb;--red:#d8664b;--ok:#7fc096;--box:rgba(18,10,26,.9);--line:rgba(236,230,210,.2)}\n:root[data-theme=\"dark\"]{--bg:#1a1424}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#1a1424}}\n*,*::before,*::after{box-sizing:inherit}\nhtml{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.8 \"Songti SC\",\"Noto Serif SC\",\"Source Han Serif SC\",serif;overflow:hidden}\n#app{height:100%;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 0%,var(--bg2),var(--bg))}\nbutton{font:inherit;color:inherit;cursor:pointer}\nbutton:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}\n.screen{display:none;flex:1;min-height:0;flex-direction:column}.screen.on{display:flex}\n.wrap{width:100%;max-width:680px;margin:0 auto;padding:6vh 20px 24px;overflow-y:auto}\nh1{font-size:clamp(32px,9vw,48px);line-height:1.15;margin:0 0 6px;letter-spacing:.06em;font-weight:900}\n.sub{color:var(--dim);font-size:15px;margin:0 0 18px}\n.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 10px}\n.bar i{display:block;height:100%;background:var(--gold)}\n.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px;font:12px/1 system-ui,sans-serif}\n.chips span{padding:5px 8px;border:1px dashed var(--line);border-radius:12px;color:var(--dim)}\n.chips span.on{border:1px solid var(--gold);color:var(--gold)}\n.ch{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:6px;padding:13px 16px;margin-bottom:12px}\n.ch:hover{border-color:var(--gold)}.ch b{display:block;font-size:18px}.ch span{color:var(--dim);font-size:14px}\n.ch.done b::after{content:\" 已通关\";color:var(--ok);font-size:13px;font-weight:400}\n/* card */\n#card h2{font-size:24px;margin:0 0 4px}\ndetails{border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:10px 0;background:rgba(255,255,255,.03)}\nsummary{cursor:pointer;font:700 14px/1.6 system-ui,sans-serif;color:var(--gold)}\ndetails p{margin:8px 0 2px;font-size:16px}\n.go{background:var(--gold);color:#2a0a1c;border:0;border-radius:6px;padding:11px 20px;font-weight:700;margin:10px 10px 0 0}\n.go.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}\n/* game */\n#hud{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;font:14px/1 system-ui,sans-serif;color:var(--dim)}\n#hud button{background:none;border:0;color:var(--dim);padding:6px 0}\n#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 24px;text-align:center}\n#title{font-size:clamp(24px,6.5vw,36px);font-weight:900;line-height:1.3;letter-spacing:.05em;animation:rise 1s both}\n@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}\n@media (prefers-reduced-motion:reduce){#title{animation:none}}\n#choices{padding:0 16px 8px;display:flex;flex-direction:column;gap:10px;max-width:680px;width:100%;margin:0 auto}\n.opt{background:var(--box);border:1px solid var(--gold);border-radius:6px;padding:12px 14px;text-align:left;line-height:1.6}\n.opt:hover{background:rgba(255,158,203,.14)}\n#box{margin:8px 12px 14px;max-width:680px;width:calc(100% - 24px);align-self:center;min-height:132px;background:var(--box);border:1px solid var(--line);border-radius:8px;padding:14px 18px 20px;text-align:left;cursor:pointer;position:relative}\n#who{font:700 14px/1 system-ui,sans-serif;color:var(--gold);margin-bottom:8px;min-height:14px}\n#who.int{color:var(--red)}#who.me{color:var(--ok)}\n#txt{font-size:17px;white-space:pre-wrap}#txt.note{color:var(--gold)}\n#tap{position:absolute;right:14px;bottom:6px;color:var(--dim);font:12px system-ui,sans-serif}\n#end ul{padding-left:20px}#end li{margin-bottom:10px}\n<\/style>\n<\/head>\n<body>\n<div id=\"app\">\n <div id=\"menu\" class=\"screen on\"><div class=\"wrap\">\n  <h1>补遗阁<\/h1>\n  <p class=\"sub\">高频八股补遗。把小红书上常见、之前没覆盖或覆盖不深的题单独补在这里。每章仍是知识卡、剧情、面试关。剧情顺序就是知识的依赖顺序。<\/p>\n  <div id=\"cov\"><\/div><div id=\"chips\" class=\"chips\"><\/div><div id=\"list\"><\/div>\n <\/div><\/div>\n <div id=\"card\" class=\"screen\"><div class=\"wrap\" id=\"cardbody\"><\/div><\/div>\n <div id=\"game\" class=\"screen\">\n  <div id=\"hud\"><button id=\"back\">返回<\/button><button id=\"kc\">看知识卡<\/button><span id=\"sc\"><\/span><\/div>\n  <div id=\"stage\"><div id=\"title\"><\/div><\/div>\n  <div id=\"choices\"><\/div>\n  <div id=\"box\"><div id=\"who\"><\/div><div id=\"txt\"><\/div><span id=\"tap\">点击继续<\/span><\/div>\n <\/div>\n <div id=\"end\" class=\"screen\"><div class=\"wrap\" id=\"endbody\"><\/div><\/div>\n<\/div>\n<script>\nconst PLAN=[];\nconst C=[\n{\n\"t\": \"补1　进程、线程、协程\",\n\"d\": \"操作系统：区别与联系，线程上下文切换占用哪些资源\",\n\"tags\": [\n\"进程线程协程的区别\",\n\"线程切换的开销\"\n],\n\"card\": {\n\"p\": \"进程是一座独立的院子，线程是院子里的几个工人，协程是工人手里一张张可以随时切换的任务单。院子之间有高墙，工人共用院子里的东西。\",\n\"f\": \"进程：资源分配的基本单位，有独立的地址空间。线程：CPU 调度的基本单位，同一进程内的线程共享地址空间（堆、全局数据、文件描述符），各自拥有独立的栈、寄存器和程序计数器。协程：运行在线程之上、由用户态调度的轻量执行流，goroutine 初始栈约 2KB 且可增长，线程栈通常是 MB 级。线程切换要保存和恢复寄存器、程序计数器、栈指针，进入内核态完成调度；同进程线程切换不换页表，跨进程才需要换页表并可能使 TLB 失效；隐性代价是缓存变冷。\",\n\"c\": \"创建与切换成本：进程 > 线程 > 协程。隔离性：进程最强，一个进程崩溃一般不影响其他进程；线程崩溃可能带崩整个进程。通信：进程要用 IPC，线程直接共享内存但要同步。联系：线程是进程内的执行流，协程调度在线程之上（M:N）。goroutine 与线程的区别：栈小可增长、用户态切换、由 Go 运行时调度、数量可达百万级，线程由内核调度。\",\n\"a\": \"协程为什么切换更快？（用户态完成，不进内核，不换页表）为什么线程不能无限多？（栈内存、调度开销、切换成本）\"\n},\n\"story\": [\n[\nnull,\n\"一座院子里，几个工人共用一个仓库，各自手里有一张任务单。\"\n]\n],\n\"qs\": [\n{\n\"s\": \"考官：“同一进程内的线程，哪些是共享的，哪些是私有的？”\",\n\"o\": [\n[\n\"共享堆、全局数据、文件描述符等地址空间资源；私有栈、寄存器和程序计数器。\",\n1,\n\"“线程切换比进程切换轻在哪？”“不用换页表，TLB 不必失效。”\"\n],\n[\n\
